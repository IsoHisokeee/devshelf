name: Deploy DevShelf to Beget

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "playground.html"
      - "playground.css"
      - "playground.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beget-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DevShelf
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Upload the six site files over encrypted FTP
        env:
          BEGET_FTP_HOST: ${{ secrets.BEGET_FTP_HOST }}
          BEGET_FTP_PORT: ${{ secrets.BEGET_FTP_PORT }}
          BEGET_FTP_USERNAME: ${{ secrets.BEGET_FTP_USERNAME }}
          BEGET_FTP_PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import ftplib
          import os
          import ssl
          from pathlib import Path

          required = ("BEGET_FTP_HOST", "BEGET_FTP_USERNAME", "BEGET_FTP_PASSWORD")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Configure these GitHub Actions secrets before deployment: "
                  + ", ".join(missing)
              )

          host = os.environ["BEGET_FTP_HOST"]
          port = int(os.environ.get("BEGET_FTP_PORT") or "21")
          username = os.environ["BEGET_FTP_USERNAME"]
          password = os.environ["BEGET_FTP_PASSWORD"]
          files = (
              "index.html",
              "styles.css",
              "script.js",
              "playground.html",
              "playground.css",
              "playground.js",
          )

          context = ssl.create_default_context()
          with ftplib.FTP_TLS(context=context, timeout=30) as ftp:
              ftp.connect(host, port)
              ftp.login(username, password)
              ftp.prot_p()
              for name in files:
                  path = Path(name)
                  if not path.is_file():
                      raise SystemExit(f"Required site file is missing: {name}")
                  with path.open("rb") as stream:
                      ftp.storbinary(f"STOR {name}", stream)
                  print(f"Uploaded {name}")
          PY
