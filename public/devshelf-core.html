<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVSHELF // Автономная инженерная база (276 тем)</title>
  <style>
    :root {
      --bg: #09090b;
      --panel: #111317;
      --card: #15181f;
      --border: #27272a;
      --yellow: #facc15;
      --yellow-glow: rgba(250, 204, 21, 0.15);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --font-mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      background-image:
        linear-gradient(to right, rgba(250, 204, 21, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(250, 204, 21, 0.02) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--yellow);
      padding-bottom: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-badge {
      background: var(--yellow);
      color: #000;
      font-weight: 900;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 4px;
      font-family: var(--font-mono);
      letter-spacing: -0.5px;
    }
    .logo-title { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
    .logo-sub { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }
    .search-bar { width: 100%; max-width: 520px; display: flex; gap: 8px; }
    .search-input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--yellow); box-shadow: 0 0 0 2px var(--yellow-glow); }
    .cats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .cat-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
      font-weight: 600;
    }
    .cat-btn:hover { border-color: var(--yellow); color: #fff; }
    .cat-btn.active { background: var(--yellow); color: #000; border-color: var(--yellow); font-weight: 800; }
    .count-stat { font-family: var(--font-mono); font-size: 13px; color: var(--yellow); font-weight: 700; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .item {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .item:hover { border-color: var(--yellow); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
    .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .item h4 { font-size: 15px; color: #fff; font-weight: 700; line-height: 1.3; }
    .tag {
      background: var(--yellow-glow);
      color: var(--yellow);
      border: 1px solid rgba(250, 204, 21, 0.35);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .item p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }
    .modal-bg[hidden] { display: none !important; }
    .modal {
      background: #111317;
      border: 1px solid var(--yellow);
      width: 100%;
      max-width: 1200px;
      max-height: 92vh;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: #161920;
    }
    .modal-header h2 { font-size: 18px; color: #fff; font-weight: 800; }
    .close-btn {
      background: var(--yellow);
      border: none;
      color: #000;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .modal-body {
      padding: 18px 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media(max-width: 900px) { .modal-body { grid-template-columns: 1fr; } }
    .info-box {
      background: #090a0d;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .info-box h5 {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      color: var(--yellow);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .info-box p, .info-box ul { font-size: 13px; color: #d4d4d8; line-height: 1.5; }
    .info-box ul { padding-left: 18px; }
    .code-panel { display: flex; flex-direction: column; gap: 8px; }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090a0d;
      border: 1px solid var(--border);
      border-bottom: none;
      padding: 6px 10px;
      border-radius: 6px 6px 0 0;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tabs { display: flex; gap: 4px; }
    .tab-btn {
      background: #161920;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
    }
    .tab-btn.active { background: var(--yellow); color: #000; border-color: var(--yellow); font-weight: 800; }
    .copy-btn {
      background: #161920;
      border: 1px solid var(--border);
      color: var(--yellow);
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 4px;
      font-family: var(--font-mono);
      cursor: pointer;
    }
    pre {
      background: #090a0d;
      border: 1px solid var(--border);
      border-radius: 0 0 6px 6px;
      padding: 14px;
      color: #facc15;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.5;
      overflow-x: auto;
      max-height: 280px;
      white-space: pre-wrap;
    }
    .preview-box {
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 10px;
      background: #090a0d;
    }
    .preview-label {
      background: #161920;
      padding: 6px 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }
    iframe { width: 100%; height: 240px; border: none; display: block; background: #101216; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-badge">&lt;/&gt;</div>
      <div>
        <div class="logo-title">DEVSHELF // DESKTOP STANDALONE</div>
        <div class="logo-sub">Инженерный справочник &bull; 276 тем &bull; Автономный режим</div>
      </div>
    </div>
    <div class="search-bar">
      <input id="q" class="search-input" type="search" placeholder="Поиск по 276 темам (border-radius, вход, tailwind, react, fetch, flex)...">
    </div>
  </div>

  <div class="cats" id="cats">
    <button class="cat-btn active" data-c="all">Все (276)</button>
    <button class="cat-btn" data-c="html">HTML5</button>
    <button class="cat-btn" data-c="css">CSS3</button>
    <button class="cat-btn" data-c="javascript">JavaScript</button>
    <button class="cat-btn" data-c="frameworks">Фреймворки</button>
    <button class="cat-btn" data-c="recipes">Рецепты</button>
    <button class="cat-btn" data-c="php">PHP &amp; MySQL</button>
    <button class="cat-btn" data-c="xml">XML &amp; SEO</button>

  <div class="modal-bg" id="modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="close-btn" onclick="document.getElementById('modal').hidden = true">✕ Закрыть</button>
      </div>
      <div class="modal-body">
        <div>
          <div class="info-box"><h5>Назначение</h5><p id="modal-desc"></p></div>

        </div>
        <div class="code-panel">
          <div class="code-header">
            <div class="tabs" id="tabs">
              <button class="tab-btn active" data-p="combined">Все вместе</button>

            <div class="preview-label">
              <span>ИНТЕРАКТИВНЫЙ ПРЕДПРОСМОТР</span>

            <iframe id="modal-frame" sandbox="allow-scripts"></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TOPICS = [{"id":"css-border-radius","lang":"css","title":"CSS: скругление углов (border-radius)","summary":"Свойство для скругления одного или всех четырёх углов элемента: от строгих карточек и кнопок до идеальных кругов, капсул (pill) и асимметричных форм.","tags":["css","border-radius","скругление","углы","круг","pill","форма"],"when":"Для всех современных UI-компонентов: карточек (6px–14px), кнопок (4px–10px), тегов-капсул (9999px) и круглых аватарок (50%).","alternatives":"Для сложных многоугольников и срезанных индустриальных углов используйте свойство clip-path: polygon(...).","points":["Одно значение (border-radius: 12px) задаёт одинаковое скругление для всех 4 углов.","Четыре значения (border-radius: 16px 4px 16px 4px) задают углы по часовой стрелке: верхний-левый, верхний-правый, нижний-правый, нижний-левый.","Значение 50% превращает квадратный блок (с aspect-ratio: 1) в идеальный круг.","Значение 9999px (или 100vmax) создаёт форму капсулы (pill) независимо от ширины и высоты кнопки.","Вложенные карточки: радиус внутреннего блока должен быть равен радиусу внешнего минус padding (r_inner = r_outer - padding)."],"code":"/* 1. Индустриальная карточка */\n.card {\n  border-radius: 10px;\n  border: 1px solid #3f3f46;\n  padding: 14px 18px;\n  background: #18181b;\n  color: #f4f4f5;\n}\n\n/* 2. Кнопка-капсула (Pill) */\n.pill-btn {\n  border-radius: 9999px;\n  padding: 9px 20px;\n  background: #facc15;\n  color: #09090b;\n  font-weight: 800;\n  border: none;\n  cursor: pointer;\n}\n\n/* 3. Круглая аватарка */\n.avatar {\n  width: 52px;\n  height: 52px;\n  border-radius: 50%;\n  background: #27272a;\n  border: 2px solid #facc15;\n  color: #facc15;\n  display: inline-grid;\n  place-items: center;\n  font-weight: 800;\n}\n\n/* 4. Асимметричная форма (4 угла по часовой стрелке) */\n.organic-badge {\n  border-radius: 20px 2px 20px 2px;\n  padding: 10px 18px;\n  background: rgba(250, 204, 21, 0.12);\n  border: 1px solid #facc15;\n  color: #fef08a;\n}","example":"\u003cdiv style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:center;\">\n  \u003cdiv class=\"card\">Карточка (10px)\u003c/div>\n  \u003cbutton class=\"pill-btn\">Капсула (9999px)\u003c/button>\n  \u003cdiv class=\"avatar\">DS\u003c/div>\n  \u003cdiv class=\"organic-badge\">20px 2px 20px 2px\u003c/div>\n\u003c/div>"},{"id":"css-border","lang":"css","title":"CSS: границы элементов (border, border-style, border-color)","summary":"Универсальное свойство для задания толщины, стиля (solid, dashed, dotted) и цвета рамки вокруг элемента или его отдельных сторон.","tags":["css","border","граница","рамка","border-width","border-color","border-style","dashed"],"when":"Для визуального разделения карточек, полей ввода (input), технических таблиц, цитат и зон загрузки файлов (dashed).","alternatives":"Используйте outline для подсветки фокуса (не влияет на размеры блока) или box-shadow: 0 0 0 1px для субпиксельных рамок.","points":["Краткая запись: border: 1px solid #3f3f46 (толщина, стиль, цвет).","Без указания border-style (например, solid или dashed) рамка не отобразится, так как по умолчанию стиль равен none.","Можно задавать отдельные стороны: border-top, border-bottom, border-left, border-right или логические свойства border-inline, border-block.","При box-sizing: border-box толщина border включается в общую ширину и высоту элемента и не ломает сетку."],"code":"/* Тонкая техническая рамка карточки */\n.box-solid {\n  border: 1px solid rgba(250, 204, 21, 0.45);\n  border-radius: 6px;\n  padding: 14px;\n  background: #18181b;\n  color: #f4f4f5;\n}\n\n/* Пунктирная зона для Drag-and-Drop загрузки */\n.box-dashed {\n  border: 2px dashed #facc15;\n  border-radius: 6px;\n  padding: 14px;\n  background: rgba(250, 204, 21, 0.06);\n  color: #fef08a;\n}\n\n/* Акцентная индустриальная полоса слева */\n.box-left {\n  border-left: 4px solid #facc15;\n  padding: 12px 14px;\n  background: #27272a;\n  color: #f4f4f5;\n}","example":"\u003cdiv style=\"display:grid;gap:12px;\">\n  \u003cdiv class=\"box-solid\">1px solid — стандартная рамка интерфейса\u003c/div>\n  \u003cdiv class=\"box-dashed\">2px dashed — пунктирная область для файлов\u003c/div>\n  \u003cdiv class=\"box-left\">border-left: 4px solid — индустриальный маркер\u003c/div>\n\u003c/div>"},{"id":"css-outline","lang":"css","title":"CSS: внешний контур фокуса (outline и outline-offset)","summary":"Внешняя обводка элемента, которая рисуется поверх соседних блоков, не занимает места в потоке (не сдвигает верстку) и отвечает за доступность клавиатурного фокуса.","tags":["css","outline","outline-offset","focus-visible","фокус","обводка"],"when":"Для стилизации состояния :focus-visible у кнопок, ссылок и полей ввода без изменения их геометрии.","alternatives":"Никогда не пишите outline: none без замены на кастомный :focus-visible, иначе пользователи с клавиатурой потеряют навигацию.","points":["В отличие от border, свойство outline не влияет на размеры элемента и никогда не вызывает сдвиг соседних элементов.","Свойство outline-offset позволяет отодвинуть контур от края кнопки (например, на 2px–4px) или сдвинуть внутрь (отрицательное значение).","В современных браузерах outline автоматически повторяет скругление border-radius элемента."],"code":".focus-demo-btn {\n  padding: 10px 18px;\n  border-radius: 6px;\n  background: #facc15;\n  color: #09090b;\n  font-weight: 800;\n  border: none;\n  outline: 2px solid #facc15;\n  outline-offset: 4px;\n  cursor: pointer;\n}","example":"\u003cdiv style=\"padding:16px;\">\n  \u003cbutton class=\"focus-demo-btn\">Кнопка с outline-offset: 4px\u003c/button>\n\u003c/div>"},{"id":"css-box-shadow","lang":"css","title":"CSS: многослойные тени и жёсткие индустриальные тени (box-shadow)","summary":"Добавление мягких или жёстких смещённых теней (brutalist/industrial offset) и внутренних (inset) свечений к блокам.","tags":["css","box-shadow","тень","inset","свечение","elevation"],"when":"Для выделения модальных окон, выпадающих списков, карточек при наведении и тактильных кнопок.","alternatives":"Для теней вокруг прозрачных PNG/SVG-иконок используйте filter: drop-shadow(...), так как box-shadow рисует тень по прямоугольной рамке.","points":["Синтаксис: смещение-X, смещение-Y, размытие (blur), растяжение (spread), цвет.","При blur: 0px (например, box-shadow: 4px 4px 0 #facc15) получается чёткая техно-индустриальная тень.","Через запятую можно комбинировать несколько слоёв теней для реалистичного объёма."],"code":".elevated-card {\n  padding: 18px 20px;\n  border-radius: 6px;\n  background: #18181b;\n  color: #f4f4f5;\n  border: 1px solid #facc15;\n  box-shadow: 5px 5px 0px #facc15;\n}","example":"\u003cdiv style=\"padding:12px;\">\n  \u003cdiv class=\"elevated-card\">Техно-индустриальная карточка с жёсткой тенью 5px 5px 0 #facc15\u003c/div>\n\u003c/div>"},{"id":"css-margin-padding","lang":"css","title":"CSS: внешние и внутренние отступы (margin и padding)","summary":"Фундаментальные свойства управления пространством: padding задаёт воздух внутри рамки блока, а margin — расстояние между соседними блоками.","tags":["css","margin","padding","отступы","margin-inline","padding-inline"],"when":"Во всех без исключения компонентах: padding для внутреннего комфорта карточки/кнопки, margin: 0 auto для центрирования контейнера.","alternatives":"Для отступов между элементами внутри Flexbox и Grid предпочтительнее использовать свойство gap вместо margin у дочерних элементов.","points":["padding увеличивает кликабельную зону кнопок и ссылок и закрашивается фоном элемента (background).","margin создаёт прозрачный буфер снаружи рамки border; вертикальные margin соседних блоков могут схлопываться.","Логические свойства padding-inline (слева/справа) и padding-block (сверху/снизу) удобнее классической записи из 4 чисел."],"code":".container-card {\n  max-width: 420px;\n  margin-inline: auto; /* Центрирование по горизонтали */\n  padding: 18px 22px;  /* 18px сверху/снизу, 22px слева/справа */\n  background: #18181b;\n  border: 1px solid #3f3f46;\n  border-left: 4px solid #facc15;\n  border-radius: 6px;\n  color: #f4f4f5;\n}"},{"id":"recipe-login-form","lang":"recipes","title":"Рецепт: Форма входа (Login / Авторизация + Показ пароля)","summary":"Готовая карточка входа в аккаунт с переключением видимости пароля, валидацией полей, чекбоксом «Запомнить меня» и индикацией загрузки.","tags":["рецепт","вход","логин","login","авторизация","форма входа","пароль","auth"],"when":"Для страниц входа в личный кабинет, админ-панель, SaaS-сервис или модального окна авторизации.","alternatives":"Можно дополнить кнопками OAuth (Войти через GitHub / Google) или беспарольным входом по одноразовому коду (OTP).","points":["Использует правильные атрибуты autocomplete=\"username\" и autocomplete=\"current-password\" для работы менеджеров паролей.","Кнопка переключения типа поля (password ↔ text) имеет aria-label для доступности.","При отправке формы выводит статус авторизации без перезагрузки страницы."],"code":"\u003cform class=\"login-card\" id=\"login-form\">\n  \u003cdiv class=\"login-head\">\n    \u003cspan class=\"login-tag\">AUTH // MODULE\u003c/span>\n    \u003ch3>Вход в систему\u003c/h3>\n    \u003cp>Введите данные вашего рабочего аккаунта\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"form-group\">\n    \u003clabel for=\"login-email\">Email адрес\u003c/label>\n    \u003cinput type=\"email\" id=\"login-email\" value=\"engineer@devshelf.ru\" required autocomplete=\"username\" placeholder=\"name@company.com\">\n  \u003c/div>\n\n  \u003cdiv class=\"form-group\">\n    \u003cdiv class=\"label-row\">\n      \u003clabel for=\"login-pass\">Пароль\u003c/label>\n      \u003ca href=\"#forgot\" class=\"forgot-link\">Сбросить доступ?\u003c/a>\n    \u003c/div>\n    \u003cdiv class=\"pass-wrap\">\n      \u003cinput type=\"password\" id=\"login-pass\" value=\"SecretPass2026\" required minlength=\"6\" autocomplete=\"current-password\">\n      \u003cbutton type=\"button\" id=\"toggle-pass\" class=\"eye-btn\" aria-label=\"Показать пароль\">Показать\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003clabel class=\"remember-row\">\n    \u003cinput type=\"checkbox\" checked>\n    \u003cspan>Запомнить терминал на 30 дней\u003c/span>\n  \u003c/label>\n\n  \u003cbutton type=\"submit\" class=\"submit-btn\" id=\"login-submit\">АВТОРИЗОВАТЬСЯ →\u003c/button>\n  \u003cdiv id=\"login-status\" class=\"login-status\" hidden>\u003c/div>\n\u003c/form>\n\n\u003cstyle>\n.login-card {\n  max-width: 360px;\n  margin: 0 auto;\n  padding: 20px;\n  background: #141619;\n  border: 1px solid #2e323b;\n  border-top: 3px solid #facc15;\n  border-radius: 6px;\n  color: #f4f4f5;\n  font-family: system-ui, sans-serif;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n.login-tag { font-family: monospace; font-size: 11px; color: #facc15; letter-spacing: 0.08em; }\n.login-head h3 { margin: 2px 0 4px; font-size: 18px; }\n.login-head p { margin: 0; font-size: 12.5px; color: #a1a1aa; }\n.form-group { display: flex; flex-direction: column; gap: 6px; }\n.form-group label { font-size: 12px; font-weight: 700; color: #d4d4d8; text-transform: uppercase; letter-spacing: 0.04em; }\n.label-row { display: flex; justify-content: space-between; align-items: center; }\n.forgot-link { font-size: 12px; color: #facc15; text-decoration: none; }\n.form-group input {\n  width: 100%;\n  padding: 10px 12px;\n  border-radius: 4px;\n  border: 1px solid #3f3f46;\n  background: #0c0d0f;\n  color: #f4f4f5;\n  font-size: 14px;\n  box-sizing: border-box;\n}\n.form-group input:focus { outline: none; border-color: #facc15; }\n.pass-wrap { position: relative; display: flex; align-items: center; }\n.pass-wrap input { padding-right: 82px; }\n.eye-btn {\n  position: absolute;\n  right: 6px;\n  padding: 5px 8px;\n  border-radius: 4px;\n  background: #27272a;\n  color: #e4e4e7;\n  border: 1px solid #3f3f46;\n  font-size: 11px;\n  cursor: pointer;\n}\n.remember-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #a1a1aa; cursor: pointer; }\n.submit-btn {\n  padding: 11px;\n  border-radius: 4px;\n  border: none;\n  background: #facc15;\n  color: #09090b;\n  font-weight: 800;\n  font-size: 13px;\n  letter-spacing: 0.04em;\n  cursor: pointer;\n}\n.login-status {\n  padding: 9px 12px;\n  border-radius: 4px;\n  background: rgba(250, 204, 21, 0.14);\n  border: 1px solid #facc15;\n  color: #fef08a;\n  font-size: 12.5px;\n}\n\u003c/style>\n\n\u003cscript>\nconst passInput = document.getElementById('login-pass');\nconst toggleBtn = document.getElementById('toggle-pass');\nconst loginForm = document.getElementById('login-form');\nconst statusBox = document.getElementById('login-status');\n\ntoggleBtn.addEventListener('click', () => {\n  const isPass = passInput.type === 'password';\n  passInput.type = isPass ? 'text' : 'password';\n  toggleBtn.textContent = isPass ? 'Скрыть' : 'Показать';\n});\n\nloginForm.addEventListener('submit', (e) => {\n  e.preventDefault();\n  statusBox.hidden = false;\n  statusBox.textContent = '✓ Доступ разрешён! Сессия инициализирована.';\n});\n\u003c/script>"},{"id":"recipe-register-form","lang":"recipes","title":"Рецепт: Регистрация с индикатором надёжности пароля","summary":"Интерактивная форма создания аккаунта с живой шкалой оценки сложности пароля (длина, цифры, спецсимволы) и проверкой в реальном времени.","tags":["рецепт","регистрация","signup","register","пароль","валидация","форма"],"when":"Для экранов регистрации пользователей, смены пароля в настройках профиля и онбординга.","alternatives":"Используйте OAuth 2.0 / Passkeys (WebAuthn), если хотите избавить пользователя от придумывания пароля.","points":["Оценивает пароль по 4 критериям в реальном времени при вводе (событие input).","Визуально меняет цвет прогресс-бара от красного (слабый) до жёлтого и изумрудного (надёжный).","Информирует пользователя, каких именно символов не хватает для защиты аккаунта."],"code":"\u003cdiv class=\"reg-card\">\n  \u003ch3>Регистрация инженера\u003c/h3>\n  \u003clabel class=\"reg-field\">\n    \u003cspan>Позывной / Имя\u003c/span>\n    \u003cinput type=\"text\" placeholder=\"Павел Пардаев\" value=\"Павел Разработчик\">\n  \u003c/label>\n  \u003clabel class=\"reg-field\">\n    \u003cspan>Ключ доступа (пароль)\u003c/span>\n    \u003cinput type=\"text\" id=\"reg-pass\" value=\"DevShelf#2026\" placeholder=\"Минимум 8 символов\">\n  \u003c/label>\n  \u003cdiv class=\"meter-bar\">\u003cdiv id=\"meter-fill\" class=\"meter-fill\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"meter-text\" class=\"meter-text\">Оценка пароля...\u003c/div>\n\u003c/div>\n\n\u003cstyle>\n.reg-card { max-width: 350px; margin: 0 auto; padding: 20px; background: #141619; border: 1px solid #2e323b; border-radius: 6px; color: #f4f4f5; font-family: system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px; }\n.reg-card h3 { margin: 0; font-size: 17px; }\n.reg-field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: #d4d4d8; }\n.reg-field input { padding: 9px 12px; border-radius: 4px; border: 1px solid #3f3f46; background: #0c0d0f; color: #fff; }\n.meter-bar { height: 6px; background: #27272a; border-radius: 2px; overflow: hidden; }\n.meter-fill { height: 100%; width: 0%; transition: width 0.25s, background 0.25s; }\n.meter-text { font-size: 12px; color: #a1a1aa; font-family: monospace; }\n\u003c/style>\n\n\u003cscript>\nconst input = document.getElementById('reg-pass');\nconst fill = document.getElementById('meter-fill');\nconst text = document.getElementById('meter-text');\n\nfunction checkStrength(val) {\n  let score = 0;\n  if (val.length >= 8) score++;\n  if (/[A-ZА-Я]/.test(val)) score++;\n  if (/[0-9]/.test(val)) score++;\n  if (/[^A-Za-zА-Яа-я0-9]/.test(val)) score++;\n\n  const levels = [\n    { w: '20%', c: '#ef4444', t: '[LOW] Слабый пароль (добавьте цифры/символы)' },\n    { w: '50%', c: '#f59e0b', t: '[MED] Средний уровень защиты' },\n    { w: '80%', c: '#facc15', t: '[HIGH] Хороший рабочий пароль' },\n    { w: '100%', c: '#22c55e', t: '[MAX] ✓ Отличный криптостойкий пароль' }\n  ];\n  const lvl = levels[Math.max(0, score - 1)];\n  fill.style.width = val ? lvl.w : '0%';\n  fill.style.background = lvl.c;\n  text.textContent = val ? lvl.t : 'Введите пароль';\n}\ninput.addEventListener('input', (e) => checkStrength(e.target.value));\ncheckStrength(input.value);\n\u003c/script>"},{"id":"recipe-otp-verification","lang":"recipes","title":"Рецепт: Ввод SMS / 2FA пин-кода из 4 цифр (OTP Input)","summary":"Удобное поле ввода проверочного кода с автоматическим переходом фокуса на следующую ячейку и поддержкой клавиши Backspace.","tags":["рецепт","otp","2fa","пин код","sms код","верификация","вход"],"when":"Для двухфакторной аутентификации (2FA), подтверждения телефона по SMS или кода из письма.","alternatives":"Одно обычное поле с inputmode=\"numeric\" и autocomplete=\"one-time-code\".","points":["При вводе цифры курсор мгновенно перепрыгивает в следующее поле без лишних кликов.","Нажатие Backspace в пустой ячейке возвращает фокус на предыдущую цифру.","Атрибут inputmode=\"numeric\" открывает крупную цифровую клавиатуру на мобильных устройствах."],"code":"\u003cdiv class=\"otp-card\">\n  \u003ch4>Двухфакторный код (2FA)\u003c/h4>\n  \u003cp>Введите 4-значный код подтверждения\u003c/p>\n  \u003cdiv class=\"otp-inputs\" id=\"otp-box\">\n    \u003cinput type=\"text\" maxlength=\"1\" inputmode=\"numeric\" value=\"7\">\n    \u003cinput type=\"text\" maxlength=\"1\" inputmode=\"numeric\" value=\"4\">\n    \u003cinput type=\"text\" maxlength=\"1\" inputmode=\"numeric\" value=\"9\">\n    \u003cinput type=\"text\" maxlength=\"1\" inputmode=\"numeric\" value=\"\">\n  \u003c/div>\n  \u003cdiv id=\"otp-result\" class=\"otp-hint\">Введите последнюю цифру...\u003c/div>\n\u003c/div>\n\n\u003cstyle>\n.otp-card { max-width: 320px; margin: 0 auto; padding: 20px; background: #141619; border: 1px solid #2e323b; border-radius: 6px; text-align: center; color: #f4f4f5; font-family: system-ui, sans-serif; }\n.otp-card h4 { margin: 0 0 6px; font-size: 16px; }\n.otp-card p { margin: 0 0 14px; font-size: 12.5px; color: #a1a1aa; }\n.otp-inputs { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }\n.otp-inputs input { width: 48px; height: 54px; text-align: center; font-size: 22px; font-weight: 800; border-radius: 4px; border: 1px solid #3f3f46; background: #0c0d0f; color: #facc15; font-family: monospace; }\n.otp-inputs input:focus { outline: none; border-color: #facc15; box-shadow: 0 0 0 2px rgba(250,204,21,0.2); }\n.otp-hint { font-size: 12.5px; color: #facc15; font-family: monospace; }\n\u003c/style>\n\n\u003cscript>\nconst inputs = [...document.querySelectorAll('#otp-box input')];\nconst res = document.getElementById('otp-result');\n\ninputs.forEach((inp, idx) => {\n  inp.addEventListener('input', (e) => {\n    e.target.value = e.target.value.replace(/[^0-9]/g, '');\n    if (e.target.value && idx \u003c inputs.length - 1) inputs[idx + 1].focus();\n    const code = inputs.map(i => i.value).join('');\n    res.textContent = code.length === 4 ? '✓ КОД ПОДТВЕРЖДЁН: ' + code : 'Ожидание ввода...';\n  });\n  inp.addEventListener('keydown', (e) => {\n    if (e.key === 'Backspace' && !inp.value && idx > 0) inputs[idx - 1].focus();\n  });\n});\n\u003c/script>"},{"id":"recipe-shopping-cart","lang":"recipes","title":"Рецепт: Интерактивная корзина товаров с пересчётом суммы","summary":"Готовый модуль корзины интернет-магазина с кнопками +/- количества и автоматическим форматированием стоимости.","tags":["рецепт","корзина","интернет-магазин","ecommerce","cart","калькулятор цены"],"when":"Для интернет-магазинов, конфигураторов оборудования, оформления заказа и мини-корзины.","alternatives":"Для сложных многостраничных магазинов состояние корзины синхронизируют с localStorage и серверной БД.","points":["Динамически пересчитывает подитог и общую сумму при изменении количества любого товара.","Форматирует валюту по русскому стандарту через Intl.NumberFormat(\"ru-RU\").","Не позволяет уменьшить количество товара ниже 1."],"code":"\u003cdiv class=\"cart-box\">\n  \u003ch4>Спецификация заказа\u003c/h4>\n  \u003cdiv id=\"cart-items\" class=\"cart-items\">\u003c/div>\n  \u003cdiv class=\"cart-footer\">\n    \u003cspan>Итого к оплате:\u003c/span>\n    \u003cstrong id=\"cart-total\">0 ₽\u003c/strong>\n  \u003c/div>\n\u003c/div>\n\n\u003cstyle>\n.cart-box { max-width: 380px; margin: 0 auto; padding: 18px; background: #141619; border: 1px solid #2e323b; border-radius: 6px; color: #f4f4f5; font-family: system-ui, sans-serif; }\n.cart-box h4 { margin: 0 0 12px; font-size: 16px; }\n.cart-items { display: flex; flex-direction: column; gap: 8px; }\n.cart-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #0c0d0f; border-radius: 4px; border: 1px solid #27272a; font-size: 13px; }\n.qty-ctrl { display: flex; align-items: center; gap: 8px; font-family: monospace; }\n.qty-btn { width: 26px; height: 26px; border-radius: 4px; border: 1px solid #3f3f46; background: #18181b; color: #facc15; cursor: pointer; font-weight: 700; }\n.cart-footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid #2e323b; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }\n.cart-footer strong { color: #facc15; font-size: 18px; font-family: monospace; }\n\u003c/style>\n\n\u003cscript>\nconst items = [\n  { id: 1, name: 'Лицензия DevShelf Pro', price: 1490, qty: 1 },\n  { id: 2, name: 'Индустриальный UI-кит', price: 990, qty: 2 }\n];\nconst listEl = document.getElementById('cart-items');\nconst totalEl = document.getElementById('cart-total');\n\nfunction renderCart() {\n  listEl.innerHTML = items.map(item => `\n    \u003cdiv class=\"cart-row\">\n      \u003cdiv>\n        \u003cdiv>\u003cstrong>${item.name}\u003c/strong>\u003c/div>\n        \u003cdiv style=\"color:#a1a1aa;font-size:12px;\">${item.price} ₽ / ед.\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"qty-ctrl\">\n        \u003cbutton class=\"qty-btn\" onclick=\"changeQty(${item.id}, -1)\">−\u003c/button>\n        \u003cspan>${item.qty}\u003c/span>\n        \u003cbutton class=\"qty-btn\" onclick=\"changeQty(${item.id}, 1)\">+\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  `).join('');\n  const sum = items.reduce((acc, i) => acc + i.price * i.qty, 0);\n  totalEl.textContent = new Intl.NumberFormat('ru-RU').format(sum) + ' ₽';\n}\nwindow.changeQty = (id, delta) => {\n  const found = items.find(i => i.id === id);\n  if (found) found.qty = Math.max(1, found.qty + delta);\n  renderCart();\n};\nrenderCart();\n\u003c/script>"},{"id":"recipe-catalog-filter","lang":"recipes","title":"Рецепт: Живой поиск и фильтрация карточек по категориям","summary":"Мгновенная клиентская фильтрация списка элементов по тегам и поисковой строке без перезагрузки страницы.","tags":["рецепт","фильтр","поиск","каталог","табы","filter","search"],"when":"Для каталогов товаров, портфолио проектов, списков документации, FAQ и таблиц.","alternatives":"При объёме более 5 000 записей используйте серверную фильтрацию через Fetch API и пагинацию.","points":["Сочетает фильтр по выбранной категории и текстовый поиск по подстроке.","При отсутствии совпадений аккуратно выводит пустое состояние (Empty State)."],"code":"\u003cdiv class=\"flt-demo\">\n  \u003cdiv class=\"flt-bar\">\n    \u003cinput type=\"search\" id=\"flt-input\" placeholder=\"Поиск по модулям...\">\n    \u003cbutton class=\"flt-tag active\" data-cat=\"all\">Все\u003c/button>\n    \u003cbutton class=\"flt-tag\" data-cat=\"front\">Frontend\u003c/button>\n    \u003cbutton class=\"flt-tag\" data-cat=\"back\">Backend\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"flt-list\" class=\"flt-list\">\u003c/div>\n\u003c/div>\n\n\u003cstyle>\n.flt-demo { max-width: 420px; margin: 0 auto; color: #f4f4f5; font-family: system-ui, sans-serif; }\n.flt-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }\n.flt-bar input { flex: 1; min-width: 140px; padding: 7px 10px; border-radius: 4px; border: 1px solid #3f3f46; background: #0c0d0f; color: #fff; font-size: 13px; }\n.flt-tag { padding: 6px 10px; border-radius: 4px; border: 1px solid #3f3f46; background: #141619; color: #a1a1aa; font-size: 12px; cursor: pointer; }\n.flt-tag.active { background: #facc15; color: #09090b; border-color: #facc15; font-weight: 800; }\n.flt-list { display: grid; gap: 8px; }\n.flt-item { padding: 10px 12px; border-radius: 4px; background: #141619; border: 1px solid #27272a; display: flex; justify-content: space-between; font-size: 13px; }\n\u003c/style>\n\n\u003cscript>\nconst data = [\n  { name: 'React 19 + TypeScript', cat: 'front' },\n  { name: 'Tailwind CSS v4', cat: 'front' },\n  { name: 'PHP 8.3 + Laravel 11', cat: 'back' },\n  { name: 'PostgreSQL & Redis', cat: 'back' }\n];\nlet activeCat = 'all';\nconst inp = document.getElementById('flt-input');\nconst list = document.getElementById('flt-list');\n\nfunction render() {\n  const q = inp.value.toLowerCase();\n  const res = data.filter(d => (activeCat === 'all' || d.cat === activeCat) && d.name.toLowerCase().includes(q));\n  list.innerHTML = res.length\n    ? res.map(d => `\u003cdiv class=\"flt-item\">\u003cstrong>${d.name}\u003c/strong>\u003cspan style=\"color:#facc15;font-family:monospace;\">[${d.cat.toUpperCase()}]\u003c/span>\u003c/div>`).join('')\n    : '\u003cdiv style=\"color:#a1a1aa;font-size:13px;\">Совпадений не обнаружено\u003c/div>';\n}\ndocument.querySelectorAll('.flt-tag').forEach(btn => {\n  btn.onclick = () => {\n    document.querySelectorAll('.flt-tag').forEach(b => b.classList.remove('active'));\n    btn.classList.add('active');\n    activeCat = btn.dataset.cat;\n    render();\n  };\n});\ninp.oninput = render;\nrender();\n\u003c/script>"},{"id":"recipe-file-dropzone","lang":"recipes","title":"Рецепт: Drag-and-Drop загрузка файлов с проверкой размера","summary":"Зона перетаскивания файлов с подсветкой при наведении и мгновенным выводом параметров выбранного файла.","tags":["рецепт","загрузка файла","drag and drop","dropzone","file upload","превью картинки"],"when":"Для загрузки аватарок, прикрепления чертежей и документов в формах обратной связи.","alternatives":"Обычный \u003cinput type=\"file\">, который выглядит по-разному во всех браузерах.","points":["События dragover и drop требуют вызова event.preventDefault(), чтобы браузер не открывал файл в новой вкладке.","Метод URL.createObjectURL(file) мгновенно создаёт локальную ссылку на выбранную картинку для предпросмотра до отправки на сервер."],"code":"\u003clabel class=\"dropzone\" id=\"dropzone\">\n  \u003cinput type=\"file\" id=\"file-inp\" accept=\"image/*\" hidden>\n  \u003cdiv id=\"drop-info\">\n    \u003cstrong>ПЕРЕТАЩИТЕ ФАЙЛ В ЭТУ ЗОНУ\u003c/strong>\n    \u003cp>или нажмите для выбора с диска (PNG, JPG, SVG, PDF)\u003c/p>\n  \u003c/div>\n\u003c/label>\n\n\u003cstyle>\n.dropzone {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  max-width: 360px;\n  margin: 0 auto;\n  min-height: 136px;\n  padding: 20px;\n  border: 2px dashed #facc15;\n  border-radius: 6px;\n  background: rgba(250, 204, 21, 0.05);\n  color: #f4f4f5;\n  text-align: center;\n  cursor: pointer;\n  font-family: system-ui, sans-serif;\n  transition: background 0.2s, border-color 0.2s;\n}\n.dropzone:hover, .dropzone.dragover { background: rgba(250, 204, 21, 0.14); border-color: #fde047; }\n.dropzone p { margin: 6px 0 0; font-size: 12px; color: #a1a1aa; }\n\u003c/style>\n\n\u003cscript>\nconst dz = document.getElementById('dropzone');\nconst inp = document.getElementById('file-inp');\nconst info = document.getElementById('drop-info');\n\nfunction handleFile(file) {\n  if (!file) return;\n  info.innerHTML = `\u003cstrong style=\"color:#facc15;\">✓ ФАЙЛ ПРИНЯТ: ${file.name}\u003c/strong>\u003cp>Объём: ${(file.size / 1024).toFixed(1)} КБ\u003c/p>`;\n}\ndz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('dragover'); });\ndz.addEventListener('dragleave', () => dz.classList.remove('dragover'));\ndz.addEventListener('drop', (e) => {\n  e.preventDefault();\n  dz.classList.remove('dragover');\n  handleFile(e.dataTransfer.files[0]);\n});\ninp.addEventListener('change', (e) => handleFile(e.target.files[0]));\n\u003c/script>"},{"id":"fw-tailwind-css","lang":"frameworks","title":"Tailwind CSS v4 (Утилитарный фреймворк вместо ручного CSS)","summary":"Современный CSS-фреймворк, который заменяет написание сотен кастомных классов и файлов стилей готовыми атомарными утилитами прямо в атрибуте class.","tags":["framework","фреймворк","tailwind","tailwindcss","css","утилиты","верстка"],"when":"Когда нужно верстать адаптивные интерфейсы в 3–4 раза быстрее без придумывания названий классов по БЭМ и без раздувания CSS-бандла.","alternatives":"Чистый CSS с переменными (Custom Properties), CSS Modules или компонентные библиотеки вроде Bootstrap 5.","points":["Кого заменяет: ручное написание CSS-файлов, БЭМ-нейминг (.card__header--active) и громоздкие медиа-запросы.","Подключение за 10 секунд (CDN): \u003cscript src=\"https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4\">\u003c/script>.","Подключение в проекте (Vite): npm install tailwindcss @tailwindcss/vite и строка @import \"tailwindcss\"; в главном CSS.","Адаптивность и состояния пишутся прямо через префиксы: hover:bg-yellow-400, md:grid-cols-3, dark:bg-zinc-900."],"code":"\u003c!-- Подключение Tailwind v4 CDN: \u003cscript src=\"https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4\">\u003c/script> -->\n\u003cdiv class=\"tw-demo-card\" id=\"tw-card\">\n  \u003cdiv class=\"tw-row\">\n    \u003cspan class=\"tw-badge\">TAILWIND CSS v4\u003c/span>\n    \u003cspan class=\"tw-price\" id=\"tw-mode-label\">DARK // MODE\u003c/span>\n  \u003c/div>\n  \u003ch4>Утилитарная вёрстка нового поколения\u003c/h4>\n  \u003cp>Классы \u003ccode>flex items-center justify-between gap-4 p-5 rounded bg-zinc-900\u003c/code> заменяют десятки строк обычного CSS.\u003c/p>\n  \u003cbutton class=\"tw-btn\" id=\"tw-toggle-btn\">Переключить утилиту акцента →\u003c/button>\n\u003c/div>\n\n\u003cstyle>\n.tw-demo-card { max-width: 410px; margin: 0 auto; padding: 18px; border-radius: 6px; background: #141619; border: 1px solid #2e323b; color: #f4f4f5; font-family: system-ui, sans-serif; transition: border-color 0.2s, box-shadow 0.2s; }\n.tw-demo-card.accent-active { border-color: #facc15; box-shadow: 4px 4px 0 #facc15; }\n.tw-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }\n.tw-badge { background: rgba(250,204,21,0.15); color: #facc15; padding: 3px 9px; border-radius: 4px; font-size: 11px; font-weight: 800; font-family: monospace; }\n.tw-price { font-size: 11px; color: #a1a1aa; font-family: monospace; }\n.tw-demo-card h4 { margin: 0 0 6px; font-size: 16px; }\n.tw-demo-card p { margin: 0 0 14px; font-size: 13px; color: #a1a1aa; line-height: 1.5; }\n.tw-demo-card code { color: #facc15; font-family: monospace; }\n.tw-btn { width: 100%; padding: 9px; border-radius: 4px; background: #facc15; color: #09090b; font-weight: 800; border: none; cursor: pointer; }\n\u003c/style>\n\n\u003cscript>\nconst card = document.getElementById('tw-card');\nconst label = document.getElementById('tw-mode-label');\ndocument.getElementById('tw-toggle-btn').addEventListener('click', () => {\n  card.classList.toggle('accent-active');\n  label.textContent = card.classList.contains('accent-active') ? 'RING-YELLOW-400 // ON' : 'DARK // MODE';\n});\n\u003c/script>"},{"id":"fw-react","lang":"frameworks","title":"React 19 (Декларативные компоненты и хуки вместо ручного DOM API)","summary":"Библиотека для создания пользовательских интерфейсов, заменяющая императивный поиск элементов (querySelector, innerHTML) реактивными компонентами и хуками состояния.","tags":["framework","фреймворк","react","jsx","usestate","useeffect","spa","компоненты"],"when":"Для интерактивных веб-приложений, личных кабинетов, дашбордов и SaaS-продуктов с частым обновлением данных на экране.","alternatives":"Vue 3, Svelte 5 или легковесный Alpine.js для простых серверных сайтов.","points":["Кого заменяет: ручное управление DOM (document.getElementById, createElement, appendChild) и синхронизацию переменных с HTML.","Быстрый старт проекта: npm create vite@latest my-app -- --template react-ts.","Хук useState(initial) хранит состояние и автоматически перерисовывает только изменившуюся часть интерфейса.","Хук useEffect(() => {}, [deps]) выполняет запросы к серверу и подписки при монтировании компонента."],"code":"\u003c!-- В проекте React (Counter.jsx):\nimport { useState } from 'react';\nexport function Counter() {\n  const [count, setCount] = useState(0);\n  return \u003cbutton onClick={() => setCount(c => c + 1)}>Счёт: {count}\u003c/button>;\n}\n-->\n\u003cdiv class=\"react-box\">\n  \u003cdiv class=\"react-head\">\n    \u003cspan class=\"react-tag\">REACT 19 // USESTATE SIMULATOR\u003c/span>\n    \u003cspan id=\"react-renders\" class=\"react-meta\">Рендеров: 1\u003c/span>\n  \u003c/div>\n  \u003ch3 id=\"react-title\">Состояние count = 0\u003c/h3>\n  \u003cp>Вызов \u003ccode>setCount(prev =&gt; prev + 1)\u003c/code> обновляет Virtual DOM и точечно перерисовывает узел.\u003c/p>\n  \u003cdiv class=\"react-actions\">\n    \u003cbutton id=\"react-dec\" class=\"r-btn-sec\">−1\u003c/button>\n    \u003cbutton id=\"react-inc\" class=\"r-btn-pri\">setCount(count + 1)\u003c/button>\n    \u003cbutton id=\"react-rst\" class=\"r-btn-sec\">Сброс\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cstyle>\n.react-box { max-width: 410px; margin: 0 auto; padding: 18px; background: #141619; border: 1px solid #2e323b; border-left: 4px solid #facc15; border-radius: 6px; color: #f4f4f5; font-family: system-ui, sans-serif; }\n.react-head { display: flex; justify-content: space-between; font-family: monospace; font-size: 11px; margin-bottom: 8px; }\n.react-tag { color: #facc15; font-weight: 800; }\n.react-meta { color: #a1a1aa; }\n.react-box h3 { margin: 0 0 6px; font-size: 18px; font-family: monospace; }\n.react-box p { margin: 0 0 14px; font-size: 12.5px; color: #a1a1aa; }\n.react-box code { color: #fde047; }\n.react-actions { display: flex; gap: 8px; }\n.r-btn-pri { flex: 1; padding: 9px 12px; background: #facc15; color: #09090b; border: none; border-radius: 4px; font-weight: 800; cursor: pointer; font-family: monospace; }\n.r-btn-sec { padding: 9px 12px; background: #27272a; color: #f4f4f5; border: 1px solid #3f3f46; border-radius: 4px; cursor: pointer; font-weight: 700; }\n\u003c/style>\n\n\u003cscript>\nlet count = 0;\nlet renders = 1;\nconst titleEl = document.getElementById('react-title');\nconst rendersEl = document.getElementById('react-renders');\n\nfunction setCount(nextVal) {\n  count = nextVal;\n  renders++;\n  titleEl.textContent = 'Состояние count = ' + count;\n  rendersEl.textContent = 'Рендеров: ' + renders;\n}\ndocument.getElementById('react-inc').onclick = () => setCount(count + 1);\ndocument.getElementById('react-dec').onclick = () => setCount(count - 1);\ndocument.getElementById('react-rst').onclick = () => setCount(0);\n\u003c/script>"},{"id":"fw-vue3","lang":"frameworks","title":"Vue 3 (Composition API и \u003cscript setup> — реактивный фреймворк)","summary":"Интуитивный фреймворк с автоматической реактивностью (ref, computed) и двусторонним связыванием v-model, работающий как через Vite, так и напрямую с CDN.","tags":["framework","фреймворк","vue","vue3","composition api","ref","v-model","реактивность"],"when":"Когда нужен баланс между мощью компонентного SPA и чистым разделением на шаблон \u003ctemplate>, логику \u003cscript setup> и стили \u003cstyle scoped>.","alternatives":"React 19, Svelte 5 или Alpine.js.","points":["Кого заменяет: громоздкие jQuery-скрипты и сложный шаблонный код обновления форм.","Подключение без сборщика (CDN): \u003cscript src=\"https://unpkg.com/vue@3/dist/vue.global.js\">\u003c/script>.","Создание проекта со сборщиком: npm create vue@latest.","Директива v-model обеспечивает двустороннее связывание полей формы с переменной за 1 атрибут."],"code":"\u003c!-- В компоненте App.vue:\n\u003cscript setup>\nimport { ref, computed } from 'vue';\nconst name = ref('Инженер');\n\u003c/script>\n\u003ctemplate>\u003cinput v-model=\"name\">\u003cp>Привет, {{ name }}!\u003c/p>\u003c/template>\n-->\n\u003cdiv class=\"vue-card\">\n  \u003cdiv class=\"vue-tag\">VUE 3 // V-MODEL & COMPUTED\u003c/div>\n  \u003clabel class=\"vue-label\">\n    \u003cspan>Двустороннее связывание (v-model=\"name\"):\u003c/span>\n    \u003cinput id=\"vue-inp\" value=\"Инженер DevShelf\" placeholder=\"Введите имя\">\n  \u003c/label>\n  \u003cdiv id=\"vue-out\" class=\"vue-out\">Привет, Инженер DevShelf! Длина строки: 16 симв.\u003c/div>\n\u003c/div>\n\n\u003cstyle>\n.vue-card { max-width: 410px; margin: 0 auto; padding: 18px; background: #141619; border: 1px solid #2e323b; border-left: 4px solid #facc15; border-radius: 6px; color: #f4f4f5; font-family: system-ui, sans-serif; }\n.vue-tag { font-size: 11px; color: #facc15; font-family: monospace; font-weight: 800; margin-bottom: 10px; }\n.vue-label { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: #a1a1aa; margin-bottom: 12px; }\n.vue-label input { padding: 9px 12px; border-radius: 4px; border: 1px solid #3f3f46; background: #0c0d0f; color: #fff; font-size: 14px; }\n.vue-out { padding: 10px 12px; background: #0c0d0f; border: 1px solid #27272a; border-radius: 4px; font-weight: 700; color: #fef08a; font-size: 13px; }\n\u003c/style>\n\n\u003cscript>\nconst vInp = document.getElementById('vue-inp');\nconst vOut = document.getElementById('vue-out');\nvInp.addEventListener('input', () => {\n  const val = vInp.value.trim() || 'Гость';\n  vOut.textContent = `Привет, ${val}! Длина строки: ${val.length} симв.`;\n});\n\u003c/script>"},{"id":"fw-alpinejs","lang":"frameworks","title":"Alpine.js (Легковесная замена jQuery прямо в HTML-атрибутах)","summary":"Микро-фреймворк весом 15 КБ, позволяющий создавать модалки, табы, выпадающие меню и аккордеоны прямо через атрибуты x-data, x-show и @click без отдельных .js файлов.","tags":["framework","фреймворк","alpine","alpinejs","jquery замена","x-data","микрофреймворк"],"when":"Идеальный выбор для серверных сайтов (PHP, Laravel, WordPress, Битрикс) и лендингов, где React избыточен, а писать ручной querySelector долго.","alternatives":"Нативный JavaScript или HTMX.","points":["Кого заменяет: устаревший jQuery и десятки мелких файлов вроде tabs.js, modal.js, dropdown.js.","Подключение в 1 строку в \u003chead>: \u003cscript defer src=\"https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js\">\u003c/script>.","Атрибут x-data=\"{ open: false }\" объявляет локальное реактивное состояние прямо на HTML-теге.","Атрибуты @click=\"open = !open\" и x-show=\"open\" управляют видимостью блока без единого ID или класса."],"code":"\u003c!-- Подключение: \u003cscript defer src=\"https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js\">\u003c/script> -->\n\u003cdiv class=\"alpine-box\" x-data=\"{ open: true }\">\n  \u003cdiv class=\"alpine-tag\">ALPINE.JS // X-DATA & X-SHOW\u003c/div>\n  \u003cbutton id=\"alp-btn\" class=\"alpine-btn\">\n    Переключить панель (x-on:click=\"open = !open\") ▾\n  \u003c/button>\n  \u003cdiv id=\"alp-menu\" class=\"alpine-menu\">\n    \u003cp>\u003cstrong>Статус узла:\u003c/strong> АКТИВЕН\u003c/p>\n    \u003cp>Вся логика открытия/закрытия описывается прямо в HTML-разметке через \u003ccode>x-data=\"{ open: false }\"\u003c/code> и \u003ccode>x-show=\"open\"\u003c/code>.\u003c/p>\n  \u003c/div>\n\u003c/div>\n\n\u003cstyle>\n.alpine-box { max-width: 410px; margin: 0 auto; padding: 18px; background: #141619; border: 1px solid #2e323b; border-radius: 6px; color: #f4f4f5; font-family: system-ui, sans-serif; }\n.alpine-tag { font-size: 11px; color: #facc15; font-family: monospace; font-weight: 800; margin-bottom: 10px; }\n.alpine-btn { width: 100%; background: #facc15; color: #09090b; border: none; padding: 9px 14px; border-radius: 4px; font-weight: 800; cursor: pointer; text-align: left; }\n.alpine-menu { margin-top: 10px; padding: 12px; background: #0c0d0f; border: 1px solid #3f3f46; border-radius: 4px; font-size: 13px; color: #d4d4d8; }\n.alpine-menu p { margin: 0 0 6px; }\n.alpine-menu p:last-child { margin: 0; }\n.alpine-menu code { color: #facc15; }\n\u003c/style>\n\n\u003cscript>\nconst aBtn = document.getElementById('alp-btn');\nconst aMenu = document.getElementById('alp-menu');\naBtn.addEventListener('click', () => {\n  aMenu.hidden = !aMenu.hidden;\n});\n\u003c/script>"},{"id":"fw-htmx","lang":"frameworks","title":"HTMX (AJAX-запросы, пагинация и фильтрация прямо из HTML)","summary":"Библиотека, позволяющая любому HTML-элементу отправлять POST/GET-запросы и обновлять часть страницы без перезагрузки и без написания JavaScript-кода.","tags":["framework","фреймворк","htmx","ajax","fetch замена","hx-get","hx-post","php"],"when":"Когда бэкенд пишется на PHP, Python или Go, и вы хотите получить плавность SPA-приложения без создания отдельного фронтенда на React.","alternatives":"Ручной fetch() + innerHTML или полноценный SPA (React / Vue).","points":["Кого заменяет: ручные цепочки fetch() -> response.text() -> document.getElementById().innerHTML.","Подключение (CDN): \u003cscript src=\"https://unpkg.com/htmx.org@2.0.0\">\u003c/script>.","Атрибут hx-post=\"/api/deploy\" отправляет запрос по клику, а hx-target=\"#hx-out\" указывает, какой блок на странице обновить ответом сервера."],"code":"\u003c!-- Подключение: \u003cscript src=\"https://unpkg.com/htmx.org@2.0.0\">\u003c/script> -->\n\u003cdiv class=\"hx-card\">\n  \u003cdiv class=\"hx-tag\">HTMX // HX-POST & HX-TARGET\u003c/div>\n  \u003cp class=\"hx-desc\">Кнопка с атрибутами \u003ccode>hx-post=\"/api/ping\" hx-target=\"#hx-result\"\u003c/code> заменяет ручной \u003ccode>fetch()\u003c/code>:\u003c/p>\n  \u003cbutton id=\"hx-btn\" class=\"hx-btn\" hx-post=\"/api/ping\" hx-target=\"#hx-result\">\n    Отправить hx-post запрос →\n  \u003c/button>\n  \u003cdiv id=\"hx-result\" class=\"hx-result\">Ожидание запроса к серверу...\u003c/div>\n\u003c/div>\n\n\u003cstyle>\n.hx-card { max-width: 410px; margin: 0 auto; padding: 18px; background: #141619; border: 1px solid #2e323b; border-radius: 6px; color: #f4f4f5; font-family: system-ui, sans-serif; }\n.hx-tag { font-size: 11px; color: #facc15; font-family: monospace; font-weight: 800; margin-bottom: 8px; }\n.hx-desc { font-size: 13px; color: #a1a1aa; margin: 0 0 12px; }\n.hx-desc code { color: #facc15; }\n.hx-btn { width: 100%; padding: 9px 14px; background: #facc15; color: #09090b; font-weight: 800; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 10px; }\n.hx-result { padding: 10px 12px; background: #0c0d0f; border: 1px solid #3f3f46; border-radius: 4px; font-family: monospace; font-size: 12px; color: #e4e4e7; }\n\u003c/style>\n\n\u003cscript>\nlet reqId = 100;\nconst btn = document.getElementById('hx-btn');\nconst out = document.getElementById('hx-result');\nbtn.addEventListener('click', () => {\n  reqId++;\n  out.textContent = '⏳ hx-request: отправка POST /api/ping...';\n  setTimeout(() => {\n    out.innerHTML = `\u003cspan style=\"color:#facc15;\">✓ HTTP 200 OK (Swap #hx-result)\u003c/span>\u003cbr>Пакет #${reqId} получен с сервера без перезагрузки!`;\n  }, 220);\n});\n\u003c/script>"},{"id":"fw-bootstrap5","lang":"frameworks","title":"Bootstrap 5.3 (Готовая 12-колоночная сетка и UI-компоненты без jQuery)","summary":"Классический CSS/JS-фреймворк с готовыми адаптивными контейнерами (row / col-md-6), модальными окнами, таблицами, формами и встроенной тёмной темой.","tags":["framework","фреймворк","bootstrap","bootstrap 5","сетка","col-md","компоненты"],"when":"Для быстрой сборки админ-панелей, внутренних корпоративных порталов, CRM и прототипов.","alternatives":"Tailwind CSS (для кастомного дизайна) или нативный CSS Grid.","points":["Кого заменяет: ручное написание базовых стилей для кнопок, таблиц, алертов, модалок и колонок.","В версии Bootstrap 5 полностью удалена зависимость от jQuery — все интерактивные компоненты работают на чистом JS.","Подключение через CDN занимает 2 строки: один \u003clink> для CSS и один \u003cscript> для bundle.min.js.","Атрибут data-bs-theme=\"dark\" на теге \u003chtml> мгновенно переключает весь сайт в тёмную тему."],"code":"\u003c!-- Подключение: \u003clink href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css\" rel=\"stylesheet\"> -->\n\u003cdiv class=\"bs-container\">\n  \u003cdiv class=\"bs-header\">\n    \u003cspan>BOOTSTRAP 5.3 // 12-COLUMN GRID\u003c/span>\n    \u003cbutton id=\"bs-toggle\" class=\"bs-btn\">Сменить col-6 ↔ col-12\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"bs-row\" id=\"bs-grid\">\n    \u003cdiv class=\"bs-col\">col-md-6 (Модуль А)\u003c/div>\n    \u003cdiv class=\"bs-col\">col-md-6 (Модуль Б)\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cstyle>\n.bs-container { max-width: 420px; margin: 0 auto; padding: 16px; background: #141619; border: 1px solid #2e323b; border-radius: 6px; color: #f4f4f5; font-family: system-ui, sans-serif; }\n.bs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-family: monospace; font-size: 11px; color: #facc15; }\n.bs-btn { padding: 5px 10px; background: #27272a; color: #facc15; border: 1px solid #facc15; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 700; }\n.bs-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }\n.bs-row.stacked { grid-template-columns: 1fr; }\n.bs-col { padding: 12px; background: #0c0d0f; border: 1px solid #3f3f46; border-radius: 4px; text-align: center; font-size: 13px; font-family: monospace; }\n\u003c/style>\n\n\u003cscript>\nconst grid = document.getElementById('bs-grid');\ndocument.getElementById('bs-toggle').addEventListener('click', () => {\n  grid.classList.toggle('stacked');\n});\n\u003c/script>"},{"id":"fw-typescript","lang":"frameworks","title":"TypeScript (Строгая типизация и интерфейсы поверх JavaScript)","summary":"Надмножество JavaScript от Microsoft, добавляющее статическую проверку типов, интерфейсы и автодополнение в IDE ещё до запуска кода в браузере.","tags":["framework","фреймворк","typescript","ts","типизация","interface","type"],"when":"В любых проектах длиннее 300 строк кода и при командной разработке, чтобы исключить ошибки Cannot read properties of undefined.","alternatives":"JSDoc-комментарии (@param, @returns) в обычных .js файлах.","points":["Кого заменяет: динамический JavaScript без проверки типов и ручные проверки typeof x === \"string\".","Установка в проект: npm install -D typescript && npx tsc --init.","Vite поддерживает файлы .ts и .tsx из коробки без дополнительной настройки.","На этапе сборки все типы вырезаются, превращаясь в чистый совместимый JavaScript."],"code":"\u003c!-- В файле user.ts:\ninterface UserProfile {\n  id: number;\n  name: string;\n  role: 'admin' | 'engineer' | 'viewer';\n}\n-->\n\u003cdiv class=\"ts-card\">\n  \u003cdiv class=\"ts-tag\">TYPESCRIPT // INTERFACE CHECKER\u003c/div>\n  \u003cdiv class=\"ts-controls\">\n    \u003cselect id=\"ts-role\">\n      \u003coption value=\"admin\">role: 'admin'\u003c/option>\n      \u003coption value=\"engineer\">role: 'engineer'\u003c/option>\n      \u003coption value=\"invalid\">role: 'hacker' (Ошибка типа!)\u003c/option>\n    \u003c/select>\n  \u003c/div>\n  \u003cpre id=\"ts-output\" class=\"ts-out\">\u003c/pre>\n\u003c/div>\n\n\u003cstyle>\n.ts-card { max-width: 420px; margin: 0 auto; padding: 16px; background: #141619; border: 1px solid #2e323b; border-radius: 6px; color: #f4f4f5; font-family: system-ui, sans-serif; }\n.ts-tag { font-size: 11px; color: #facc15; font-family: monospace; font-weight: 800; margin-bottom: 10px; }\n.ts-controls select { width: 100%; padding: 8px 10px; background: #0c0d0f; color: #f4f4f5; border: 1px solid #3f3f46; border-radius: 4px; font-family: monospace; margin-bottom: 10px; }\n.ts-out { margin: 0; padding: 12px; background: #0c0d0f; border: 1px solid #27272a; border-radius: 4px; font-family: monospace; font-size: 12px; white-space: pre-wrap; color: #fef08a; }\n\u003c/style>\n\n\u003cscript>\nconst sel = document.getElementById('ts-role');\nconst out = document.getElementById('ts-output');\n\nfunction validateTS(role) {\n  if (role === 'invalid') {\n    out.style.color = '#f87171';\n    out.textContent = `TS2322: Type '\"hacker\"' is not assignable to type '\"admin\" | \"engineer\" | \"viewer\"'.`;\n  } else {\n    out.style.color = '#fef08a';\n    out.textContent = `✓ Скомпилировано успешно:\\nconst user: UserProfile = { id: 42, role: \"${role}\" };`;\n  }\n}\nsel.addEventListener('change', (e) => validateTS(e.target.value));\nvalidateTS(sel.value);\n\u003c/script>"},{"id":"fw-vite","lang":"frameworks","title":"Vite (Мгновенный сборщик проектов вместо Webpack и Gulp)","summary":"Инструмент сборки нового поколения, использующий нативные ES-модули браузера для запуска сервера за 200 мс и оптимизированную сборку Rollup для продакшена.","tags":["framework","фреймворк","vite","сборщик","webpack замена","gulp замена","hmr","npm"],"when":"Для старта любого современного проекта на чистом JS/TS, React, Vue, Svelte или многостраничной верстки.","alternatives":"Parcel, esbuild или устаревший Webpack.","points":["Кого заменяет: медленные конфиги Webpack на 200 строк и сложные пайплайны Gulp.","Создание нового проекта за 1 команду: npm create vite@latest.","Опция base: \"./\" в vite.config.js делает пути относительными, чтобы сайт работал в любой подпапке на GitHub Pages и Beget.","Команда npm run build собирает минифицированную папку dist/, готовую к выгрузке на хостинг."],"code":"\u003c!-- Терминал: npm create vite@latest my-app -->\n\u003cdiv class=\"vite-box\">\n  \u003cdiv class=\"vite-tag\">VITE // CONFIG GENERATOR\u003c/div>\n  \u003clabel class=\"vite-check\">\n    \u003cinput type=\"checkbox\" id=\"vite-rel\" checked>\n    \u003cspan>Относительные пути \u003ccode>base: './'\u003c/code> (для GitHub Pages и Beget)\u003c/span>\n  \u003c/label>\n  \u003cpre id=\"vite-code\" class=\"vite-pre\">\u003c/pre>\n\u003c/div>\n\n\u003cstyle>\n.vite-box { max-width: 420px; margin: 0 auto; padding: 16px; background: #141619; border: 1px solid #2e323b; border-radius: 6px; color: #f4f4f5; font-family: system-ui, sans-serif; }\n.vite-tag { font-size: 11px; color: #facc15; font-family: monospace; font-weight: 800; margin-bottom: 10px; }\n.vite-check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #d4d4d8; margin-bottom: 10px; cursor: pointer; }\n.vite-check code { color: #facc15; }\n.vite-pre { margin: 0; padding: 12px; background: #0c0d0f; border: 1px solid #3f3f46; border-radius: 4px; font-family: monospace; font-size: 12px; color: #fef08a; white-space: pre-wrap; }\n\u003c/style>\n\n\u003cscript>\nconst chk = document.getElementById('vite-rel');\nconst pre = document.getElementById('vite-code');\n\nfunction updateConfig() {\n  pre.textContent = `import { defineConfig } from 'vite';\n\nexport default defineConfig({\n  ${chk.checked ? \"base: './', // Работает в любой папке на Pages/Beget\\n  \" : ''}build: { outDir: 'dist' }\n});`;\n}\nchk.addEventListener('change', updateConfig);\nupdateConfig();\n\u003c/script>"},{"id":"fw-laravel","lang":"frameworks","title":"Laravel 11 (Современный PHP-фреймворк и Eloquent ORM)","summary":"Самый популярный PHP-фреймворк с элегантным роутингом, ORM Eloquent (вместо сырых SQL-запросов), шаблонизатором Blade, очередями и встроенной авторизацией.","tags":["framework","фреймворк","laravel","php","eloquent","blade","mvc","бэкенд"],"when":"Для создания надёжных серверных веб-приложений, REST API, интернет-магазинов и личных кабинетов на PHP 8.2+.","alternatives":"Symfony, Slim Framework или чистый PHP 8 для микро-скриптов.","points":["Кого заменяет: разрозненные файлы index.php, login.php, db.php с ручным PDO и смешиванием SQL с HTML.","Установка через Composer: composer create-project laravel/laravel my-app.","Eloquent ORM позволяет писать Project::where(\"active\", true)->get() вместо ручного написания SQL.","Шаблонизатор Blade автоматически экранирует вывод {{ $user->name }} для полной защиты от XSS."],"code":"\u003c!-- Маршрут routes/web.php:\nRoute::get('/api/projects', fn() => Project::where('active', true)->get());\n-->\n\u003cdiv class=\"lrv-card\">\n  \u003cdiv class=\"lrv-tag\">LARAVEL 11 // ELOQUENT ORM BUILDER\u003c/div>\n  \u003cdiv class=\"lrv-row\">\n    \u003cbutton class=\"lrv-btn active\" data-q=\"all\">Project::all()\u003c/button>\n    \u003cbutton class=\"lrv-btn\" data-q=\"active\">->where('active', 1)\u003c/button>\n  \u003c/div>\n  \u003cpre id=\"lrv-sql\" class=\"lrv-sql\">\u003c/pre>\n\u003c/div>\n\n\u003cstyle>\n.lrv-card { max-width: 420px; margin: 0 auto; padding: 16px; background: #141619; border: 1px solid #2e323b; border-radius: 6px; color: #f4f4f5; font-family: system-ui, sans-serif; }\n.lrv-tag { font-size: 11px; color: #facc15; font-family: monospace; font-weight: 800; margin-bottom: 10px; }\n.lrv-row { display: flex; gap: 8px; margin-bottom: 10px; }\n.lrv-btn { flex: 1; padding: 7px 10px; background: #0c0d0f; color: #a1a1aa; border: 1px solid #3f3f46; border-radius: 4px; font-family: monospace; font-size: 12px; cursor: pointer; }\n.lrv-btn.active { background: #facc15; color: #09090b; border-color: #facc15; font-weight: 800; }\n.lrv-sql { margin: 0; padding: 12px; background: #0c0d0f; border: 1px solid #27272a; border-radius: 4px; font-family: monospace; font-size: 12px; color: #fef08a; white-space: pre-wrap; }\n\u003c/style>\n\n\u003cscript>\nconst sqlEl = document.getElementById('lrv-sql');\nconst btns = document.querySelectorAll('.lrv-btn');\n\nfunction renderQuery(mode) {\n  sqlEl.textContent = mode === 'all'\n    ? 'Eloquent: Project::orderByDesc(\"id\")->get();\\nSQL: SELECT * FROM projects ORDER BY id DESC;'\n    : 'Eloquent: Project::where(\"active\", true)->get();\\nSQL: SELECT * FROM projects WHERE active = 1;';\n}\nbtns.forEach(b => b.addEventListener('click', () => {\n  btns.forEach(x => x.classList.remove('active'));\n  b.classList.add('active');\n  renderQuery(b.dataset.q);\n}));\nrenderQuery('all');\n\u003c/script>"},{"id":"fw-nextjs","lang":"frameworks","title":"Next.js 15 (Full-Stack фреймворк поверх React с SSR и SEO)","summary":"Продакшен-фреймворк для React с файловым роутингом (App Router), серверным рендерингом (SSR) для идеальной индексации в поисковиках и серверными экшенами.","tags":["framework","фреймворк","nextjs","next","react","ssr","ssg","seo"],"when":"Когда проекту на React нужна быстрая первая отрисовка и 100% индексация страниц в Google и Яндекс.","alternatives":"Remix, Nuxt 3 (для Vue) или Astro (для контентных сайтов).","points":["Кого заменяет: клиентский React SPA (Create React App), который отдаёт поисковым роботам пустой \u003cdiv id=\"root\">\u003c/div>.","Быстрый старт: npx create-next-app@latest.","Файловый роутинг: файл app/catalog/page.tsx автоматически становится страницей по адресу /catalog.","Серверные компоненты (RSC) выполняют запросы к БД прямо на сервере и не отправляют лишний JS в браузер."],"code":"\u003c!-- Файл app/catalog/page.tsx (Next.js App Router) -->\n\u003cdiv class=\"nx-card\">\n  \u003cdiv class=\"nx-tag\">NEXT.JS 15 // APP ROUTER SIMULATOR\u003c/div>\n  \u003cdiv class=\"nx-routes\">\n    \u003cbutton class=\"nx-route active\" data-path=\"app/page.tsx\">/\u003c/button>\n    \u003cbutton class=\"nx-route\" data-path=\"app/docs/page.tsx\">/docs\u003c/button>\n    \u003cbutton class=\"nx-route\" data-path=\"app/api/route.ts\">/api (JSON)\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"nx-view\" class=\"nx-view\">\u003c/div>\n\u003c/div>\n\n\u003cstyle>\n.nx-card { max-width: 420px; margin: 0 auto; padding: 16px; background: #141619; border: 1px solid #2e323b; border-radius: 6px; color: #f4f4f5; font-family: system-ui, sans-serif; }\n.nx-tag { font-size: 11px; color: #facc15; font-family: monospace; font-weight: 800; margin-bottom: 10px; }\n.nx-routes { display: flex; gap: 6px; margin-bottom: 10px; }\n.nx-route { flex: 1; padding: 7px; background: #0c0d0f; color: #a1a1aa; border: 1px solid #3f3f46; border-radius: 4px; font-family: monospace; font-size: 12px; cursor: pointer; }\n.nx-route.active { background: #facc15; color: #09090b; border-color: #facc15; font-weight: 800; }\n.nx-view { padding: 12px; background: #0c0d0f; border: 1px solid #27272a; border-radius: 4px; font-family: monospace; font-size: 12px; color: #e4e4e7; }\n\u003c/style>\n\n\u003cscript>\nconst view = document.getElementById('nx-view');\nconst rBtns = document.querySelectorAll('.nx-route');\n\nfunction setRoute(file) {\n  view.innerHTML = `Файл: \u003cstrong style=\"color:#facc15;\">${file}\u003c/strong>\u003cbr>Рендер: Server Component (SSR HTML готов для SEO)`;\n}\nrBtns.forEach(b => b.addEventListener('click', () => {\n  rBtns.forEach(x => x.classList.remove('active'));\n  b.classList.add('active');\n  setRoute(b.dataset.path);\n}));\nsetRoute('app/page.tsx');\n\u003c/script>"},{"id":"fw-scss-sass","lang":"frameworks","title":"Sass / SCSS (Препроцессор CSS: миксины, функции и модули)","summary":"Метаязык поверх CSS, добавляющий переиспользуемые миксины (@mixin), математические вычисления, функции и модульную архитектуру (@use).","tags":["framework","фреймворк","sass","scss","препроцессор","mixin","css"],"when":"В крупных дизайн-системах и проектах со сложной генерацией тем и переиспользуемыми миксинами.","alternatives":"Современный нативный CSS (который уже поддерживает переменные var() и вложенность & из коробки) или Tailwind CSS.","points":["Кого упрощает: многократное дублирование медиа-запросов и шаблонных комбинаций свойств в CSS.","Подключение в Vite: достаточно выполнить npm add -D sass-embedded и переименовать файл в styles.scss.","Директива @mixin позволяет упаковать набор стилей с параметрами и подключать его через @include."],"code":"\u003c!-- В файле styles.scss:\n@mixin industrial-panel($accent: #facc15) {\n  border: 1px solid $accent;\n  box-shadow: 4px 4px 0 $accent;\n}\n-->\n\u003cdiv class=\"scss-demo\" id=\"scss-box\">\n  \u003cdiv class=\"scss-tag\">SCSS // @MIXIN INDUSTRIAL-PANEL($ACCENT)\u003c/div>\n  \u003cp>Выберите аргумент миксина \u003ccode>@include industrial-panel($color)\u003c/code>:\u003c/p>\n  \u003cdiv class=\"scss-btns\">\n    \u003cbutton class=\"scss-btn\" data-clr=\"#facc15\">#facc15 (Жёлтый)\u003c/button>\n    \u003cbutton class=\"scss-btn\" data-clr=\"#f97316\">#f97316 (Янтарный)\u003c/button>\n    \u003cbutton class=\"scss-btn\" data-clr=\"#22c55e\">#22c55e (Сигнальный)\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cstyle>\n.scss-demo { max-width: 410px; margin: 0 auto; padding: 18px; background: #141619; border: 1px solid #facc15; box-shadow: 4px 4px 0 #facc15; border-radius: 6px; color: #f4f4f5; font-family: system-ui, sans-serif; transition: all 0.2s; }\n.scss-tag { font-size: 11px; color: #facc15; font-family: monospace; font-weight: 800; margin-bottom: 6px; }\n.scss-demo p { font-size: 13px; color: #a1a1aa; margin: 0 0 12px; }\n.scss-demo code { color: #fef08a; }\n.scss-btns { display: flex; gap: 6px; flex-wrap: wrap; }\n.scss-btn { flex: 1; padding: 7px 10px; background: #0c0d0f; color: #f4f4f5; border: 1px solid #3f3f46; border-radius: 4px; font-size: 11px; font-family: monospace; cursor: pointer; }\n\u003c/style>\n\n\u003cscript>\nconst box = document.getElementById('scss-box');\ndocument.querySelectorAll('.scss-btn').forEach(btn => {\n  btn.addEventListener('click', () => {\n    const c = btn.dataset.clr;\n    box.style.borderColor = c;\n    box.style.boxShadow = '4px 4px 0 ' + c;\n  });\n});\n\u003c/script>"},{"id":"fw-gsap","lang":"frameworks","title":"GSAP (GreenSock — профессиональная таймлайн-анимация и Stagger)","summary":"Индустриальный стандарт для сложных таймлайнов, плавной анимации SVG, морфинга и скролл-сцен (ScrollTrigger), работающий стабильно во всех браузерах.","tags":["framework","фреймворк","gsap","scrolltrigger","анимация","keyframes замена"],"when":"Для промо-лендингов, интерактивного сторителлинга при скролле, последовательных анимаций (stagger) и сложных переходов.","alternatives":"Нативные CSS transition / @keyframes или Web Animations API (element.animate) для простых ховеров.","points":["Кого заменяет: громоздкие цепочки CSS @keyframes с ручным высчитыванием процентов и задержек animation-delay.","Подключение (CDN): \u003cscript src=\"https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js\">\u003c/script>.","Установка через npm: npm install gsap.","Свойство stagger: 0.1 автоматически запускает анимацию списка карточек каскадом с интервалом 0.1 секунды."],"code":"\u003c!-- В проекте: gsap.from('.stagger-item', { y: 24, opacity: 0, stagger: 0.1 }) -->\n\u003cdiv class=\"gsap-box\">\n  \u003cdiv class=\"gsap-head\">\n    \u003cspan>GSAP // STAGGER TIMELINE\u003c/span>\n    \u003cbutton id=\"gsap-play\" class=\"gsap-btn\">▶ Запустить stagger\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"gsap-grid\">\n    \u003cdiv class=\"stagger-item\">MOD // 01\u003c/div>\n    \u003cdiv class=\"stagger-item\">MOD // 02\u003c/div>\n    \u003cdiv class=\"stagger-item\">MOD // 03\u003c/div>\n    \u003cdiv class=\"stagger-item\">MOD // 04\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cstyle>\n.gsap-box { max-width: 420px; margin: 0 auto; padding: 16px; background: #141619; border: 1px solid #2e323b; border-radius: 6px; color: #f4f4f5; font-family: system-ui, sans-serif; }\n.gsap-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-family: monospace; font-size: 11px; color: #facc15; }\n.gsap-btn { padding: 6px 12px; background: #facc15; color: #09090b; border: none; border-radius: 4px; font-weight: 800; cursor: pointer; font-family: monospace; }\n.gsap-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }\n.stagger-item { padding: 14px 6px; background: #0c0d0f; border: 1px solid #facc15; border-radius: 4px; text-align: center; font-family: monospace; font-size: 11px; font-weight: 800; color: #fef08a; }\n\u003c/style>\n\n\u003cscript>\nconst nodes = document.querySelectorAll('.stagger-item');\nfunction runStagger() {\n  nodes.forEach((el, i) => {\n    el.animate([\n      { transform: 'translateY(18px) scale(0.92)', opacity: 0 },\n      { transform: 'translateY(0) scale(1)', opacity: 1 }\n    ], { duration: 420, delay: i * 90, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'both' });\n  });\n}\ndocument.getElementById('gsap-play').addEventListener('click', runStagger);\nrunStagger();\n\u003c/script>"},{"lang":"html","id":"html-document","title":"HTML: структура документа (HTML5 Boilerplate)","summary":"Обязательный стандартный каркас веб-страницы: объявление стандарта, язык страницы, метаданные и тело.","code":"\u003c!doctype html>\n\u003chtml lang=\"ru\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Заголовок страницы\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"styles.css\">\n\u003c/head>\n\u003cbody>\n  \u003ch1>Основной заголовок\u003c/h1>\n  \u003cscript src=\"script.js\" defer>\u003c/script>\n\u003c/body>\n\u003c/html>","example":"\u003cmain>\n  \u003ch1>Добро пожаловать\u003c/h1>\n  \u003cp>Контент страницы.\u003c/p>\n\u003c/main>","points":["\u003c!doctype html> переводит браузер в режим соответствия стандартам (Standards Mode) без quirks-режима.","Атрибут lang=\"ru\" критически важен для синтезаторов речи (screen readers), автопереводчиков и поисковиков.","Тег \u003cmeta name=\"viewport\"> гарантирует правильный масштаб и отсутствие зума на мобильных экранах."],"tags":["HTML","doctype","html","head","body","структура","каркас","boilerplate","lang","viewport"],"when":"Начинай с этого каркаса любую страницу или шаблон в проекте.","alternatives":"Для AJAX-фрагментов и компонентов каркас опускается; для фреймворков каркас выносится в index.html или layout.","url":"https://developer.mozilla.org/ru/docs/Web/HTML"},{"lang":"html","id":"html-metadata","title":"HTML: метаданные страницы и мобильный viewport","summary":"Настройка кодировки, заголовка вкладки, описания для поисковиков и темы мобильного браузера.","code":"\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"description\" content=\"Краткое емкое описание (до 160 символов) для сниппета в поисковиках\">\n  \u003cmeta name=\"theme-color\" content=\"#090d14\">\n  \u003clink rel=\"canonical\" href=\"https://example.com/page\">\n  \u003ctitle>Понятный заголовок вкладки | Название бренда\u003c/title>\n\u003c/head>","example":"\u003cmeta name=\"theme-color\" content=\"#090d14\" media=\"(prefers-color-scheme: dark)\">","points":["\u003cmeta charset=\"utf-8\"> должен стоять в числе первых тегов внутри \u003chead>, чтобы браузер сразу декодировал текст.","\u003ctitle> является главным фактором ранжирования в поисковиках и заголовком вкладки в браузере.","canonical указывает поисковику основную версию страницы, предотвращая склейку и дубли контента."],"tags":["HTML","meta","title","description","viewport","theme-color","canonical","метаданные","кодировка"],"when":"Обязательно настраивай для всех публичных страниц сайта для правильного отображения и SEO.","alternatives":"Для страниц админ-панелей description и canonical обычно опускают.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/meta"},{"lang":"html","id":"html-opengraph","title":"HTML: разметка Open Graph и Twitter Cards для соцсетей","summary":"Специальные метатеги, формирующие красивую карточку с превью, заголовком и картинкой при репосте в Telegram, VK и WhatsApp.","code":"\u003c!-- Open Graph (Telegram, VK, Facebook) -->\n\u003cmeta property=\"og:type\" content=\"website\">\n\u003cmeta property=\"og:site_name\" content=\"DevShelf\">\n\u003cmeta property=\"og:title\" content=\"Заголовок для ссылки в соцсети\">\n\u003cmeta property=\"og:description\" content=\"Краткое превью статьи, отображаемое под заголовком.\">\n\u003cmeta property=\"og:image\" content=\"https://example.com/og-image.jpg\">\n\u003cmeta property=\"og:image:width\" content=\"1200\">\n\u003cmeta property=\"og:image:height\" content=\"630\">\n\u003cmeta property=\"og:url\" content=\"https://example.com/page\">\n\n\u003c!-- Twitter Cards -->\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\">\n\u003cmeta name=\"twitter:title\" content=\"Заголовок карточки\">\n\u003cmeta name=\"twitter:description\" content=\"Описание статьи для карточки\">\n\u003cmeta name=\"twitter:image\" content=\"https://example.com/og-image.jpg\">","example":"\u003c!-- Минимальный набор для Telegram: og:title, og:description, og:image -->","points":["Разрешение картинки og:image должно быть 1200x630 пикселей (пропорция 1.91:1) для четкого отображения на Retina.","Ссылка на картинку должна быть абсолютной (https://...), иначе боты Telegram и VK её не загрузят.","После изменения og-тегов в Telegram используй бота @WebpageBot, чтобы сбросить кэш превью ссылки."],"tags":["HTML","opengraph","og","twitter","social","telegram","vk","превью","репост","карточка"],"when":"Добавляй на все лендинги, статьи блога и страницы, на которые пользователи будут делиться ссылками.","alternatives":"Без og: тегов соцсети выдернут первую попавшуюся картинку со страницы или оставят пустую серую плашку.","url":"https://ogp.me/"},{"lang":"html","id":"html-schema-jsonld","title":"HTML: микроразметка Schema.org (JSON-LD)","summary":"Структурированные данные для поисковых систем Google и Яндекс, позволяющие получить расширенные сниппеты (звезды, цены, FAQ).","code":"\u003cscript type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"WebApplication\",\n  \"name\": \"DevShelf\",\n  \"url\": \"https://example.com\",\n  \"description\": \"Справочник веб-разработчика и интерактивная песочница\",\n  \"applicationCategory\": \"DeveloperApplication\",\n  \"operatingSystem\": \"All\",\n  \"offers\": {\n    \"@type\": \"Offer\",\n    \"price\": \"0\",\n    \"priceCurrency\": \"RUB\"\n  }\n}\n\u003c/script>","example":"\u003c!-- Для статей используй @type: \"Article\", для интернет-магазинов @type: \"Product\" -->","points":["Формат JSON-LD рекомендован Google, так как он отделен от HTML-верстки и не ломается при смене дизайна.","Размещается внутри тега \u003cscript type=\"application/ld+json\"> в секции \u003chead> или перед \u003c/body>.","Проверить корректность синтаксиса можно в официальном валидаторе Google Rich Results Test."],"tags":["HTML","schema","json-ld","микроразметка","сео","seo","google","яндекс","структура"],"when":"Используй для интернет-магазинов (товары, отзывы), блогов (автор, дата публикации), FAQ и рецептов.","alternatives":"Устаревшие атрибуты Microdata (itemscope, itemprop) сложнее поддерживать при редизайне верстки.","url":"https://schema.org/"},{"lang":"html","id":"html-semantic","title":"HTML: семантическая структура страницы","summary":"Использование осмысленных тегов вместо бесконечных \u003cdiv> для доступности, SEO и правильной архитектуры документа.","code":"\u003cheader>\n  \u003cnav aria-label=\"Основная навигация\">\n    \u003ca href=\"/\">Главная\u003c/a>\n    \u003ca href=\"/catalog\">Каталог\u003c/a>\n  \u003c/nav>\n\u003c/header>\n\n\u003cmain>\n  \u003carticle>\n    \u003cheader>\n      \u003ch1>Заголовок статьи\u003c/h1>\n      \u003cp>\u003ctime datetime=\"2026-03-15\">15 марта 2026\u003c/time>\u003c/p>\n    \u003c/header>\n    \u003cp>Основной текст статьи...\u003c/p>\n    \u003csection>\n      \u003ch2>Подраздел статьи\u003c/h2>\n      \u003cp>Текст раздела...\u003c/p>\n    \u003c/section>\n  \u003c/article>\n\n  \u003caside aria-label=\"Связанные материалы\">\n    \u003ch3>Смотрите также\u003c/h3>\n  \u003c/aside>\n\u003c/main>\n\n\u003cfooter>\n  \u003cp>&copy; 2026 Компания\u003c/p>\n\u003c/footer>","example":"\u003cmain id=\"
