ations.php"},{"lang":"php","id":"php-strings-heredoc","title":"PHP 8: функции строк (str_contains, str_starts_with, mb_strlen, sprintf)","summary":"Современная проверка подстрок в PHP 8, корректная работа с кириллицей в UTF-8 через mb_* и мультистроки.","code":"\u003c?php\ndeclare(strict_types=1);\n\n$title = 'Руководство по PHP 8.3';\n\n// Корректная длина кириллической строки в UTF-8\n$length = mb_strlen($title, 'UTF-8'); // 22 (обычный strlen вернул бы 39 байт!)\n$upper  = mb_strtoupper($title, 'UTF-8');\n\n// Нативные функции проверки подстрок из PHP 8\nif (str_contains($title, 'PHP') && str_starts_with($title, 'Руководство')) {\n    echo sprintf('Найдена статья \"%s\" (%d симв.)', $title, $length);\n}","example":"$parts = explode(',', 'html,css,php');\n$joined = implode(' · ', $parts);","points":["В UTF-8 каждая русская буква занимает 2 байта, поэтому для подсчёта символов, обрезки и смены регистра ВСЕГДА используй функции с префиксом mb_ (mb_strlen, mb_substr, mb_strtolower)!","Функции PHP 8 str_contains(), str_starts_with() и str_ends_with() навсегда избавили от путаницы с strpos() !== false.","Функция trim($str) удаляет пробелы и переносы строк по краям пользовательского ввода."],"tags":["PHP","str_contains","str_starts_with","mb_strlen","mb_substr","explode","implode","строки","utf-8"],"when":"При валидации текста на русском языке, проверке URL/префиксов и форматировании сообщений.","alternatives":"Никогда не используй обычный substr() на русском тексте — он разрежет двухбайтовый символ пополам и выдаст «кракозябры» ().","url":"https://www.php.net/manual/ru/function.str-contains.php"},{"lang":"php","id":"php-arrays-functions","title":"PHP 8: работа с массивами (array_map, array_filter, array_column, in_array)","summary":"Трансформация, фильтрация ассоциативных массивов, быстрая индексация по ID и строгий поиск значений.","code":"\u003c?php\ndeclare(strict_types=1);\n\n$users = [\n    ['id' => 10, 'name' => 'Анна', 'role' => 'admin'],\n    ['id' => 20, 'name' => 'Игорь', 'role' => 'editor'],\n];\n\n// Короткие стрелочные функции fn() имеют доступ к внешним переменным\n$admins = array_values(array_filter($users, fn(array $u): bool => $u['role'] === 'admin'));\n\n// Извлечение колонки или переиндексация массива по полю 'id' за один вызов!\n$namesById = array_column($users, 'name', 'id'); // [10 => 'Анна', 20 => 'Игорь']\n\n// ВСЕГДА передавай третий параметр true (strict) в in_array!\n$isAllowed = in_array('admin', ['user', 'admin'], true);","example":"$merged = [...$defaultConfig, ...$customConfig]; /* Распаковка массивов в PHP 8.1+ */","points":["Обязательно передавай третий аргумент true в in_array($needle, $haystack, true), иначе из-за нестрогого сравнения in_array(0, [\"admin\"]) вернёт true!","После array_filter() ключи массива сохраняют старые номера (например, [0, 3, 5]). Оберни результат в array_values(), чтобы получить чистый список [0, 1, 2] для JSON.","Функция array_column($rows, null, \"id\") превращает результат SQL-запроса в словарь с мгновенным поиском по ID."],"tags":["PHP","array_map","array_filter","array_column","in_array","array_values","fn","массивы"],"when":"При подготовке выборок из базы данных к выводу в шаблон или отдаче по JSON API.","alternatives":"Обычный цикл foreach часто читается проще, если внутри нужно одновременно фильтровать и менять структуру.","url":"https://www.php.net/manual/ru/function.array-column.php"},{"lang":"php","id":"php-match-nullsafe","title":"PHP 8: выражение match, именованные аргументы и оператор ?-> (Nullsafe)","summary":"Строгая современная замена громоздкому switch-case, вызов функций по именам параметров и безопасные цепочки.","code":"\u003c?php\ndeclare(strict_types=1);\n\n// match возвращает значение, сравнивает строго (===) и не требует break!\n$statusText = match ($httpCode) {\n    200, 201 => 'Успешно',\n    400, 422 => 'Ошибка валидации данных',\n    404      => 'Страница не найдена',\n    default  => 'Внутренняя ошибка сервера',\n};\n\n// Nullsafe оператор ?-> не упадёт с Fatal Error, если $user или getProfile() вернёт null\n$country = $user?->getProfile()?->getAddress()?->country ?? 'RU';\n\n// Именованные аргументы делают вызов самодокументируемым\nsetcookie(name: 'theme', value: 'dark', httponly: true, samesite: 'Lax');","example":"/* Если в match не сработает ни одна ветка и нет default, PHP выбросит UnhandledMatchError */","points":["В отличие от старого switch, выражение match использует строгое сравнение (===) и никогда «не проваливается» в следующую ветку из-за забытого break.","Оператор ?-> (nullsafe) мгновенно обрывает цепочку вызовов и возвращает null, если любой промежуточный объект оказался пустым.","Именованные аргументы позволяют пропускать необязательные параметры в середине списка без передачи десятка пустых значений."],"tags":["PHP","match","nullsafe","?->","named arguments","switch","условия"],"when":"При маппинге статусов заказов, HTTP-кодов, ролей и настройке функций со множеством флагов.","alternatives":"Используй if/elseif, если нужно проверить сложные составные условия, не сводящиеся к одному значению.","url":"https://www.php.net/manual/ru/control-structures.match.php"},{"lang":"php","id":"php-oop-enums","title":"PHP 8: классы, продвижение свойств конструктора, readonly и перечисления (enum)","summary":"Лаконичное объявление DTO и сервисов без шаблонного кода и типобезопасные перечисления статусов.","code":"\u003c?php\ndeclare(strict_types=1);\n\nenum OrderStatus: string {\n    case Pending = 'pending';\n    case Paid    = 'paid';\n    case Shipped = 'shipped';\n}\n\nreadonly class OrderDto {\n    // Свойства объявляются и присваиваются прямо в круглых скобках конструктора!\n    public function __construct(\n        public int $id,\n        public float $amount,\n        public OrderStatus $status = OrderStatus::Pending,\n    ) {}\n}\n\n$order = new OrderDto(id: 42, amount: 2500.0);","example":"$status = OrderStatus::tryFrom($_POST['status'] ?? '') ?? OrderStatus::Pending;","points":["Constructor Property Promotion сокращает код класса в 3 раза: больше не нужно дублировать поля сверху и писать $this->id = $id внутри конструктора.","Модификатор readonly на классе гарантирует, что объект нельзя случайно изменить после создания (идеально для DTO и конфигураций).","Backed Enum (enum Status: string) имеет встроенный метод Status::tryFrom($val), который безопасно парсит строку из БД или формы."],"tags":["PHP","class","readonly","enum","construct","oop","классы","перечисления"],"when":"При проектировании моделей данных, сервисов, статусов заказов и ролей пользователей.","alternatives":"Старые константы класса STATUS_PAID = \"paid\" не дают проверки типов в аргументах функций.","url":"https://www.php.net/manual/ru/language.enumerations.php"},{"lang":"php","id":"php-forms-xss-csrf","title":"PHP 8: обработка форм ($_POST), фильтрация filter_input и защита от XSS / CSRF","summary":"Безопасный приём данных от пользователя, валидация email, экранирование HTML-вывода и проверка CSRF-токена.","code":"\u003c?php\ndeclare(strict_types=1);\nsession_start();\n\n// Защита от подделки межсайтовых запросов (CSRF)\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    $token = $_POST['csrf_token'] ?? '';\n    if (!hash_equals($_SESSION['csrf_token'] ?? '', $token)) {\n        http_response_code(403);\n        exit('Неверный CSRF-токен');\n    }\n\n    $email = filter_input(INPUT_POST, 'email', FILTER_VALIDATE_EMAIL);\n    $name  = trim((string) ($_POST['name'] ?? ''));\n}\n\n// Функция безопасного вывода в HTML-шаблон (защита от XSS)\nfunction e(string $value): string {\n    return htmlspecialchars($value, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');\n}","example":"\u003cinput type=\"hidden\" name=\"csrf_token\" value=\"\u003c?= e($_SESSION['csrf_token']) ?>\">","points":["Любые данные от пользователя ($name, $_GET[\"q\"]) при выводе в HTML ОБЯЗАТЕЛЬНО пропускай через htmlspecialchars(..., ENT_QUOTES, \"UTF-8\"), иначе злоумышленник внедрит \u003cscript>!","Для проверки email и URL используй встроенный filter_var($val, FILTER_VALIDATE_EMAIL) вместо самописных регулярок.","Сравнивай секретные токены только через функцию hash_equals(), защищённую от атак по времени (timing attacks)."],"tags":["PHP","POST","GET","htmlspecialchars","XSS","CSRF","filter_input","безопасность","формы"],"when":"В каждом обработчике форм обратной связи, авторизации, комментариев и личного кабинета.","alternatives":"Шаблонизаторы вроде Twig и Blade экранируют вывод {{ $name }} автоматически по умолчанию.","url":"https://www.php.net/manual/ru/function.htmlspecialchars.php"},{"lang":"php","id":"php-sessions-passwords","title":"PHP 8: хеширование паролей (password_hash / password_verify) и безопасные сессии","summary":"Надёжное хранение паролей с солью (bcrypt / Argon2) и защита сессионных кук от перехвата.","code":"\u003c?php\ndeclare(strict_types=1);\n\n// 1. При регистрации: создаём криптостойкий хеш с автоматической солью\n$passwordHash = password_hash($plainPassword, PASSWORD_DEFAULT);\n\n// 2. При входе: проверяем введённый пароль против хеша из БД\nif (password_verify($plainPassword, $userFromDb['password_hash'])) {\n    // Защита от фиксации сессии (Session Fixation) после успешного входа!\n    session_regenerate_id(true);\n    $_SESSION['user_id'] = (int) $userFromDb['id'];\n}","example":"session_set_cookie_params(['httponly' => true, 'secure' => true, 'samesite' => 'Lax']);\nsession_start();","points":["НИКОГДА не используй md5() или sha1() для паролей — они взламываются по радужным таблицам за секунды. Используй только password_hash() и password_verify()!","Флаг httponly => true запрещает JavaScript-скриптам читать сессионную куку через document.cookie в случае XSS.","Вызов session_regenerate_id(true) сразу после логина меняет ID сессии, защищая пользователя от кражи сессии."],"tags":["PHP","password_hash","password_verify","session_start","cookie","авторизация","пароли","сессии"],"when":"При реализации регистрации, входа на сайт и смены пароля пользователя.","alternatives":"Для stateless REST API и мобильных приложений вместо сессий часто используют подписанные токены или БД-токены.","url":"https://www.php.net/manual/ru/function.password-hash.php"},{"lang":"php","id":"php-pdo-connection-transactions","title":"PHP 8: подключение PDO к MySQL/PostgreSQL и транзакции (beginTransaction / commit)","summary":"Правильная конфигурация PDO с выбросом исключений и атомарное выполнение нескольких SQL-запросов.","code":"\u003c?php\ndeclare(strict_types=1);\n\n$dsn = 'mysql:host=127.0.0.1;dbname=app_db;charset=utf8mb4';\n$pdo = new PDO($dsn, $dbUser, $dbPass, [\n    PDO::ATTR_ERRMODE            => PDO::ERRMODE_EXCEPTION, // Выбрасывать исключения при ошибках SQL\n    PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,       // Возвращать ассоциативные массивы\n    PDO::ATTR_EMULATE_PREPARES   => false,                  // Честные подготовленные запросы на стороне БД\n]);\n\n// Транзакция: либо выполнятся оба запроса, либо ни один!\ntry {\n    $pdo->beginTransaction();\n    $pdo->prepare('UPDATE accounts SET balance = balance - ? WHERE id = ?')->execute([500, $fromId]);\n    $pdo->prepare('UPDATE accounts SET balance = balance + ? WHERE id = ?')->execute([500, $toId]);\n    $pdo->commit();\n} catch (Throwable $e) {\n    if ($pdo->inTransaction()) $pdo->rollBack();\n    throw $e;\n}","example":"$lastId = (int) $pdo->lastInsertId();","points":["В DSN для MySQL всегда указывай charset=utf8mb4 (а не старый utf8), чтобы база корректно сохраняла любые символы и эмодзи.","PDO::ATTR_EMULATE_PREPARES => false заставляет MySQL возвращать числа как int/float, а не превращать все поля в строки.","Транзакции (beginTransaction / commit / rollBack) гарантируют целостность данных при создании заказа, списании баланса и сложных обновлениях."],"tags":["PHP","PDO","MySQL","transaction","beginTransaction","commit","rollBack","база данных","sql"],"when":"В едином файле подключения к БД и при любых операциях, изменяющих сразу несколько связанных таблиц.","alternatives":"Не используй устаревшие функции mysql_* или склейку переменных прямо в строку SQL-запроса.","url":"https://www.php.net/manual/ru/pdo.transactions.php"},{"lang":"php","id":"php-json-rest-api","title":"PHP 8: создание JSON API эндпоинта (json_encode, json_decode, php://input)","summary":"Приём JSON-тела запроса от fetch(), корректная работа с кириллицей JSON_UNESCAPED_UNICODE и коды ответа.","code":"\u003c?php\ndeclare(strict_types=1);\n\nheader('Content-Type: application/json; charset=utf-8');\n\n// Читаем JSON-тело POST/PUT запроса из потока php://input\n$rawBody = file_get_contents('php://input');\ntry {\n    $data = json_decode($rawBody ?: '{}', true, 512, JSON_THROW_ON_ERROR);\n} catch (JsonException $e) {\n    http_response_code(400);\n    echo json_encode(['error' => 'Некорректный JSON'], JSON_UNESCAPED_UNICODE);\n    exit;\n}\n\nhttp_response_code(201);\necho json_encode([\n    'status' => 'ok',\n    'received' => $data['title'] ?? null,\n], JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);","example":"/* При отправке fetch() с заголовком application/json массив $_POST остаётся пустым — читай php://input! */","points":["Когда фронтенд отправляет JSON через fetch(), данные попадают НЕ в $_POST, а в поток php://input!","Флаг JSON_UNESCAPED_UNICODE оставляет русские буквы читаемыми (\"Привет\"), вместо превращения их в \"\\u041f\\u0440...\".","Флаг JSON_THROW_ON_ERROR выбрасывает понятное исключение JsonException при битом JSON вместо молчаливого возврата null."],"tags":["PHP","json_encode","json_decode","php://input","REST API","JSON_UNESCAPED_UNICODE","api"],"when":"При написании бэкенда для AJAX-запросов, SPA-приложений, вебхуков Telegram и мобильных клиентов.","alternatives":"Для обычных HTML-форм с multipart/form-data данные по-прежнему приходят в $_POST и $_FILES.","url":"https://www.php.net/manual/ru/function.json-encode.php"},{"lang":"php","id":"php-files-uploads","title":"PHP 8: работа с файлами и безопасная загрузка изображений ($_FILES)","summary":"Чтение и атомарная запись файлов с блокировкой LOCK_EX и проверка реального MIME-типа загружаемых картинок.","code":"\u003c?php\ndeclare(strict_types=1);\n\nif (!empty($_FILES['avatar']['tmp_name']) && $_FILES['avatar']['error'] === UPLOAD_ERR_OK) {\n    $tmpPath = $_FILES['avatar']['tmp_name'];\n\n    // Проверяем реальный MIME-тип содержимого файла, а не расширение из имени!\n    $finfo = new finfo(FILEINFO_MIME_TYPE);\n    $mime  = $finfo->file($tmpPath);\n    $allowed = ['image/jpeg' => 'jpg', 'image/png' => 'png', 'image/webp' => 'webp'];\n\n    if (!isset($allowed[$mime])) {\n        exit('Разрешены только изображения JPG, PNG и WebP');\n    }\n\n    // Генерируем безопасное случайное имя файла\n    $newName = bin2hex(random_bytes(12)) . '.' . $allowed[$mime];\n    move_uploaded_file($tmpPath, __DIR__ . '/uploads/' . $newName);\n}","example":"file_put_contents(__DIR__ . '/app.log', $line . PHP_EOL, FILE_APPEND | LOCK_EX);","points":["Никогда не доверяй $_FILES[\"file\"][\"type\"] и оригинальному имени файла — злоумышленник может загрузить скрипт shell.php под видом картинки!","Всегда проверяй реальное содержимое через finfo(FILEINFO_MIME_TYPE) и генерируй новое имя через bin2hex(random_bytes(12)).","При записи логов через file_put_contents() используй флаги FILE_APPEND | LOCK_EX, чтобы параллельные запросы не повредили файл."],"tags":["PHP","FILES","move_uploaded_file","file_get_contents","file_put_contents","finfo","загрузка файлов"],"when":"При загрузке аватаров, прайс-листов, документов и ведении файловых логов или кэша.","alternatives":"В папке /uploads обязательно запрети исполнение PHP-скриптов через настройки Nginx или .htaccess.","url":"https://www.php.net/manual/ru/features.file-upload.post-method.php"},{"lang":"php","id":"php-curl-datetime","title":"PHP 8: HTTP-запросы через cURL и неизменяемые даты DateTimeImmutable","summary":"Отправка серверных запросов к внешним API (Telegram Bot API, платёжные шлюзы) и точные расчёты дат.","code":"\u003c?php\ndeclare(strict_types=1);\n\n// 1. DateTimeImmutable не меняет исходный объект при прибавлении дней!\n$now = new DateTimeImmutable('now', new DateTimeZone('Europe/Moscow'));\n$expiresAt = $now->modify('+7 days')->format('Y-m-d H:i:s');\n\n// 2. Отправка JSON POST-запроса к внешнему API через cURL\n$ch = curl_init('https://api.example.com/v1/notify');\ncurl_setopt_array($ch, [\n    CURLOPT_POST           => true,\n    CURLOPT_RETURNTRANSFER => true,\n    CURLOPT_TIMEOUT        => 10,\n    CURLOPT_HTTPHEADER     => ['Content-Type: application/json'],\n    CURLOPT_POSTFIELDS     => json_encode(['date' => $expiresAt]),\n]);\n$response = curl_exec($ch);\n$httpCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);","example":"$diff = $now->diff($expiresAt)->days;","points":["Всегда используй DateTimeImmutable вместо старого DateTime, чтобы вызов ->modify(\"+1 day\") создавал новую дату, а не мутировал исходную переменную в коде!","В cURL обязательно задавай CURLOPT_TIMEOUT (например, 10 секунд), чтобы зависший внешний сервис не заблокировал воркеры твоего сервера.","Для крупных проектов поверх cURL удобно использовать PSR-18 HTTP-клиент Guzzle."],"tags":["PHP","curl","DateTimeImmutable","DateTimeZone","http","запрос","дата","время"],"when":"Для интеграции с внешними API, отправки уведомлений в Telegram и расчёта срока действия подписок.","alternatives":"file_get_contents(\"https://...\") не позволяет гибко контролировать заголовки, коды ошибок и таймауты как cURL.","url":"https://www.php.net/manual/ru/class.datetimeimmutable.php"},{"lang":"xml","id":"xml-svg-inline","title":"SVG & XML: векторная графика \u003csvg>, viewBox и перекрашивание через currentColor","summary":"Устройство векторных иконок, масштабируемая сетка координат viewBox и управление цветом и обводкой из CSS.","code":"\u003csvg\n  xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n  aria-hidden=\"true\"\n>\n  \u003ccircle cx=\"11\" cy=\"11\" r=\"8\">\u003c/circle>\n  \u003cline x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\">\u003c/line>\n\u003c/svg>","example":".btn:hover svg {\n  color: #38bdf8;\n  transform: scale(1.1);\n}","points":["Атрибут viewBox=\"0 0 24 24\" задаёт внутреннюю систему координат холста: благодаря ему иконка идеально масштабируется под любые width и height без потери чёткости.","Значение stroke=\"currentColor\" или fill=\"currentColor\" заставляет SVG автоматически наследовать цвет текста родительской кнопки или ссылки!","Декоративным иконкам рядом с текстом кнопки добавляй aria-hidden=\"true\", чтобы скринридер не пытался озвучить векторные пути."],"tags":["XML","SVG","viewBox","currentColor","stroke","fill","path","иконки","вектор"],"when":"Для всех интерфейсных иконок, логотипов, графиков и анимированных иллюстраций.","alternatives":"Подключение SVG через \u003cimg src=\"icon.svg\"> не позволяет менять цвет иконки при наведении через CSS.","url":"https://developer.mozilla.org/ru/docs/Web/SVG"},{"lang":"xml","id":"xml-rss-feed","title":"XML: лента новостей и блога RSS 2.0 (feed.xml)","summary":"Стандартный XML-формат для автоматической трансляции новых статей блога в агрегаторы, Telegram-боты и Яндекс.Дзен.","code":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\u003crss version=\"2.0\" xmlns:atom=\"http://www.w3.org/2005/Atom\">\n  \u003cchannel>\n    \u003ctitle>DevShelf — Блог о веб-разработке\u003c/title>\n    \u003clink>https://example.com/\u003c/link>\n    \u003cdescription>Свежие руководства по HTML, CSS, JS и PHP\u003c/description>\n    \u003clanguage>ru\u003c/language>\n    \u003citem>\n      \u003ctitle>Полное руководство по CSS Grid и Subgrid\u003c/title>\n      \u003clink>https://example.com/blog/css-grid\u003c/link>\n      \u003cguid isPermaLink=\"true\">https://example.com/blog/css-grid\u003c/guid>\n      \u003cpubDate>Mon, 15 Sep 2026 12:00:00 +0300\u003c/pubDate>\n      \u003cdescription>\u003c![CDATA[\u003cp>Разбираем практические примеры верстки сеток...\u003c/p>]]>\u003c/description>\n    \u003c/item>\n  \u003c/channel>\n\u003c/rss>","example":"\u003clink rel=\"alternate\" type=\"application/rss+xml\" title=\"RSS\" href=\"/rss.xml\">","points":["Внутри тега \u003cdescription> используй секцию \u003c![CDATA[ ... ]]>, чтобы HTML-теги абзацев и ссылок не ломали парсинг XML.","Дата публикации \u003cpubDate> в RSS 2.0 должна быть в формате RFC 2822 (в PHP это константа DATE_RSS).","Добавь тег \u003clink rel=\"alternate\" type=\"application/rss+xml\" href=\"/rss.xml\"> в \u003chead> сайта для автообнаружения ленты браузерами."],"tags":["XML","RSS","feed","CDATA","pubDate","лента","блог","новости","синдикация"],"when":"Для новостных сайтов, технических блогов, подкастов и автопостинга в соцсети.","alternatives":"Формат Atom (application/atom+xml) или JSON Feed выполняют ту же задачу.","url":"https://www.rssboard.org/rss-specification"},{"lang":"xml","id":"seo-meta-robots-canonical","title":"SEO: управление индексацией (\u003cmeta name=\"robots\">, canonical, X-Robots-Tag)","summary":"Точечный запрет индексации служебных страниц, защита от дублей с GET-параметрами и управление сниппетами.","code":"\u003chead>\n  \u003c!-- Основной канонический адрес страницы без UTM-меток и параметров сортировки -->\n  \u003clink rel=\"canonical\" href=\"https://example.com/catalog/laptops\">\n\n  \u003c!-- Запретить индексацию страницы поиска или личного кабинета, но разрешить переход по ссылкам -->\n  \u003cmeta name=\"robots\" content=\"noindex, follow\">\n\n  \u003c!-- Разрешить крупные превью картинок в выдаче Google Discover -->\n  \u003cmeta name=\"robots\" content=\"index, follow, max-image-preview:large\">\n\u003c/head>","example":"/* В PHP для PDF-файлов или ответов API: header('X-Robots-Tag: noindex, nofollow'); */","points":["Важно: если страница закрыта в файле robots.txt через Disallow, поисковый бот НЕ зайдёт на неё и НЕ увидит тег \u003cmeta name=\"robots\" content=\"noindex\">! Чтобы гарантированно удалить страницу из выдачи, открой её в robots.txt и поставь meta noindex.","Тег \u003clink rel=\"canonical\"> спасает сайт от потери позиций из-за дублей вида ?utm_source=tg или ?sort=price.","HTTP-заголовок X-Robots-Tag: noindex позволяет закрыть от индексации не только HTML, но и PDF-документы или тестовый поддомен."],"tags":["XML","SEO","robots","noindex","nofollow","canonical","индексация","дубли","поисковики"],"when":"На всех страницах каталога с фильтрами (canonical), в личных кабинетах, корзине и результатах поиска (noindex).","alternatives":"Для склейки старых переехавших адресов со сменой URL используй серверный 301 редирект.","url":"https://developers.google.com/search/docs/crawling-indexing/robots-meta-tag?hl=ru"},{"lang":"xml","id":"seo-htaccess-apache","title":"Server & SEO: настройка .htaccess (кэширование, Gzip, защита и ЧПУ-роутинг)","summary":"Конфигурация веб-сервера Apache для единой точки входа SPA/PHP, сжатия статики и заголовков безопасности.","code":"Options -Indexes\nDirectoryIndex index.html index.php\n\n\u003cIfModule mod_rewrite.c>\n  RewriteEngine On\n  # Перенаправляем все несуществующие пути на index.php (или index.html для SPA)\n  RewriteCond %{REQUEST_FILENAME} !-f\n  RewriteCond %{REQUEST_FILENAME} !-d\n  RewriteRule ^ index.html [L]\n\u003c/IfModule>\n\n\u003cIfModule mod_headers.c>\n  Header set X-Content-Type-Options \"nosniff\"\n  Header set Referrer-Policy \"strict-origin-when-cross-origin\"\n\u003c/IfModule>","example":"ErrorDocument 404 /404.html","points":["Options -Indexes запрещает серверу показывать список файлов в папке, если в ней нет индексного файла.","На виртуальных хостингах (например, Beget) редирект на HTTPS лучше включать галочкой в панели управления, чтобы не создать бесконечный цикл редиректов (ERR_TOO_MANY_REDIRECTS) между Nginx и Apache!","Условия !-f и !-d проверяют, что запрашиваемый URL не является реальным файлом (картинкой, CSS) или папкой на диске."],"tags":["XML","SEO","htaccess","apache","rewrite","безопасность","сервер","редирект","beget"],"when":"При размещении сайтов и веб-приложений на хостингах с веб-сервером Apache.","alternatives":"На VPS с чистым Nginx вместо .htaccess используется блок try_files $uri $uri/ /index.html; в nginx.conf.","url":"https://httpd.apache.org/docs/current/howto/htaccess.html"},{"lang":"recipes","id":"recipe-dropdown-menu","title":"Рецепт: Выпадающее меню (Dropdown) с закрытием по клику вне блока","summary":"Доступное выпадающее меню профиля или действий с поддержкой клавиши Esc и автоматическим закрытием при клике мимо.","code":"\u003cdiv class=\"dropdown\" id=\"user-dropdown\">\n  \u003cbutton type=\"button\" class=\"dropdown-trigger\" aria-expanded=\"false\">\n    Аккаунт ▾\n  \u003c/button>\n  \u003cdiv class=\"dropdown-menu\" hidden>\n    \u003ca href=\"#profile\">Мой профиль\u003c/a>\n    \u003ca href=\"#billing\">Подписка и счета\u003c/a>\n    \u003chr>\n    \u003cbutton type=\"button\" class=\"danger\">Выйти\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\nconst dd = document.getElementById('user-dropdown');\nconst btn = dd.querySelector('.dropdown-trigger');\nconst menu = dd.querySelector('.dropdown-menu');\n\nfunction toggleDropdown(force) {\n  const isOpen = typeof force === 'boolean' ? force : menu.hidden;\n  menu.hidden = !isOpen;\n  btn.setAttribute('aria-expanded', String(isOpen));\n}\n\nbtn.addEventListener('click', (e) => {\n  e.stopPropagation();\n  toggleDropdown();\n});\n\ndocument.addEventListener('click', (e) => {\n  if (!dd.contains(e.target)) toggleDropdown(false);\n});\ndocument.addEventListener('keydown', (e) => {\n  if (e.key === 'Escape') toggleDropdown(false);\n});\n\u003c/script>","example":".dropdown { position: relative; display: inline-block; }\n.dropdown-menu { position: absolute; right: 0; top: calc(100% + 6px); }","points":["Проверка !dd.contains(e.target) на документе надёжно закрывает меню при клике в любое место страницы за пределами компонента.","Синхронизация атрибута hidden и aria-expanded гарантирует правильную работу со скринридерами.","Позиционирование top: calc(100% + 6px) располагает выпадающий список ровно на 6px ниже кнопки."],"tags":["рецепт","dropdown","выпадающее меню","меню профиля","клик вне","поповер"],"when":"Для меню профиля в шапке, выбора языка, сортировки и меню «три точки» в таблицах.","alternatives":"В современных браузерах можно также использовать нативный атрибут popover.","url":"https://www.w3.org/WAI/ARIA/apg/patterns/menu-button/"},{"lang":"recipes","id":"recipe-toast-notifications","title":"Рецепт: Всплывающие уведомления (Toast) с автоскрытием и стеком","summary":"Лёгкая функция вызова неблокирующих уведомлений в углу экрана с плавной анимацией и поддержкой aria-live.","code":"\u003cdiv id=\"toast-stack\" class=\"toast-stack\" aria-live=\"polite\">\u003c/div>\n\u003cbutton type=\"button\" onclick=\"showToast('Настройки успешно сохранены!', 'success')\">\n  Показать уведомление\n\u003c/button>\n\n\u003cscript>\nfunction showToast(message, type = 'info') {\n  const stack = document.getElementById('toast-stack');\n  const toast = document.createElement('div');\n  toast.className = `toast-item toast-${type}`;\n  toast.textContent = message;\n  stack.appendChild(toast);\n\n  setTimeout(() => {\n    toast.classList.add('is-leaving');\n    toast.addEventListener('transitionend', () => toast.remove());\n  }, 3000);\n}\n\u003c/script>","example":".toast-stack { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }","points":["Контейнер со свойством display: flex; flex-direction: column; gap: 8px аккуратно выстраивает несколько уведомлений друг над другом.","pointer-events: none на самом контейнере гарантирует, что невидимая область стека не перекроет кнопки под ней.","Атрибут aria-live=\"polite\" автоматически зачитывает текст уведомления незрячим пользователям."],"tags":["рецепт","toast","тост","уведомление","алерт","нотификация","всплывашка"],"when":"При копировании в буфер обмена, сохранении формы, добавлении товара в корзину и сетевых ошибках.","alternatives":"Никогда не используй блокирующий системный window.alert() в современных интерфейсах.","url":"https://developer.mozilla.org/ru/docs/Web/Accessibility/ARIA/Roles/status_role"},{"lang":"recipes","id":"recipe-theme-switcher","title":"Рецепт: Переключатель тёмной и светлой темы с localStorage и prefers-color-scheme","summary":"Мгновенное переключение темы оформления с сохранением выбора пользователя и учётом системной темы ОС.","code":"\u003cbutton type=\"button\" id=\"theme-btn\" aria-label=\"Сменить тему\">\n  Переключить тему\n\u003c/button>\n\n\u003cscript>\nconst root = document.documentElement;\nconst saved = localStorage.getItem('theme');\nconst systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;\n\nconst initialTheme = saved ?? (systemDark ? 'dark' : 'light');\nroot.dataset.theme = initialTheme;\n\ndocument.getElementById('theme-btn').addEventListener('click', () => {\n  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';\n  root.dataset.theme = next;\n  localStorage.setItem('theme', next);\n});\n\u003c/script>","example":":root[data-theme=\"dark\"] { --bg: #090d14; --text: #f8fafc; }\n:root[data-theme=\"light\"] { --bg: #f8fafc; --text: #0f172a; }","points":["Чтобы избежать белой вспышки (FOUC) при загрузке страницы, маленький скрипт проверки localStorage ставят синхронно в \u003chead>.","Свойство color-scheme: dark / light на :root автоматически перекрашивает системные полосы прокрутки (scrollbars) и календари инпутов!","Если пользователь ещё не выбирал тему вручную, matchMedia(\"(prefers-color-scheme: dark)\") бережно подстроится под настройки его системы."],"tags":["рецепт","dark mode","тема","тёмная тема","светлая тема","localStorage","переключатель"],"when":"В документации, дашбордах, читалках и веб-приложениях.","alternatives":"Функция CSS light-dark() позволяет описывать обе палитры прямо в одной CSS-переменной.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/@media/prefers-color-scheme"},{"lang":"recipes","id":"recipe-live-search-filter","title":"Рецепт: Живой поиск и фильтрация карточек на странице без перезагрузки","summary":"Мгновенная фильтрация списка карточек или таблицы по введённому тексту с подсчётом найденных элементов и пустым состоянием.","code":"\u003cinput type=\"search\" id=\"filter-input\" placeholder=\"Поиск по карточкам...\">\n\u003cul id=\"cards-list\">\n  \u003cli class=\"item\">Адаптивная сетка CSS Grid\u003c/li>\n  \u003cli class=\"item\">Модальное окно HTML Dialog\u003c/li>\n  \u003cli class=\"item\">Запросы к серверу Fetch API\u003c/li>\n\u003c/ul>\n\u003cp id=\"empty-msg\" hidden>Ничего не найдено\u003c/p>\n\n\u003cscript>\nconst input = document.getElementById('filter-input');\nconst items = Array.from(document.querySelectorAll('#cards-list .item'));\nconst emptyMsg = document.getElementById('empty-msg');\n\ninput.addEventListener('input', () => {\n  const query = input.value.trim().toLowerCase();\n  let visibleCount = 0;\n\n  items.forEach(item => {\n    const match = item.textContent.toLowerCase().includes(query);\n    item.hidden = !match;\n    if (match) visibleCount++;\n  });\n\n  emptyMsg.hidden = visibleCount > 0;\n});\n\u003c/script>","example":"/* Использование item.hidden = !match чисто скрывает несовпадающие карточки */","points":["Приведение строки и текста карточки к единому регистру через .toLowerCase() делает поиск нечувствительным к заглавным буквам.","Скрытие через атрибут item.hidden не удаляет узлы из DOM, поэтому при очистке поля поиска все карточки мгновенно возвращаются на место.","Обязательно показывай блок «Ничего не найдено» (empty state), когда visibleCount === 0."],"tags":["рецепт","поиск","фильтр","живой поиск","search","filter","список"],"when":"Для фильтрации FAQ, справочников, таблиц тарифов, списков контактов и каталогов до 500 элементов.","alternatives":"Для базы из десятков тысяч товаров фильтрацию лучше выполнять на сервере с debounce.","url":"https://developer.mozilla.org/ru/docs/Web/API/HTMLElement/hidden"},{"lang":"recipes","id":"recipe-copy-code-button","title":"Рецепт: Блок кода с кнопкой «Скопировать» и подсветкой статуса","summary":"Готовый компонент сниппета документации с копированием в буфер обмена и сменой состояния кнопки.","code":"\u003cdiv class=\"code-card\">\n  \u003cdiv class=\"code-header\">\n    \u003cspan>bash\u003c/span>\n    \u003cbutton type=\"button\" class=\"copy-trigger\">Копировать\u003c/button>\n  \u003c/div>\n  \u003cpre>\u003ccode>npm create vite@latest my-app\u003c/code>\u003c/pre>\n\u003c/div>\n\n\u003cscript>\ndocument.querySelectorAll('.copy-trigger').forEach(btn => {\n  btn.addEventListener('click', async () => {\n    const code = btn.closest('.code-card').querySelector('code').textContent;\n    await navigator.clipboard.writeText(code);\n    btn.textContent = '✓ Скопировано';\n    btn.classList.add('is-copied');\n    setTimeout(() => {\n      btn.textContent = 'Копировать';\n      btn.classList.remove('is-copied');\n    }, 1800);\n  });\n});\n\u003c/script>","example":".copy-trigger.is-copied { color: #10b981; border-color: #10b981; }","points":["Навигация через btn.closest(\".code-card\").querySelector(\"code\") позволяет иметь сколько угодно блоков кода на странице без привязки к уникальным ID.","Чтение через .textContent берёт чистый текст команды без HTML-тегов подсветки синтаксиса.","Визуальный класс .is-copied меняет цвет рамки и текста на зелёный на 1.8 секунды."],"tags":["рецепт","копировать код","copy","clipboard","сниппет","документация"],"when":"В технических блогах, документации API, личных кабинетах с API-ключами и промокодами.","alternatives":"Можно также использовать делегирование событий на document вместо цикла по кнопкам.","url":"https://developer.mozilla.org/ru/docs/Web/API/Clipboard/writeText"},{"lang":"html","id":"html-canvas","title":"HTML: холст для 2D и 3D графики \u003ccanvas>","summary":"Растровый холст для рисования графиков, диаграмм, частиц, обработки фото и браузерных игр через JS.","code":"\u003ccanvas id=\"chart\" width=\"600\" height=\"300\">\u003c/canvas>\n\n\u003cscript>\n  const canvas = document.getElementById('chart');\n  const ctx = canvas.getContext('2d');\n\n  // Заливка столбика диаграммы\n  ctx.fillStyle = '#38bdf8';\n  ctx.fillRect(40, 60, 80, 200);\n\u003c/script>","example":"const dpr = window.devicePixelRatio || 1; /* Учёт Retina-экранов */","points":["Размеры холста обязательно задавай через HTML-атрибуты width и height, а не только через CSS, иначе картинка растянется и станет мыльной!","Для идеальной чёткости на Retina-экранах умножай canvas.width на window.devicePixelRatio и масштабируй контекст ctx.scale(dpr, dpr).","Для векторных иконок и кликабельных схем лучше подходит \u003csvg>, а для десятков тысяч движущихся частиц — \u003ccanvas>."],"tags":["HTML","canvas","2d","webgl","графика","холст","диаграмма","рисование"],"when":"Для графиков аналитики, редакторов изображений, генераторов баннеров и 2D/3D игр.","alternatives":"Для простых круговых и столбчатых графиков до 100 элементов проще и чётче использовать \u003csvg>.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/canvas"},{"lang":"html","id":"html-textarea","title":"HTML: многострочное текстовое поле \u003ctextarea> и автовысота","summary":"Поле для ввода комментариев, описаний и кода с контролем строк, лимитом символов и автоподстройкой высоты.","code":"\u003clabel for=\"bio\">О проекте:\u003c/label>\n\u003ctextarea\n  id=\"bio\"\n  name=\"bio\"\n  rows=\"4\"\n  maxlength=\"500\"\n  placeholder=\"Опишите задачу проекта...\"\n>\u003c/textarea>","example":"textarea {\n  field-sizing: content; /* Современный CSS: поле само растёт по мере ввода текста! */\n  min-height: 80px;\n}","points":["В отличие от \u003cinput>, у \u003ctextarea> нет атрибута value — начальный текст пишется прямо между открывающим и закрывающим тегами.","Не оставляй случайных пробелов и переносов между \u003ctextarea> и \u003c/textarea>, иначе они появятся внутри поля как введённый текст!","Новое CSS-свойство field-sizing: content (или JS: el.style.height = el.scrollHeight + \"px\") позволяет полю автоматически расти по высоте."],"tags":["HTML","textarea","rows","maxlength","field-sizing","комментарий","многострочное поле"],"when":"Для форм обратной связи, комментариев, биографии профиля и редакторов кода.","alternatives":"Для форматированного текста с жирным и списками используют атрибут contenteditable=\"true\" или редакторы ProseMirror/TipTap.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/textarea"},{"lang":"html","id":"html-audio-element","title":"HTML: аудиоплеер \u003caudio> и звуковые эффекты интерфейса","summary":"Встраивание подкастов, голосовых сообщений и программное воспроизведение аудио через HTMLAudioElement.","code":"\u003caudio controls preload=\"metadata\">\n  \u003csource src=\"/audio/episode-12.mp3\" type=\"audio/mpeg\">\n  \u003csource src=\"/audio/episode-12.ogg\" type=\"audio/ogg\">\n\u003c/audio>\n\n\u003cscript>\n  const notifySound = new Audio('/audio/ping.mp3');\n  notifySound.volume = 0.4;\n  // Вызывать только после действия пользователя (клик)\n  btn.addEventListener('click', () => notifySound.play());\n\u003c/script>","example":"audioElement.playbackRate = 1.5; /* Ускорение подкаста в 1.5 раза */","points":["Свойство audio.playbackRate = 1.5 или 2.0 позволяет легко сделать кнопку ускорения голосового сообщения или подкаста.","Браузеры блокируют вызов audio.play() без предварительного клика пользователя по странице (защита от навязчивого звука).","preload=\"metadata\" подгружает только длительность дорожки без скачивания всего MP3-файла."],"tags":["HTML","audio","mp3","play","playbackRate","аудио","плеер","подкаст","звук"],"when":"В плеерах подкастов, мессенджерах с голосовыми сообщениями и звуковых уведомлениях.","alternatives":"Для синтеза звука и эквалайзеров в реальном времени используй Web Audio API (AudioContext).","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/audio"},{"lang":"html","id":"html-script-module-importmap","title":"HTML: ES-модули \u003cscript type=\"module\"> и карты импортов (importmap)","summary":"Подключение модульного JavaScript и NPM-библиотек прямо в браузере по коротким именам без сборщика.","code":"\u003cscript type=\"importmap\">\n{\n  \"imports\": {\n    \"canvas-confetti\": \"https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/+esm\"\n  }\n}\n\u003c/script>\n\n\u003cscript type=\"module\">\n  import confetti from 'canvas-confetti';\n  confetti({ particleCount: 80, spread: 60 });\n\u003c/script>","example":"\u003cscript type=\"module\" src=\"/src/main.js\">\u003c/script>","points":["\u003cscript type=\"module\"> автоматически работает в строгом режиме (\"use strict\"), имеет собственную изолированную область видимости и выполняется отложенно (как с defer).","Тег \u003cscript type=\"importmap\"> позволяет сопоставить короткие имена пакетов с их URL на CDN или локальными путями.","Внутри модульного скрипта работает top-level await (можно писать await fetch(...) на верхнем уровне без обёртки в async function)."],"tags":["HTML","script","module","importmap","import","esm","модули","cdn"],"when":"Во всех современных проектах для чистого разделения JS-кода на файлы.","alternatives":"В продакшене для крупных проектов модули обычно собирают через Vite для объединения чанков.","url":"https://developer.mozilla.org/en-US/docs/Web/HTML/Element/script/type/importmap"},{"lang":"html","id":"html-details-exclusive-accordion","title":"HTML: связанный аккордеон \u003cdetails name=\"...\"> без JavaScript","summary":"Современный атрибут name у тега \u003cdetails>, автоматически закрывающий соседние вкладки аккордеона при открытии новой.","code":"\u003cdiv class=\"faq-group\">\n  \u003cdetails name=\"faq\" open>\n    \u003csummary>Как работает атрибут name у details?\u003c/summary>\n    \u003cp>Когда у нескольких тегов details одинаковый name, открытым может быть только один из них!\u003c/p>\n  \u003c/details>\n\n  \u003cdetails name=\"faq\">\n    \u003csummary>Нужен ли для этого JavaScript?\u003c/summary>\n    \u003cp>Нет, браузер переключает вкладки аккордеона полностью нативно.\u003c/p>\n  \u003c/details>\n\u003c/div>","example":"summary::marker { color: #38bdf8; }","points":["Добавление одинакового атрибута name=\"faq\" к группе тегов \u003cdetails> превращает их во взаимоисключающий аккордеон (как радиокнопки)!","Атрибут open задаёт вкладку, открытую по умолчанию при загрузке страницы.","Для стилизации кастомной стрелочки скройте стандартный маркер через summary { list-style: none; } и summary::-webkit-details-marker { display: none; }."],"tags":["HTML","details","summary","accordion","faq","аккордеон","спойлер"],"when":"Для блоков частых вопросов (FAQ), мобильных меню-гармошек и свернутых секций фильтров.","alternatives":"Если нужно держать открытыми сразу несколько пунктов одновременно — просто не указывай атрибут name.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/details"},{"lang":"html","id":"html-search-hgroup-hr","title":"HTML: семантический блок поиска \u003csearch>, группа заголовка \u003chgroup> и \u003chr>","summary":"Специализированный ориентир для форм поиска и фильтрации, связка заголовка с подзаголовком и тематический разделитель.","code":"\u003csearch aria-label=\"Поиск по документации\">\n  \u003cform action=\"/search\">\n    \u003cinput type=\"search\" name=\"q\" placeholder=\"Найти функцию...\">\n    \u003cbutton type=\"submit\">Найти\u003c/button>\n  \u003c/form>\n\u003c/search>\n\n\u003chgroup>\n  \u003cp class=\"kicker\">Руководство\u003c/p>\n  \u003ch1>Архитектура современных веб-приложений\u003c/h1>\n  \u003cp class=\"subtitle\">Практическое пособие для фронтенд- и бэкенд-разработчиков\u003c/p>\n\u003c/hgroup>","example":"\u003chr aria-hidden=\"true\">","points":["Тег \u003csearch> — официальный элемент стандарта HTML5, создающий доступную область (role=\"search\") для любых полей поиска и фильтров каталога.","\u003chgroup> объединяет главный заголовок \u003ch1>–\u003ch6> с надзаголовком (kicker) и подзаголовком в единую смысловую группу.","\u003chr> означает смысловую смену темы между абзацами или секциями меню."],"tags":["HTML","search","hgroup","hr","семантика","поиск","подзаголовок","разделитель"],"when":"Используй \u003csearch> вокруг поисковых строк и панелей фильтрации товаров.","alternatives":"Раньше вместо \u003csearch> приходилось писать \u003cdiv role=\"search\">.","url":"https://developer.mozilla.org/en-US/docs/Web/HTML/Element/search"},{"lang":"html","id":"html-sub-sup-del-ins","title":"HTML: индексы \u003csub>, \u003csup> и правки цен \u003cdel>, \u003cins>, \u003cs>","summary":"Разметка химических и математических формул, сносок, а также перечёркнутых старых и новых цен со скидкой.","code":"\u003c!-- Старая и новая цена в карточке товара -->\n\u003cdiv class=\"price-box\">\n  \u003cdel>\u003cspan class=\"sr-only\">Старая цена:\u003c/span> 4 990 ₽\u003c/del>\n  \u003cins>\u003cspan class=\"sr-only\">Новая цена:\u003c/span> 3 490 ₽\u003c/ins>\n\u003c/div>\n\n\u003c!-- Верхний и нижний индекс -->\n\u003cp>Площадь зала: 120 м\u003csup>2\u003c/sup> · Формула воды: H\u003csub>2\u003c/sub>O\u003c/p>","example":"ins { text-decoration: none; font-weight: 700; color: #10b981; }","points":["Для зачёркнутой старой цены в интернет-магазине используй \u003cdel> или \u003cs>, а для новой цены со скидкой — \u003cins> (сбросив подчёркивание через text-decoration: none).","\u003csup> поднимает текст в верхний индекс (м², x³, сноски [1]), а \u003csub> опускает в нижний индекс (CO₂).","В CSS задай sub, sup { line-height: 0; }, чтобы индексы не раздвигали высоту строки абзаца!"],"tags":["HTML","sub","sup","del","ins","s","скидка","старая цена","степень","индекс"],"when":"В карточках товаров со скидками, технических характеристиках (м², м³) и статьях.","alternatives":"Не используй просто \u003cspan style=\"text-decoration: line-through\"> — поисковики не поймут, что это старая цена.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/del"},{"lang":"html","id":"html-favicon-theme-links","title":"HTML: фавиконки SVG/PNG, Apple Touch Icon и Web App Manifest","summary":"Современный минимальный набор иконок сайта для вкладок браузера, тёмной темы и домашнего экрана смартфона.","code":"\u003chead>\n  \u003c!-- Векторная иконка (поддерживает адаптацию под тёмную тему внутри SVG!) -->\n  \u003clink rel=\"icon\" href=\"/icon.svg\" type=\"image/svg+xml\">\n  \u003c!-- Иконка для экрана «Домой» на iPhone и iPad (180x180) -->\n  \u003clink rel=\"apple-touch-icon\" href=\"/apple-touch-icon.png\">\n  \u003c!-- Манифест веб-приложения с иконками 192x192 и 512x512 -->\n  \u003clink rel=\"manifest\" href=\"/manifest.webmanifest\">\n\u003c/head>","example":"/* Внутри icon.svg можно написать @media (prefers-color-scheme: dark) для смены цвета! */","points":["Вместо 20 старых тегов иконок разного размера современным браузерам достаточно всего трёх ссылок: icon.svg, apple-touch-icon.png и manifest.webmanifest!","Внутрь файла icon.svg можно встроить тег \u003cstyle> с медиазапросом prefers-color-scheme: dark, чтобы фавиконка сама меняла цвет на тёмных вкладках.","Apple Touch Icon должна быть квадратной PNG без прозрачности размером 180×180 пикселей."],"tags":["HTML","favicon","icon","apple-touch-icon","manifest","pwa","иконка сайта"],"when":"В секции \u003chead> каждого веб-сайта и приложения.","alternatives":"Старый формат favicon.ico нужен только для обратной совместимости с очень старыми утилитами.","url":"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Add_a_hit_map_on_top_of_an_image"},{"lang":"css","id":"css-overflow-scrollbars","title":"CSS: управление переполнением (overflow, overflow-clip-margin, scrollbar-gutter)","summary":"Локализация горизонтального и вертикального скролла, защита от скачков ширины страницы и тонкие полосы прокрутки.","code":"html {\n  /* Резервирует место под скроллбар, чтобы страница не дёргалась при открытии модалки! */\n  scrollbar-gutter: stable;\n  scrollbar-width: thin;\n  scrollbar-color: #334155 transparent;\n}\n\n.code-block {\n  overflow-x: auto; /* Показывает скроллбар только если строка кода реально не поместилась */\n}","example":".card {\n  overflow: clip; /* Обрезает края как hidden, но не создаёт скролл-контейнер! */\n}","points":["Всегда используй overflow: auto вместо overflow: scroll, чтобы полоса прокрутки не висела пустой, когда контента мало.","Современное значение overflow: clip обрезает выступающие углы, но в отличие от overflow: hidden НЕ ломает position: sticky внутри родителя!","scrollbar-gutter: stable предотвращает неприятный горизонтальный рывок шапки и контента, когда при фильтрации или открытии модалки пропадает полоса прокрутки."],"tags":["CSS","overflow","clip","scrollbar-gutter","scrollbar-width","скроллбар","прокрутка","переполнение"],"when":"Для блоков кода, таблиц, модальных окон и корневого тега html.","alternatives":"overflow-x: hidden на body часто маскирует проблему вылезающего блока вместо её исправления.","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/scrollbar-gutter"},{"lang":"css","id":"css-z-index-isolation","title":"CSS: контекст наложения (z-index и isolation: isolate)","summary":"Предсказуемое управление слоями без магических чисел z-index: 999999 с помощью локальной изоляции компонента.","code":".hero-card {\n  position: relative;\n  isolation: isolate; /* Все z-index внутри карточки остаются заперты внутри неё! */\n}\n\n.hero-card__bg-glow {\n  position: absolute;\n  inset: 0;\n  z-index: -1; /* Уходит под текст карточки, но НЕ проваливается под фон всей страницы! */\n}","example":"/* isolation: isolate создаёт чистый контекст наложения без побочных эффектов */","points":["Главная ловушка z-index: -1 на фоновом декоре — элемент часто проваливается под фон родителя и исчезает. Свойство isolation: isolate на родителе решает это в одну строку!","z-index работает не только на позиционированных элементах (relative/absolute/fixed), но и напрямую на дочерних элементах Flexbox и CSS Grid!","Держи шкалу слоёв системной в CSS-переменных: --z-header: 50, --z-dropdown: 100, --z-modal: 200, --z-toast: 300."],"tags":["CSS","z-index","isolation","isolate","stacking context","слои","наложение"],"when":"При верстке карточек с декоративным фоном, перекрывающихся аватаров и фиксированных панелей.","alternatives":"Для модальных окон и поповеров нативные \u003cdialog> и popover автоматически выходят в #top-layer поверх любого z-index.","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/isolation"},{"lang":"css","id":"css-pointer-events-user-select","title":"CSS: управление кликами (pointer-events), выделением (user-select) и курсором","summary":"Пропускание кликов сквозь прозрачные декоративные слои и запрет случайного выделения текста на кнопках.","code":"/* Декоративное свечение поверх секции не мешает нажимать на кнопки под ним */\n.ambient-glow {\n  pointer-events: none;\n}\n\n/* Текст кнопок и табов не выделяется синим при быстром двойном клике */\n.btn, .tab, kbd {\n  user-select: none;\n}\n\n/* Весь API-ключ или команда терминала выделяется целиком одним кликом! */\n.api-token {\n  user-select: all;\n}","example":".is-loading {\n  pointer-events: none;\n  opacity: 0.6;\n}","points":["pointer-events: none делает элемент полностью «прозрачным» для мыши и пальца — клики проходят сквозь него к элементам ниже.","user-select: all позволяет пользователю выделить весь промокод, ссылку или команду одним кликом мыши.","Помни, что pointer-events: none блокирует только мышь/тач, но не блокирует переход по кнопке клавишей Tab (для полной блокировки кнопки используй атрибут disabled)."],"tags":["CSS","pointer-events","user-select","cursor","клик","выделение текста","курсор"],"when":"На декоративных оверлеях, иконках внутри кнопок, промокодах и тост-контейнерах.","alternatives":"Для полного отключения интерактивности целой секции (и мыши, и клавиатуры) используй HTML-атрибут inert.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/pointer-events"},{"lang":"css","id":"css-backgrounds-patterns","title":"CSS: фоновые изображения, сетки и паттерны (background-size, position, repeat)","summary":"Наложение нескольких фонов и создание технических точечных и клеточных сеток на чистом CSS без картинок.","code":"/* Техническая сетка из точек (dot matrix) на чистом CSS */\n.canvas-dots {\n  background-color: #090d14;\n  background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);\n  background-size: 20px 20px;\n}\n\n/* Техническая миллиметровая клетка (grid lines) */\n.canvas-grid {\n  background-size: 32px 32px;\n  background-image:\n    linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),\n    linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);\n}","example":"background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('hero.jpg') center / cover no-repeat;","points":["В свойстве background можно перечислить несколько слоёв через запятую (первый в списке лежит выше всех). Например, полупрозрачный градиент поверх фото для читаемости белого текста!","Точечные и линейные паттерны через radial-gradient / linear-gradient + background-size: 24px 24px весят 0 байт и идеально чёткие на любых экранах.","В сокращённой записи размер пишется через слэш после позиции: center / cover no-repeat."],"tags":["CSS","background","background-size","background-image","cover","паттерн","сетка","фон"],"when":"Для фонов рабочих холстов, технических лендингов и затемнения обложек под текстом.","alternatives":"Для контентных изображений, важных для SEO и доступности, используй тег \u003cimg> с object-fit: cover.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/background"},{"lang":"css","id":"css-borders-outline","title":"CSS: границы (border, border-radius) и контур фокуса (outline, outline-offset)","summary":"Геометрия скруглений вложенных карточек, отличие outline от border и аккуратные разделители.","code":".outer-card {\n  --inner-radius: 8px;\n  --card-padding: 8px;\n  padding: var(--card-padding);\n  /* Формула идеального концентрического скругления: внутренний радиус + отступ! */\n  border-radius: calc(var(--inner-radius) + var(--card-padding));\n}\n\n.inner-image {\n  border-radius: var(--inner-radius);\n}\n\n.btn:focus-visible {\n  outline: 2px solid #38bdf8;\n  outline-offset: 2px;\n}","example":"border-radius: 9999px; /* Идеальная капсула любой высоты */","points":["Чтобы скругление вложенной картинки и внешней карточки выглядело гармонично (концентрически), внешний радиус должен быть равен внутреннему радиусу плюс padding карточки!","В отличие от border, свойство outline не занимает места в блочной модели (элемент не прыгает при появлении рамки) и поддерживает отступ outline-offset.","border-radius: 50% превращает квадратный блок в круг, а border-radius: 9999px создаёт ровную капсулу на прямоугольнике."],"tags":["CSS","border","border-radius","outline","outline-offset","рамка","скругление"],"when":"При проектировании карточек, кнопок, инпутов и состояний фокуса.","alternatives":"Для градиентной рамки со скруглением используют двойной background с padding-box и border-box.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/border-radius"},{"lang":"css","id":"css-media-preference-queries","title":"CSS: медиазапросы возможностей (@media hover, prefers-reduced-motion, print)","summary":"Адаптация интерфейса под тач-экраны без залипающих ховеров, бережное отношение к вестибулярному аппарату и печать.","code":"/* Ховер-эффекты применяются только на устройствах с реальным курсором мыши */\n@media (hover: hover) and (pointer: fine) {\n  .card:hover {\n    border-color: var(--accent);\n    transform: translateY(-2px);\n  }\n}\n\n/* Отключение резких движений, если в ОС включено «Уменьшение движения» */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    transition-duration: 0.01ms !important;\n    scroll-behavior: auto !important;\n  }\n}","example":"@media (width >= 768px) { /* Современный синтаксис диапазонов Media Queries Level 4 */ }","points":["На смартфонах обычный :hover «залипает» после тапа пальцем. Оборачивание ховеров в @media (hover: hover) делает мобильный интерфейс чистым.","В современном CSS вместо min-width: 768px можно писать наглядные математические неравенства: @media (width >= 768px) или @media (480px \u003c= width \u003c 1024px)!","Правило @media print позволяет скрыть шапку, сайдбар и кнопки при сохранении страницы или счёта в PDF."],"tags":["CSS","media","hover","pointer","prefers-reduced-motion","print","адаптивность","медиазапросы"],"when":"В каждом продакшен-проекте для корректной работы на смартфонах, десктопах и при печати.","alternatives":"Для адаптации карточки под ширину конкретной колонки используй @container вместо @media.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/CSS_media_queries/Using_media_queries"},{"lang":"css","id":"css-font-face-loading","title":"CSS: подключение шрифтов (@font-face, font-display: swap, variable fonts)","summary":"Правильная загрузка локальных шрифтов WOFF2 без блокировки текста и с сохранением метрик запасного шрифта.","code":"@font-face {\n  font-family: 'InterVariable';\n  src: url('/fonts/Inter-Variable.woff2') format('woff2');\n  font-weight: 100 900;  /* Один вариативный файл покрывает все начертания от Thin до Black! */\n  font-style: normal;\n  font-display: swap;    /* Сразу показывает текст системным шрифтом до загрузки файла */\n}\n\nbody {\n  font-family: 'InterVariable', system-ui, -apple-system, sans-serif;\n}","example":"font-feature-settings: \"cv02\", \"cv03\", \"cv04\"; /* Включение альтернативных глифов в шрифте */","points":["Сегодня достаточно одного формата woff2 — он поддерживается 99% браузеров и сжимает шрифт на 30% лучше старого woff/ttf.","font-display: swap гарантирует, что пользователь сразу увидит текст страницы, даже при медленном мобильном интернете.","Вариативный шрифт (Variable Font) заменяет собой 5–6 отдельных файлов (Regular, Medium, SemiBold, Bold), ускоряя загрузку сайта."],"tags":["CSS","font-face","woff2","font-display","swap","variable fonts","шрифты","типографика"],"when":"При подключении фирменных шрифтов проекта.","alternatives":"Системный стек system-ui, -apple-system, Segoe UI, Roboto работает мгновенно вообще без скачивания файлов.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/@font-face"},{"lang":"css","id":"css-columns-masonry","title":"CSS: многоколоночная верстка (columns, column-gap, break-inside: avoid)","summary":"Газетная раскладка текста и плиточная сетка карточек разной высоты (Masonry-эффект) на чистом CSS.","code":".masonry-gallery {\n  columns: 3 280px; /* До 3 колонок шириной минимум 280px */\n  column-gap: 16px;\n}\n\n.masonry-card {\n  break-inside: avoid; /* Запрещает разрывать карточку пополам между колонками! */\n  margin-bottom: 16px;\n}","example":"column-rule: 1px solid var(--line); /* Тонкая вертикальная линия между текстовыми колонками */","points":["Свойство columns: 3 280px автоматически уменьшает число колонок с 3 до 2 и 1 на узких экранах без единого медиазапроса.","Обязательно добавляй break-inside: avoid дочерним карточкам, иначе браузер разрежет карточку пополам при переходе в следующий столбец!","Учитывай, что элементы в columns идут сверху вниз по столбцам, а не слева направо по строкам."],"tags":["CSS","columns","column-count","break-inside","masonry","колонки","галерея","плитка"],"when":"Для фотогалерей с картинками разной высоты, облака отзывов и длинных списков ссылок в подвале.","alternatives":"Если важен строгий порядок карточек слева направо (по дате или цене), используй CSS Grid.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/columns"},{"lang":"css","id":"css-counters","title":"CSS: автоматическая нумерация секций и шагов (counter-reset, counter-increment)","summary":"Генерация красивых номеров глав (01, 02, 1.1) и шагов инструкции чисто средствами CSS без хардкода цифр в HTML.","code":".steps-list {\n  counter-reset: step-counter;\n  list-style: none;\n  padding: 0;\n}\n\n.steps-list li {\n  counter-increment: step-counter;\n}\n\n.steps-list li::before {\n  /* Выводит \"01\", \"02\", \"03\" с ведущим нулём! */\n  content: counter(step-counter, decimal-leading-zero);\n  font-family: monospace;\n  color: #38bdf8;\n  margin-right: 10px;\n}","example":"content: counters(section, \".\") \" \"; /* Для вложенной нумерации 1.1, 1.2, 2.1 */","points":["counter-reset инициализирует счётчик на родителе, counter-increment увеличивает его на каждом элементе, а counter() выводит значение в ::before.","Второй параметр decimal-leading-zero автоматически форматирует числа меньше 10 с ведущим нулём (01, 02, 03).","При удалении или перестановке шагов в HTML вся нумерация пересчитывается автоматически."],"tags":["CSS","counter-reset","counter-increment","counter","нумерация","счётчик","шаги"],"when":"Для оформления пошаговых гайдов, оглавлений документации и нумерации строк кода.","alternatives":"Для простых списков без префиксов \"01\" достаточно стилизовать нативный \u003col> через li::marker.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/CSS_counter_styles/Using_CSS_counters"},{"lang":"javascript","id":"js-array-slice-splice-at","title":"JS: выборка с конца (.at(-1)) и иммутабельное изменение (toSpliced, with, slice)","summary":"Удобное получение последнего элемента массива и новые методы точечной замены и удаления без мутации исходных данных.","code":"const items = ['HTML', 'CSS', 'JS', 'PHP'];\n\n// Получение последнего и предпоследнего элемента через отрицательный индекс!\nconst last = items.at(-1);       // 'PHP'\nconst secondLast = items.at(-2); // 'JS'\n\n// Немутирующая замена элемента по индексу (возвращает новый массив)\nconst updated = items.with(2, 'TypeScript'); // ['HTML', 'CSS', 'TypeScript', 'PHP']\n\n// Немутирующее удаление и вставка (вместо старого мутирующего splice)\nconst withoutFirst = items.toSpliced(0, 1);","example":"const pageItems = items.slice(0, 10); /* Копия первых 10 элементов */","points":["Метод arr.at(-1) гораздо чище и короче старой записи arr[arr.length - 1], а также работает и со строками: str.at(-1)!","Классические методы .splice() и .reverse() ломают исходный массив. Их современные близнецы .toSpliced() и .toReversed() возвращают новую копию.","Метод arr.with(index, value) идеально подходит для обновления одного элемента массива в стейте приложения."],"tags":["JavaScript","at","slice","splice","toSpliced","toReversed","with","массивы","последний элемент"],"when":"При пагинации (slice), чтении последнего элемента очереди (at(-1)) и обновлении списков в UI.","alternatives":"Используй мутирующий .splice() только когда сознательно работаешь с локальным временным массивом.","url":"https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/Array/at"},{"lang":"javascript","id":"js-math-random-crypto","title":"JS: математика (Math.round, clamp), случайные числа и генерация UUID (crypto.randomUUID)","summary":"Округление, генерация случайных целых чисел в диапазоне и создание криптостойких уникальных ID без библиотек.","code":"// Встроенная в браузер и Node.js генерация уникального UUID v4!\nconst id = crypto.randomUUID(); // \"36b8f84d-df4e-4d49-b662-bcde71a8764f\"\n\n// Случайное целое число от min до max включительно\nconst randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;\n\n// Ограничение числа заданным диапазоном [min, max] (аналог CSS clamp)\nconst clamp = (val, min, max) => Math.min(Math.max(val, min), max);\nconst volume = clamp(120, 0, 100); // 100","example":"const price = Number((19.99 * 3).toFixed(2)); /* Округление до 2 знаков после запятой */","points":["Нативный метод crypto.randomUUID() мгновенно генерирует стандартный 36-символьный UUID v4 — сторонний npm-пакет uuid больше не нужен!","При работе с деньгами в JS избегай ошибок плавающей точки (0.1 + 0.2 === 0.30000000000000004): веди расчёты в копейках (целых числах) или округляй через Math.round(val * 100) / 100.","Формула Math.min(Math.max(val, min), max) незаменима для ползунков, зума и координат перетаскивания."],"tags":["JavaScript","Math","random","randomUUID","crypto","round","floor","clamp","uuid","числа"],"when":"При создании временных ID для новых задач/карточек, написании калькуляторов и игр.","alternatives":"Для токенов безопасности используй crypto.getRandomValues() вместо предсказуемого Math.random().","url":"https://developer.mozilla.org/ru/docs/Web/API/Crypto/randomUUID"},{"lang":"javascript","id":"js-geometry-scroll","title":"JS: координаты элементов (getBoundingClientRect) и плавный скролл (scrollIntoView)","summary":"Точное измерение размеров и положения блока относительно окна и прокрутка страницы к нужному элементу.","code":"const targetSection = document.getElementById('pricing');\n\n// Плавная прокрутка страницы к элементу по центру или по верхнему краю\ntargetSection.scrollIntoView({\n  behavior: 'smooth',\n  block: 'start'\n});\n\n// Точные координаты и размеры элемента относительно видимой области окна (viewport)\nconst rect = button.getBoundingClientRect();\nconsole.log(rect.top, rect.left, rect.width, rect.height);","example":"window.scrollTo({ top: 0, behavior: 'smooth' }); /* Кнопка «Наверх» */","points":["element.scrollIntoView({ behavior: \"smooth\", block: \"nearest\" }) аккуратно прокручивает список так, чтобы выбранный с клавиатуры пункт стал виден.","getBoundingClientRect() возвращает дробные субпиксельные значения относительно окна браузера (viewport). Чтобы получить координату от самого верха документа, прибавь window.scrollY.","Учитывай, что частый вызов getBoundingClientRect() в цикле заставляет браузер синхронно пересчитывать лейаут (forced reflow)."],"tags":["JavaScript","getBoundingClientRect","scrollIntoView","scrollTo","координаты","размеры","прокрутка"],"when":"Для позиционирования выпадающих тултипов рядом с кнопкой, кнопки «Наверх» и навигации по списку.","alternatives":"Для отслеживания изменения размеров блока во времени используй ResizeObserver.","url":"https://developer.mozilla.org/ru/docs/Web/API/Element/scrollIntoView"},{"lang":"javascript","id":"js-resize-mutation-observer","title":"JS: отслеживание размеров блока (ResizeObserver) и изменений DOM (MutationObserver)","summary":"Реакция графиков и холстов на изменение ширины их родительской колонки (а не только всего окна браузера).","code":"const chartBox = document.querySelector('.chart-container');\n\n// Срабатывает при любом изменении размера самого блока (например, при сворачивании сайдбара!)\nconst ro = new ResizeObserver((entries) => {\n  for (const entry of entries) {\n    const { width, height } = entry.contentRect;\n    resizeCanvas(width, height);\n  }\n});\n\nro.observe(chartBox);","example":"ro.disconnect(); /* Остановка наблюдения при удалении компонента */","points":["Событие window.onresize не срабатывает, когда блок меняет ширину из-за закрытия боковой панели или переключения флекс-колонки. ResizeObserver видит любое изменение размера самого элемента!","Идеально подходит для перерисовки \u003ccanvas>, графиков и адаптивных таблиц.","MutationObserver используется, когда нужно отследить изменение атрибутов или добавление новых узлов сторонним скриптом."],"tags":["JavaScript","ResizeObserver","MutationObserver","resize","размер","адаптивность","canvas"],"when":"При разработке графиков, интерактивных генераторов, сплит-панелей и редакторов.","alternatives":"Если нужно менять только CSS-стили при изменении ширины родителя, используй CSS @container queries.","url":"https://developer.mozilla.org/ru/docs/Web/API/ResizeObserver"},{"lang":"javascript","id":"js-custom-events-error","title":"JS: собственные события (CustomEvent) и обработка ошибок (try / catch / finally)","summary":"Слабосвязанный обмен сообщениями между независимыми модулями интерфейса и надёжный перехват исключений.","code":"// 1. Отправка кастомного события с данными в объекте detail\nwindow.dispatchEvent(new CustomEvent('cart:updated', {\n  detail: { count: 4, totalPrice: 5200 }\n}));\n\n// 2. Подписка в любом другом месте приложения (например, в шапке)\nwindow.addEventListener('cart:updated', (e) => {\n  cartBadge.textContent = e.detail.count;\n});","example":"try {\n  await saveData();\n} catch (err) {\n  showError(err.message);\n} finally {\n  spinner.hidden = true; /* Выполнится в любом случае! */\n}","points":["Блок finally внутри try/catch гарантированно выполняется и после успеха, и после ошибки — это лучшее место для выключения индикатора загрузки (isLoading = false).","При пробросе собственной ошибки можно сохранить исходную причину через new Error(\"Не удалось загрузить профиль\", { cause: originalErr }).","CustomEvent позволяет развязать модули (например, каталог и шапку с корзиной) без жёстких прямых импортов."],"tags":["JavaScript","CustomEvent","dispatchEvent","try","catch","finally","Error","события","ошибки"],"when":"Для связи компонентов на чистом JS и безопасного выполнения сетевых операций.","alternatives":"Для синхронизации данных между РАЗНЫМИ открытыми вкладками одного сайта используй new BroadcastChannel(\"app_sync\").","url":"https://developer.mozilla.org/ru/docs/Web/API/CustomEvent"},{"lang":"javascript","id":"js-web-animations-api","title":"JS: программные анимации через Web Animations API (element.animate)","summary":"Нативный запуск плавных CSS-подобных анимаций напрямую из JavaScript с поддержкой промиса окончания (.finished).","code":"async function flashHighlight(element) {\n  const animation = element.animate(\n    [\n      { transform: 'scale(0.96)', backgroundColor: 'rgba(56, 189, 248, 0.25)' },\n      { transform: 'scale(1)',    backgroundColor: 'transparent' }\n    ],\n    {\n      duration: 450,\n      easing: 'cubic-bezier(0.22, 1, 0.36, 1)'\n    }\n  );\n\n  // Можно дождаться завершения анимации через await!\n  await animation.finished;\n}","example":"await modal.animate([{ opacity: 1 }, { opacity: 0 }], 200).finished;\nmodal.close();","points":["Метод element.animate(keyframes, options) работает на том же быстром движке браузера, что и CSS @keyframes, но позволяет передавать динамические координаты из JS!","Свойство animation.finished возвращает Promise — можно легко дождаться конца анимации закрытия и только потом удалить элемент из DOM.","Не требует подключения сторонних библиотек вроде GSAP или Anime.js для большинства интерфейсных задач."],"tags":["JavaScript","animate","Web Animations API","WAAPI","анимация","finished","keyframes"],"when":"Когда нужно плавно скрыть элемент перед удалением из DOM или анимировать полёт товара в корзину.","alternatives":"Для простых статических ховеров используй обычный CSS transition.","url":"https://developer.mozilla.org/ru/docs/Web/API/Element/animate"},{"lang":"html","id":"html-main-element","title":"HTML: главный контент страницы \u003cmain>","summary":"Семантический контейнер для уникального содержимого текущей страницы (без сквозной шапки, меню и подвала).","code":"\u003cbody>\n  \u003cheader>Шапка сайта\u003c/header>\n  \u003cmain id=\"main-content\">\n    \u003ch1>Каталог ноутбуков\u003c/h1>\n    \u003cp>Основное содержимое страницы...\u003c/p>\n  \u003c/main>\n  \u003cfooter>Подвал сайта\u003c/footer>\n\u003c/body>","example":"\u003ca href=\"#main-content\" class=\"skip-link\">Перейти к контенту\u003c/a>","points":["На странице должен быть только один видимый элемент \u003cmain> (допускается больше только если остальные скрыты атрибутом hidden).","Не вкладывай \u003cmain> внутрь \u003carticle>, \u003caside>, \u003cfooter>, \u003cheader> или \u003cnav>.","Добавь id=\"main-content\" на \u003cmain>, чтобы пользователи с клавиатурой могли сразу перепрыгнуть навигацию."],"tags":["HTML","main","семантика","контент","skip-link","каркас"],"when":"На каждой веб-странице вокруг центральной рабочей области.","alternatives":"Устаревший \u003cdiv id=\"main\" role=\"main\"> полностью заменён нативным тегом \u003cmain>.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/main"},{"lang":"html","id":"html-nav-breadcrumbs","title":"HTML: навигация \u003cnav> и разметка «хлебных крошек» (Breadcrumbs)","summary":"Доступная разметка главного меню, оглавления статьи и цепочки навигации с атрибутом aria-current=\"page\".","code":"\u003cnav aria-label=\"Хлебные крошки\">\n  \u003col class=\"breadcrumbs\">\n    \u003cli>\u003ca href=\"/\">Главная\u003c/a>\u003c/li>\n    \u003cli>\u003ca href=\"/docs\">Справочник\u003c/a>\u003c/li>\n    \u003cli>\u003cspan aria-current=\"page\">CSS Grid\u003c/span>\u003c/li>\n  \u003c/ol>\n\u003c/nav>","example":"[aria-current=\"page\"] {\n  color: var(--accent);\n  font-weight: 600;\n}","points":["Если на странице несколько блоков \u003cnav> (в шапке, в сайдбаре и хлебные крошки), обязательно дай каждому понятный aria-label!","Для хлебных крошек используй нумерованный список \u003col>, так как порядок уровней вложенности здесь важен.","Атрибут aria-current=\"page\" на активном пункте меню сообщает скринридеру, что пользователь уже находится на этой странице."],"tags":["HTML","nav","breadcrumbs","aria-current","хлебные крошки","меню","навигация"],"when":"Для главного меню сайта, бокового оглавления документации, пагинации и хлебных крошек.","alternatives":"Обычный блок ссылок в футере (политика, соцсети) не обязательно оборачивать в \u003cnav>, достаточно \u003cfooter>.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/nav"},{"lang":"html","id":"html-article-section-aside","title":"HTML: разница между \u003carticle>, \u003csection> и \u003caside>","summary":"Чёткое правило выбора между независимой карточкой (\u003carticle>), тематической главой (\u003csection>) и боковым блоком (\u003caside>).","code":"\u003csection aria-labelledby=\"news-heading\">\n  \u003ch2 id=\"news-heading\">Последние статьи\u003c/h2>\n\n  \u003carticle class=\"post-card\">\n    \u003ch3>Обзор PHP 8.3\u003c/h3>\n    \u003cp>Что нового появилось в типизации классов и JSON...\u003c/p>\n  \u003c/article>\n\u003c/section>\n\n\u003caside aria-label=\"Рекламный блок\">\n  \u003cp>Подпишитесь на наш Telegram-канал\u003c/p>\n\u003c/aside>","example":"/* Правило: если блок можно вырвать со страницы и отправить в RSS без потери смысла — это \u003carticle>! */","points":["Используй \u003carticle> для самодостаточной единицы контента: карточка товара, пост в блоге, виджет погоды, комментарий пользователя.","Используй \u003csection> для логического раздела страницы со своим заголовком \u003ch2> (например: «Преимущества», «Отзывы», «Тарифы»).","Если контейнер нужен исключительно для CSS-сетки или флекса и не несёт смысловой роли — используй обычный \u003cdiv>!"],"tags":["HTML","article","section","aside","div","семантика","разница","карточка"],"when":"При проектировании структуры лендингов, магазинов, новостных порталов и документации.","alternatives":"Не заменяй каждый \u003cdiv> на \u003csection> — пустые секции без заголовков только засоряют дерево доступности.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/article"},{"lang":"html","id":"html-label-for","title":"HTML: подпись поля формы \u003clabel> и увеличение кликабельной зоны","summary":"Связывание текстовой метки с полем ввода для удобства нажатия пальцем и обязательной доступности форм.","code":"\u003c!-- Способ 1: вложенный инпут (не требует придумывать уникальный id!) -->\n\u003clabel class=\"field\">\n  \u003cspan>Электронная почта\u003c/span>\n  \u003cinput type=\"email\" name=\"email\" required>\n\u003c/label>\n\n\u003c!-- Способ 2: связь через атрибуты for и id -->\n\u003cdiv class=\"checkbox-row\">\n  \u003cinput type=\"checkbox\" id=\"agree-terms\" name=\"agree\" required>\n  \u003clabel for=\"agree-terms\">Согласен с условиями оферты\u003c/label>\n\u003c/div>","example":"label { cursor: pointer; }","points":["Клик по тексту \u003clabel> автоматически ставит курсор в связанное текстовое поле или переключает галочку чекбокса/радиокнопки!","Никогда не используй placeholder вместо \u003clabel>: как только пользователь начнёт печатать, подсказка исчезнет, и он забудет, что требовалось ввести.","Вкладывание \u003cinput> прямо внутрь \u003clabel> избавляет от необходимости генерировать десятки уникальных id."],"tags":["HTML","label","for","input","форма","подпись","доступность","чекбокс"],"when":"Для абсолютно каждого поля ввода, чекбокса, радиокнопки и выпадающего списка \u003cselect>.","alternatives":"Если у поля поиска в шапке нет видимой текстовой подписи, добавь инпуту aria-label=\"Поиск по сайту\".","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/label"},{"lang":"html","id":"html-optgroup-multiple","title":"HTML: атрибуты форм (autocomplete, autofocus, readonly vs disabled)","summary":"Тонкое управление поведением полей формы: автозаполнение карт и адресов, отличие readonly от disabled.","code":"\u003cform>\n  \u003c!-- Включает автозаполнение имени и адреса из профиля браузера -->\n  \u003cinput type=\"text\" name=\"name\" autocomplete=\"name\">\n  \u003cinput type=\"password\" name=\"new_pass\" autocomplete=\"new-password\">\n\n  \u003c!-- readonly: нельзя редактировать, НО значение ОТПРАВЛЯЕТСЯ на сервер и копируется! -->\n  \u003cinput type=\"text\" name=\"promo\" value=\"DEVSHELF2026\" readonly>\n\n  \u003c!-- disabled: поле полностью выключено и НЕ отправляется в $_POST / FormData! -->\n  \u003cinput type=\"text\" name=\"legacy_id\" value=\"104\" disabled>\n\u003c/form>","example":"\u003cinput type=\"search\" autofocus>","points":["Ключевая разница: поле с readonly можно выделить мышью, скопировать, и его значение уходит на сервер при отправке формы. Поле с disabled полностью игнорируется при отправке формы!","Правильные значения autocomplete (\"username\", \"current-password\", \"new-password\", \"cc-number\", \"tel\") позволяют менеджеру паролей заполнить форму в один тап.","Атрибут autofocus автоматически ставит курсор в поле при открытии страницы или модального окна \u003cdialog>."],"tags":["HTML","readonly","disabled","autocomplete","autofocus","form","атрибуты форм"],"when":"В формах входа, регистрации, оформления заказа и полях с промокодами/реферальными ссылками.","alternatives":"Если нужно передать служебный ID на сервер вообще без показа поля пользователю, используй \u003cinput type=\"hidden\">.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Attributes/autocomplete"},{"lang":"html","id":"html-iframe-lazy-loading","title":"HTML: оптимизация изображений (loading=\"lazy\", decoding=\"async\", fetchpriority=\"high\")","summary":"Ускорение загрузки первого экрана (LCP) за счёт приоритета главного баннера и ленивой подгрузки остальных фото.","code":"\u003c!-- Главный баннер на первом экране (LCP): грузим с максимальным приоритетом! -->\n\u003cimg\n  src=\"/img/hero-dashboard.webp\"\n  alt=\"Интерфейс панели управления\"\n  width=\"1200\"\n  height=\"675\"\n  fetchpriority=\"high\"\n>\n\n\u003c!-- Картинки ниже первого экрана: грузим лениво по мере скролла -->\n\u003cimg\n  src=\"/img/card-1.webp\"\n  alt=\"Превью шаблона\"\n  width=\"400\"\n  height=\"300\"\n  loading=\"lazy\"\n  decoding=\"async\"\n>","example":"/* Всегда указывай атрибуты width и height, чтобы страница не прыгала при загрузке фото (CLS = 0) */","points":["Золотое правило производительности: главному изображению на первом экране ставь fetchpriority=\"high\" (и НЕ ставь loading=\"lazy\"), а всем картинкам ниже первого экрана — loading=\"lazy\"!","Явное указание атрибутов width и height позволяет браузеру заранее зарезервировать пропорции места до скачивания картинки, избавляя от скачков контента (Cumulative Layout Shift).","decoding=\"async\" разрешает браузеру декодировать сжатый растр в фоновом потоке без фризов скролла."],"tags":["HTML","img","loading","lazy","fetchpriority","decoding","lcp","cls","оптимизация картинок"],"when":"На всех изображениях лендингов, карточек товаров и статей.","alternatives":"Старые JS-скрипты ленивой загрузки через data-src больше не нужны в современных браузерах.","url":"https://developer.mozilla.org/en-US/docs/Web/API/HTMLImageElement/fetchPriority"},{"lang":"css","id":"css-gap-property","title":"CSS: отступы между элементами сетки (gap, row-gap, column-gap)","summary":"Единое свойство внутренних промежутков между карточками для CSS Grid, Flexbox и многоколоночной верстки.","code":".cards-container {\n  display: flex;\n  flex-wrap: wrap;\n  /* 24px между рядами по вертикали, 16px между карточками по горизонтали */\n  gap: 24px 16px;\n}\n\n.toolbar {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n}","example":"row-gap: 20px;\ncolumn-gap: 12px;","points":["Свойство gap создаёт отступы ТОЛЬКО между соседними элементами, не добавляя лишних отступов по внешним краям контейнера!","Если задано одно значение (gap: 16px), оно применяется и по вертикали, и по горизонтали. Если два (gap: 24px 12px) — сначала row-gap, затем column-gap.","В Flexbox при использовании режимов распределения свободного места (justify-content: space-between, space-around, space-evenly) расстояние между элементами вычисляется автоматически из ширины контейнера, поэтому фиксированный gap используется с start/center/end."],"tags":["CSS","gap","row-gap","column-gap","flex","grid","отступы","сетка"],"when":"В любых флекс- и грид-контейнерах вместо старых отрицательных margin и :not(:last-child).","alternatives":"В обычном блочном потоке (display: block) свойство gap не работает — там используют margin-bottom.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/gap"},{"lang":"css","id":"css-place-items-centering","title":"CSS: мгновенное центрирование блока (place-items: center и place-content)","summary":"Самый короткий способ отцентрировать элемент по вертикали и горизонтали в две строчки через CSS Grid.","code":".center-box {\n  display: grid;
