етаскивания ползунка, а событие change — только когда пользователь отпустил палец."],"tags":["HTML","range","number","step","min","max","output","ползунок","калькулятор"],"when":"В визуальных генераторах CSS, фильтрах цены, калькуляторах доставки и настройках звука.","alternatives":"Для выбора диапазона «от и до» двумя бегунками используют два наложенных друг на друга \u003cinput type=\"range\">.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Element/input/range"},{"lang":"html","id":"html-svg-sprite-use","title":"HTML & SVG: векторный спрайт иконок (\u003csvg>\u003cuse href=\"#icon-id\">)\u003c/use>","summary":"Переиспользование одних и тех же SVG-иконок на странице без дублирования громоздких координат \u003cpath>.","code":"\u003c!-- 1. Скрытый набор символов один раз в начале страницы (или во внешнем sprite.svg) -->\n\u003csvg hidden aria-hidden=\"true\">\n  \u003csymbol id=\"icon-check\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n    \u003cpolyline points=\"20 6 9 17 4 12\">\u003c/polyline>\n  \u003c/symbol>\n\u003c/svg>\n\n\u003c!-- 2. Компактная вставка иконки в любом месте с поддержкой currentColor -->\n\u003csvg width=\"18\" height=\"18\" aria-hidden=\"true\">\n  \u003cuse href=\"#icon-check\">\u003c/use>\n\u003c/svg>","example":"\u003csvg width=\"20\" height=\"20\">\u003cuse href=\"/assets/icons.svg#search\">\u003c/use>\u003c/svg>","points":["Если одна и та же иконка (галочка, звезда, корзина) повторяется в 50 карточках каталога, вынеси её в \u003csymbol id=\"...\"> и вызывай через \u003cuse href=\"#...\"> — HTML-код страницы станет легче в разы!","Используй современный атрибут href=\"#id\" вместо устаревшего xlink:href=\"#id\".","Внутри \u003csymbol> обязательно задавай stroke=\"currentColor\" или fill=\"currentColor\", чтобы каждый экземпляр \u003cuse> можно было красить своим CSS-цветом."],"tags":["HTML","SVG","symbol","use","sprite","спрайт","иконки","оптимизация"],"when":"В каталогах товаров, таблицах и панелях инструментов с повторяющимися иконками.","alternatives":"Для одиночных уникальных иллюстраций проще вставить инлайновый \u003csvg> напрямую.","url":"https://developer.mozilla.org/ru/docs/Web/SVG/Element/use"},{"lang":"css","id":"css-visibility-opacity-display","title":"CSS: разница между display: none, visibility: hidden, opacity: 0 и content-visibility","summary":"Шпаргалка по 4 способам скрытия элемента: влияние на поток документа, клики мышью, скринридеры и анимацию.","code":"/* 1. Полное удаление из верстки и дерева доступности (нельзя анимировать плавно без allow-discrete) */\n.is-removed { display: none; }\n\n/* 2. Место в сетке сохраняется, но элемент невидим и НЕ кликабелен */\n.is-invisible { visibility: hidden; }\n\n/* 3. Прозрачен, но ОСТАЁТСЯ кликабельным! Всегда комбинируй с pointer-events: none */\n.is-faded {\n  opacity: 0;\n  pointer-events: none;\n}","example":".dropdown {\n  opacity: 0;\n  visibility: hidden;\n  transition: opacity 200ms, visibility 200ms;\n}","points":["Главная ошибка новичков: скрыть выпадающее меню или попап только через opacity: 0! Невидимое меню продолжит перехватывать все клики мышью по кнопкам под ним. Обязательно добавляй visibility: hidden или pointer-events: none!","Связка opacity: 0 + visibility: hidden идеально анимируется через transition: элемент плавно растворяется и после этого перестаёт реагировать на мышь и клавишу Tab.","display: none полностью освобождает занимаемое блоком место в потоке."],"tags":["CSS","display none","visibility hidden","opacity","скрыть элемент","разница","анимация"],"when":"При реализации выпадающих меню, тултипов, модальных окон и табов.","alternatives":"Для скрытия текста только от глаз с сохранением для скринридера используй паттерн .sr-only.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/visibility"},{"lang":"css","id":"css-writing-mode-text-orientation","title":"CSS: вертикальный текст (writing-mode: vertical-rl) и поворот подписей","summary":"Оформление вертикальных боковых подписей секций, корешков книг и заголовков узких столбцов таблицы.","code":".side-label {\n  writing-mode: vertical-rl;\n  text-orientation: mixed;\n  transform: rotate(180deg); /* Чтобы текст читался снизу вверх */\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n}","example":"writing-mode: horizontal-tb; /* Стандартный горизонтальный режим по умолчанию */","points":["В отличие от transform: rotate(-90deg), свойство writing-mode: vertical-rl честно меняет блочную модель: ширина блока становится узкой по высоте букв, и соседние элементы аккуратно прижимаются к нему!","Добавление transform: rotate(180deg) к vertical-rl разворачивает строку так, чтобы она читалась снизу вверх (привычно для европейских корешков и боковых лейблов).","Очень удобно для узких заголовков столбцов таблицы с чекбоксами или датами."],"tags":["CSS","writing-mode","vertical-rl","text-orientation","вертикальный текст","типографика"],"when":"Для декоративных боковых индикаторов секций, билетов, бейджей и компактных таблиц.","alternatives":"Поворот через rotate(-90deg) оставляет вокруг элемента старую широкую горизонтальную коробку.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/writing-mode"},{"lang":"css","id":"css-scroll-margin-padding","title":"CSS: отступ при прокрутке к якорю (scroll-margin-top под фиксированную шапку)","summary":"Изящное решение проблемы, когда при клике по оглавлению заголовок секции прячется под фиксированным навбаром.","code":"/* Задаём всем заголовкам с id запас сверху, равный высоте шапки (56px) + 20px воздуха! */\nh2[id],\nh3[id],\nsection[id] {\n  scroll-margin-top: 76px;\n}","example":"html {\n  scroll-behavior: smooth;\n}","points":["Когда на сайте есть sticky или fixed шапка высотой 56px, переход по ссылке \u003ca href=\"#faq\"> прижимает заголовок #faq к самому верху окна — прямо ПОД шапку!","Одно свойство scroll-margin-top: 76px на целевых секциях заставляет браузер останавливать прокрутку ровно на 76px выше заголовка.","Работает как при клике по якорной ссылке #hash, так и при вызове element.scrollIntoView() из JavaScript!"],"tags":["CSS","scroll-margin-top","scroll-padding-top","anchor","sticky","якорь","оглавление","шапка"],"when":"На всех страницах с фиксированной шапкой и якорной навигацией (лендинги, документация, статьи).","alternatives":"Раньше для этого городили невидимые псевдоэлементы ::before с отрицательным margin-top.","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/scroll-margin-top"},{"lang":"css","id":"css-inset-center-absolute","title":"CSS: центрирование абсолютного/фиксированного блока через inset: 0 и margin: auto","summary":"Современный способ центрирования модалки или иконки с известными размерами без сдвига translate(-50%, -50%).","code":".floating-dialog {\n  position: fixed;\n  inset: 0;              /* Растягивает привязку ко всем 4 краям экрана (top/right/bottom/left: 0) */\n  width: min(480px, 92vw);\n  height: fit-content;   /* Высота подстраивается под контент внутри! */\n  margin: auto;          /* Браузер сам центрирует блок по вертикали и горизонтали! */\n}","example":".badge-center {\n  position: absolute;\n  inset-inline: 0;\n  margin-inline: auto;\n  width: max-content;\n}","points":["Благодаря поддержке height: fit-content и width: fit-content теперь можно центрировать абсолютный или фиксированный блок через inset: 0; margin: auto; даже не зная его точной высоты в пикселях!","В отличие от transform: translate(-50%, -50%), этот способ оставляет свойство transform свободным для анимаций scale() и не размывает шрифты на нечётных пикселях.","Для центрирования только по горизонтали используй пару inset-inline: 0; margin-inline: auto;."],"tags":["CSS","inset","margin auto","absolute","fixed","fit-content","центрирование"],"when":"При позиционировании всплывающих окон, тостов по центру, тултипов и декоративных плашек.","alternatives":"Если родитель не обязан быть absolute, проще задать родителю display: grid; place-items: center;.","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/inset"},{"lang":"css","id":"css-selection-scrollbar-styling","title":"CSS: кроссбраузерная стилизация полос прокрутки (scrollbar-width и ::-webkit-scrollbar)","summary":"Аккуратные тёмные и тонкие скроллбары для редакторов кода, боковых панелей и модальных окон.","code":"/* Стандартное свойство (Firefox, Chrome 121+, Edge) */\n.custom-scroll {\n  scrollbar-width: thin;\n  scrollbar-color: rgba(148, 163, 184, 0.3) transparent;\n}\n\n/* Тонкая настройка для WebKit / Safari */\n.custom-scroll::-webkit-scrollbar {\n  width: 6px;\n  height: 6px;\n}\n.custom-scroll::-webkit-scrollbar-thumb {\n  background: rgba(148, 163, 184, 0.3);\n  border-radius: 3px;\n}","example":":root { color-scheme: dark; } /* Автоматически делает системный скроллбар тёмным! */","points":["Прежде чем городить кастомный скроллбар, проверь: свойство color-scheme: dark на :root само переключает стандартный белый скроллбар Windows в аккуратный тёмный режим!","Свойство scrollbar-width: thin и scrollbar-color теперь поддерживаются и в Firefox, и в современных версиях Chrome/Edge.","Никогда не скрывай скроллбар полностью (scrollbar-width: none) на длинных блоках кода или текста, иначе пользователь с мышью не поймёт, что контент можно прокрутить."],"tags":["CSS","scrollbar","scrollbar-width","scrollbar-color","webkit-scrollbar","полоса прокрутки"],"when":"Во внутренних панелях сайдбара, блоках кода \u003cpre>, выпадающих списках и чатах.","alternatives":"Для горизонтальной ленты табов на мобильном экране допустимо скрыть полосу через scrollbar-width: none.","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/scrollbar-width"},{"lang":"css","id":"css-list-style-details-marker","title":"CSS: кастомные маркеры списков (::marker, list-style-type: \"→ \")","summary":"Замена стандартных круглых точек списка на любой символ, тире или эмодзи прямо в CSS-свойстве list-style-type.","code":"/* Любая строка в кавычках как маркер списка! */\n.feature-list {\n  list-style-type: \"✓ \";\n  padding-left: 20px;\n}\n\n.feature-list li {\n  padding-left: 6px;\n}\n\n.feature-list li::marker {\n  color: #10b981;\n  font-weight: 700;\n}","example":"list-style-type: \"— \"; /* Классическое русское тире в качестве буллита списка */","points":["Мало кто знает, что в свойство list-style-type можно передать любую строку в кавычках: list-style-type: \"→ \", \"— \" или \"✓ \"!","Псевдоэлемент li::marker позволяет покрасить этот символ в акцентный цвет и задать ему жирный шрифт, не создавая ручных псевдоэлементов ::before с position: absolute.","При сбросе маркеров навигационного меню через list-style: none в Safari старых версий используй семантический тег \u003cnav> вокруг \u003cul>, чтобы сохранить роль списка."],"tags":["CSS","list-style-type","marker","ul","li","список","маркеры","буллиты"],"when":"В списках преимуществ тарифа («✓ Безлимитный трафик»), чек-листах и текстовых статьях.","alternatives":"Если в качестве буллита нужна многоцветная SVG-иконка, используй display: flex на li или background-image.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/list-style-type"},{"lang":"javascript","id":"js-array-from-fill-range","title":"JS: генерация массивов и последовательностей (Array.from, Array.fill)","summary":"Создание массива чисел от 1 до N для пагинации, звёзд рейтинга или сетки календаря в одну строчку.","code":"// 1. Генерация массива чисел [1, 2, 3, 4, 5] для кнопок пагинации\nconst pages = Array.from({ length: 5 }, (_, index) => index + 1);\n\n// 2. Генерация шага чисел (например, годы с 2020 по 2026)\nconst range = (start, stop, step = 1) =>\n  Array.from({ length: Math.floor((stop - start) / step) + 1 }, (_, i) => start + i * step);\n\nconsole.log(range(2020, 2026)); // [2020, 2021, 2022, 2023, 2024, 2025, 2026]\n\n// 3. Превращение NodeList или Set в настоящий массив с маппингом за один шаг!\nconst texts = Array.from(document.querySelectorAll('h2'), el => el.textContent.trim());","example":"const emptyGrid = Array.from({ length: 3 }, () => Array(3).fill(null));","points":["Второй аргумент в Array.from(iterable, mapFn) работает как встроенный .map() без создания промежуточного массива!","Осторожно с Array(3).fill({}): метод .fill({}) заполнит все ячейки ссылкой на ОДИН И ТОТ ЖЕ объект в памяти! Чтобы создать независимые объекты или вложенные массивы, всегда используй Array.from({ length: 3 }, () => ({}))!","Конструкция Array.from({ length: N }, (_, i) => i + 1) — стандартный идиоматический генератор диапазона в JS."],"tags":["JavaScript","Array.from","fill","range","пагинация","последовательность","массивы"],"when":"При рендеринге номеров страниц пагинации, скелетонов загрузки, звёзд рейтинга и игровых сеток.","alternatives":"Цикл for (let i = 1; i \u003c= n; i++) делает то же самое императивно.","url":"https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/Array/from"},{"lang":"javascript","id":"js-number-parse-isnan","title":"JS: безопасное преобразование чисел (Number, parseInt, Number.isFinite, toFixed)","summary":"Чтение числовых значений из инпутов и атрибутов, проверка на валидное число и защита от NaN.","code":"const rawValue = inputElement.value; // всегда строка, например \"42.5\"\n\n// Быстрое преобразование через Number() или чтение сразу как числа:\nconst num = inputElement.valueAsNumber; // встроенное свойство для \u003cinput type=\"number\" / \"range\">!\n\n// Надёжная проверка, что значение — реальное конечное число (отсекает NaN, Infinity и \"42px\")\nif (Number.isFinite(num)) {\n  console.log(num.toFixed(2)); // \"42.50\"\n}\n\n// Целое число из строки с единицами измерения (\"16px\" -> 16)\nconst px = Number.parseInt('16px', 10);","example":"const quantity = Math.max(1, Number.parseInt(input.value, 10) || 1);","points":["У полей \u003cinput type=\"number\">, \u003cinput type=\"range\"> и \u003cinput type=\"date\"> есть готовое свойство input.valueAsNumber, которое сразу возвращает тип number без ручного парсинга строк!","Используй строгий Number.isFinite(val) или Number.isNaN(val) вместо старой глобальной функции isNaN(), которая сначала пытается привести строку к числу.","Помни, что метод num.toFixed(2) возвращает СТРОКУ (\"42.50\"), поэтому если дальше нужно складывать числа, сначала выполни всю математику и вызывай toFixed() только перед самым выводом на экран!"],"tags":["JavaScript","Number","parseInt","parseFloat","isFinite","isNaN","valueAsNumber","toFixed","числа"],"when":"При чтении ползунков, цен, количества товара в корзине и калькуляторов.","alternatives":"Унарный плюс (+str) работает как Number(str), но хуже читается в длинных выражениях.","url":"https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/Number/isFinite"},{"lang":"javascript","id":"js-object-freeze-assign-clone","title":"JS: глубокое клонирование (structuredClone) и неизменяемые константы (Object.freeze)","summary":"Нативное создание полной независимой копии вложенных объектов/массивов и защита словарей конфигурации от мутации.","code":"const originalState = {\n  user: { name: 'Павел', prefs: { theme: 'dark' } },\n  history: ['html-dialog', 'css-grid']\n};\n\n// Глубокая копия на уровне браузера (копирует вложенные объекты, массивы, Date, Map, Set!)\nconst nextState = structuredClone(originalState);\nnextState.user.prefs.theme = 'light'; // originalState.user.prefs.theme остался 'dark'!\n\n// Защита объекта констант от случайного изменения\nconst ROLES = Object.freeze({ ADMIN: 'admin', USER: 'user' });","example":"/* structuredClone работает быстрее и точнее старого хака JSON.parse(JSON.stringify(obj)) */","points":["Оператор расширения {...obj} копирует только первый уровень, оставляя вложенные объекты общими по ссылке. Встроенная функция structuredClone(obj) создаёт полноценную глубокую копию!","В отличие от старого трюка JSON.parse(JSON.stringify(obj)), метод structuredClone не ломает объекты Date, RegExp, Map, Set и Blob.","Object.freeze(obj) замораживает объект первого уровня: в строгом режиме (\"use strict\" / ES-модули) попытка перезаписать свойство выбросит TypeError."],"tags":["JavaScript","structuredClone","Object.freeze","Object.assign","clone","копия объекта","иммутабельность"],"when":"При сохранении снимков состояния (undo/redo в редакторах), работе со стейтом и объявлении констант.","alternatives":"Учитывай, что structuredClone не копирует функции и DOM-элементы.","url":"https://developer.mozilla.org/ru/docs/Web/API/Window/structuredClone"},{"lang":"javascript","id":"js-async-iterators-generators","title":"JS: загрузка с повтором при сбое сети (fetch Retry с экспоненциальной паузой)","summary":"Надёжная обёртка вокруг fetch() для автоматического повтора запроса при кратковременном обрыве мобильного интернета.","code":"async function fetchWithRetry(url, options = {}, retries = 3, delayMs = 500) {\n  for (let attempt = 1; attempt \u003c= retries; attempt++) {\n    try {\n      const response = await fetch(url, options);\n      if (!response.ok && response.status >= 500 && attempt \u003c retries) {\n        throw new Error(`HTTP ${response.status}`);\n      }\n      return response;\n    } catch (err) {\n      if (attempt === retries || err.name === 'AbortError') throw err;\n      // Экспоненциальная пауза перед повтором: 500мс -> 1000мс -> 2000мс\n      await new Promise(r => setTimeout(r, delayMs * (2 ** (attempt - 1))));\n    }\n  }\n}","example":"const res = await fetchWithRetry('/api/catalog');","points":["Повторять запрос (retry) имеет смысл только при сетевом обрыве или временных серверных ошибках 502 / 503 / 504 (но НЕ при клиентских ошибках 400 / 401 / 403 / 404!).","Экспоненциальная задержка (500 мс, 1000 мс, 2000 мс) даёт серверу или мобильной сети время восстановиться, не заваливая его лавиной повторных запросов.","Если запрос был отменён намеренно через AbortController (err.name === \"AbortError\"), цикл повторов немедленно прерывается."],"tags":["JavaScript","fetch","retry","backoff","async","await","сеть","ошибки сети"],"when":"При загрузке важных справочников, сохранении черновиков и работе в условиях нестабильного мобильного интернета.","alternatives":"Для POST-запросов оплаты используй заголовок Idempotency-Key, чтобы повтор не создал дубль заказа.","url":"https://developer.mozilla.org/ru/docs/Web/API/Fetch_API"},{"lang":"html","id":"html-dfn-var-samp-output","title":"HTML: техническая типографика (\u003cdfn>, \u003cvar>, \u003cabbr>, \u003ccite>, \u003cq>)","summary":"Семантическая разметка определений терминов, математических переменных и строчных цитат в документации.","code":"\u003cp>\n  \u003cdfn id=\"term-dom\">\u003cabbr title=\"Document Object Model\">DOM\u003c/abbr>\u003c/dfn> — это объектная модель документа,\n  представляющая HTML в виде дерева узлов.\n\u003c/p>\n\n\u003cp>\n  Формула расчёта отступа сетки: \u003cvar>totalWidth\u003c/var> = \u003cvar>columns\u003c/var> × \u003cvar>colWidth\u003c/var> + (\u003cvar>columns\u003c/var> - 1) × \u003cvar>gap\u003c/var>.\n\u003c/p>","example":"\u003cp>Как гласит стандарт \u003ccite>HTML Living Standard\u003c/cite>: \u003cq>Семантика важнее визуального вида\u003c/q>.\u003c/p>","points":["\u003cdfn> отмечает место в тексте, где термин вводится и объясняется впервые (на него можно ссылаться по #id из других статей).","\u003cvar> выделяет имена математических переменных и аргументов формул курсивом, отличая их от обычного программного кода \u003ccode>.","Тег \u003cq> автоматически оборачивает строчную цитату в правильные типографские кавычки («ёлочки» для lang=\"ru\")!"],"tags":["HTML","dfn","var","q","cite","abbr","термин","переменная","кавычки","типографика"],"when":"В обучающих статьях, документации API, технических спецификациях и учебниках.","alternatives":"Для программного кода функций и тегов всегда используй \u003ccode>, а не \u003cvar>.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/dfn"},{"lang":"html","id":"html-map-area-object","title":"HTML: встраивание PDF-документов (\u003cobject> / \u003ciframe>) и интерактивные области","summary":"Просмотр PDF-прайсов и инструкций прямо внутри веб-страницы с запасной ссылкой на скачивание.","code":"\u003cobject\n  data=\"/files/specification.pdf\"\n  type=\"application/pdf\"\n  width=\"100%\"\n  height=\"600\"\n>\n  \u003cp>\n    Ваш браузер не поддерживает встроенный просмотр PDF.\n    \u003ca href=\"/files/specification.pdf\" download>Скачать PDF-файл (2.4 МБ)\u003c/a>\n  \u003c/p>\n\u003c/object>","example":"\u003ca href=\"/price.pdf\" target=\"_blank\" rel=\"noopener\">Открыть прайс-лист (PDF) ↗\u003c/a>","points":["Преимущество тега \u003cobject> над \u003ciframe> для PDF в том, что всё содержимое между \u003cobject> и \u003c/object> автоматически показывается как аккуратная кнопка скачивания на мобильных браузерах, где нет встроенного PDF-ридера!","Обязательно указывай атрибут type=\"application/pdf\" и понятную ссылку с атрибутом download внутри фолбэка.","Для интерактивных планов этажей и карт залов сегодня вместо старого \u003cmap>\u003carea> используют инлайновый \u003csvg> с кликабельными \u003cpath>."],"tags":["HTML","object","pdf","embed","map","area","документ","просмотр pdf"],"when":"При выводе договоров, сертификатов, презентаций и технических паспортов на странице.","alternatives":"На мобильных экранах удобнее сразу давать прямую кнопку скачивания PDF с указанием размера файла.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/object"},{"lang":"html","id":"html-tabindex-focus-management","title":"HTML: управление фокусом клавиатуры (tabindex=\"0\", tabindex=\"-1\", inert)","summary":"Правила навигации клавишей Tab по странице, программный перевод фокуса на модалку и отключение фона.","code":"\u003c!-- 1. Элемент участвует в обычном порядке нажатия клавиши Tab -->\n\u003cdiv class=\"custom-card\" tabindex=\"0\" role=\"region\" aria-label=\"Превью\">...\u003c/div>\n\n\u003c!-- 2. Элемент НЕ попадает под Tab, но на него можно перевести фокус из JS: el.focus()! -->\n\u003ch2 id=\"modal-heading\" tabindex=\"-1\">Окно настроек\u003c/h2>\n\n\u003c!-- 3. Полное отключение интерактивности и фокуса для всей фоновой секции -->\n\u003cmain inert>...\u003c/main>","example":"/* НИКОГДА не используй положительные значения tabindex=\"1\", tabindex=\"2\" — они ломают порядок обхода страницы! */","points":["tabindex=\"0\" включает нестандартный элемент в естественный порядок обхода клавишей Tab (но для кнопок всегда лучше сразу взять \u003cbutton>, у которого фокус уже есть из коробки).","tabindex=\"-1\" незаменим для заголовков открывшихся модальных окон или блоков ошибок формы: пользователь не спотыкается о них при обычном Tab, но скрипт может вызвать heading.focus()!","Никогда не пиши tabindex=\"1\", \"2\", \"3\": положительные числа заставляют курсор прыгать по странице в хаотичном порядке."],"tags":["HTML","tabindex","focus","inert","клавиатура","фокус","доступность","tab"],"when":"При управлении фокусом в модальных окнах, табах (roving tabindex) и пропускающих ссылках.","alternatives":"Нативный \u003cdialog> при вызове showModal() сам делает остальную страницу инертной (inert).","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Global_attributes/tabindex"},{"lang":"html","id":"html-form-attributes-novalidate","title":"HTML: атрибуты тега \u003cform> (action, method, enctype=\"multipart/form-data\", novalidate)","summary":"Конфигурация отправки формы на сервер, обязательный enctype для загрузки файлов и привязка кнопки вне формы.","code":"\u003c!-- При наличии \u003cinput type=\"file\"> атрибут enctype=\"multipart/form-data\" ОБЯЗАТЕЛЕН! -->\n\u003cform id=\"checkout-form\" action=\"/api/orders\" method=\"POST\" enctype=\"multipart/form-data\">\n  \u003cinput type=\"text\" name=\"customer\" required>\n  \u003cinput type=\"file\" name=\"receipt\">\n\u003c/form>\n\n\u003c!-- Кнопка в шапке или подвале может отправлять форму по её id через атрибут form! -->\n\u003cbutton type=\"submit\" form=\"checkout-form\">Оформить заказ\u003c/button>","example":"\u003cform novalidate> /* Отключает системные тултипы браузера для показа собственной кастомной валидации */","points":["Частая ошибка: если в форме есть \u003cinput type=\"file\">, но на самом теге \u003cform> забыли написать enctype=\"multipart/form-data\", массив $_FILES в PHP придёт совершенно пустым!","Атрибут form=\"checkout-form\" на кнопке \u003cbutton> или \u003cinput> позволяет вынести кнопку «Сохранить» в липкую шапку или футер модалки за пределы самого тега \u003cform>!","Метод GET подставляет поля в адресную строку (?q=flex&sort=az) и используется для поиска/фильтров, а метод POST передаёт данные в теле запроса для изменения/сохранения."],"tags":["HTML","form","action","method","enctype","multipart/form-data","novalidate","отправка формы"],"when":"Во всех формах поиска (GET), авторизации (POST) и загрузки файлов (multipart/form-data).","alternatives":"При отправке через JS new FormData(form) браузер автоматически кодирует файлы как multipart/form-data.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/form"},{"lang":"css","id":"css-object-position-background-attachment","title":"CSS: фокус кадрирования фото (object-position) и плавная загрузка картинок","summary":"Смещение точки фокуса при обрезке портретов через object-fit: cover, чтобы у людей на фото не обрезалась голова.","code":".portrait-photo {\n  width: 100%;\n  height: 280px;\n  object-fit: cover;\n  /* Фокус по горизонтали в центре (50%), а по вертикали ближе к верху (20%), чтобы сохранить лицо в кадре! */\n  object-position: 50% 20%;\n  background-color: #121827; /* Цвет-заглушка до загрузки картинки */\n}","example":"object-position: top center;","points":["По умолчанию object-fit: cover центрирует фото строго посередине (50% 50%), из-за чего на вертикальных портретах часто обрезается макушка головы. Свойство object-position: 50% 20% решает эту проблему!","Задавай тегу \u003cimg> спокойный фоновый цвет background-color: var(--panel), чтобы во время подгрузки картинки не было пустой дырки.","Стилизовать текст атрибута alt (на случай битой картинки) можно прямо в CSS на самом селекторе img."],"tags":["CSS","object-position","object-fit","cover","img","портрет","кадрирование","фото"],"when":"В карточках команды, аватарах, обложках статей и баннерах с людьми.","alternatives":"Для фоновых декоративных картинок аналогично работает свойство background-position: 50% 20%.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/object-position"},{"lang":"css","id":"css-touch-action-overscroll","title":"CSS: отзывчивость на тач-экранах (touch-action: manipulation и -webkit-tap-highlight-color)","summary":"Отключение синей вспышки при тапе на Android/iOS и мгновенный отклик кнопок без задержки двойного зума.","code":"html {\n  /* Убирает стандартную полупрозрачную синюю/серую вспышку при тапе пальцем на смартфонах */\n  -webkit-tap-highlight-color: transparent;\n}\n\nbutton, a, input, label {\n  /* Разрешает скролл и пинч-зум, но отключает задержку ожидания двойного тапа на кнопках! */\n  touch-action: manipulation;\n}","example":".canvas-drawing-area {\n  touch-action: none; /* Перехватывает движения пальца для рисования без прокрутки страницы */\n}","points":["-webkit-tap-highlight-color: transparent убирает грубую системную подсветку тапа на мобильных устройствах, позволяя использовать собственные аккуратные стили :active.","touch-action: manipulation делает быстрые многократные нажатия по кнопкам («+ / -» количества товара в корзине) мгновенными без срабатывания зума браузера.","На кастомных ползунках и холстах \u003ccanvas> используй touch-action: none или touch-action: pan-y, чтобы движение пальца влево-вправо не дёргало страницу."],"tags":["CSS","touch-action","tap-highlight-color","manipulation","mobile","тач","смартфон","кнопки"],"when":"В базовом CSS-сбросе любого веб-приложения и PWA.","alternatives":"При отключении tap-highlight обязательно задай заметный отклик кнопки через :active { transform: scale(0.98); }.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/touch-action"},{"lang":"css","id":"css-grid-minmax-auto-fill-vs-fit","title":"CSS Grid: разница между auto-fill и auto-fit в адаптивной сетке","summary":"Наглядное объяснение того, как ведёт себя строка сетки, когда карточек в ней меньше, чем помещается по ширине экрана.","code":"/* 1. auto-fill: сохраняет пустые колонки справа — одна карточка НЕ растянется на весь экран! */\n.catalog-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));\n  gap: 16px;\n}\n\n/* 2. auto-fit: схлопывает пустые колонки в 0 — если карточек всего 2, они растянутся по 50% каждая */\n.features-row {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));\n  gap: 16px;\n}","example":"/* Обрати внимание на min(280px, 100%) внутри minmax — это защищает от скролла на узких экранах 320px! */","points":["Ключевое отличие проявляется, когда карточек мало (например, в результатах поиска нашлась всего 1 карточка): с auto-fill она займёт аккуратную 1 колонку слева (~300px), а с auto-fit раздуется на всю ширину монитора (1360px)!","Поэтому для каталогов товаров, статей и результатов поиска ВСЕГДА используй auto-fill, а для плашек преимуществ (где всегда 3–4 блока) — auto-fit.","Формула minmax(min(280px, 100%), 1fr) гарантирует, что даже если экран уже 280px, колонка сожмётся до 100% без горизонтального скролла."],"tags":["CSS","auto-fill","auto-fit","minmax","grid-template-columns","разница","сетка","каталог"],"when":"Используй auto-fill в списках с переменным числом карточек (поиск, избранное, каталог).","alternatives":"Flexbox с flex-wrap: wrap всегда растягивает последнюю одинокую карточку при flex-grow: 1, поэтому для ровных каталогов лучше подходит Grid с auto-fill.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/repeat"},{"lang":"css","id":"css-empty-only-child-target","title":"CSS: псевдоклассы состояния страницы (:target, :only-child, :placeholder-shown)","summary":"Подсветка секции, к которой перешли по якорной ссылке (#id), и плавающий лейбл инпута на чистом CSS.","code":"/* Подсвечивает раздел или комментарий, чей #id сейчас указан в адресной строке браузера! */\nsection:target {\n  border-color: #38bdf8;\n  background: rgba(56, 189, 248, 0.06);\n  scroll-margin-top: 80px;\n}\n\n/* Показываем кнопку «Очистить поиск» только когда в инпуте набран текст (плейсхолдер скрыт)! */\n.search-input:not(:placeholder-shown) ~ .clear-btn {\n  display: inline-flex;\n}","example":"\u003cinput placeholder=\" \"> /* Пробел в placeholder нужен для работы трюка с :placeholder-shown */","points":["Псевдокласс :target автоматически срабатывает на элементе, чей id совпадает с хешем в URL (например, страница открыта по ссылке page.html#faq-3)!","Псевдокласс :placeholder-shown проверяет, пуст ли сейчас \u003cinput> (показывается ли его placeholder). С его помощью делают «плавающие подписи» (Floating Labels) и показ крестика очистки на чистом CSS!",":only-child выбирает элемент только в том случае, если у него нет других соседей внутри родителя."],"tags":["CSS",":target",":placeholder-shown",":only-child","floating label","якорь","инпут"],"when":"Для подсветки выбранного в оглавлении раздела или процитированного комментария (:target) и умных полей ввода (:placeholder-shown).","alternatives":"Для сложной логики очистки инпута по клику на крестик добавь 3 строчки JS.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/:target"},{"lang":"php","id":"php-sql-joins-indexes","title":"PHP & SQL: объединение таблиц (INNER JOIN vs LEFT JOIN), GROUP BY и индексы","summary":"Практическая шпаргалка по выборке связанных данных из нескольких таблиц БД и ускорению медленных запросов.","code":"-- 1. LEFT JOIN: выбираем ВСЕ статьи и количество комментариев к каждой (даже если комментариев 0!)\nSELECT\n    a.id,\n    a.title,\n    u.name AS author_name,\n    COUNT(c.id) AS comments_count\nFROM articles a\nINNER JOIN users u ON u.id = a.author_id\nLEFT JOIN comments c ON c.article_id = a.id\nWHERE a.is_published = 1\nGROUP BY a.id\nORDER BY a.created_at DESC\nLIMIT 20;\n\n-- 2. Создание составного индекса для мгновенной фильтрации и сортировки\nCREATE INDEX idx_articles_pub_created ON articles (is_published, created_at DESC);","example":"/* INNER JOIN отбрасывает строки без совпадения, а LEFT JOIN сохраняет все строки левой таблицы */","points":["Главное отличие: INNER JOIN возвращает только те записи, которые есть в обеих таблицах. Если считать комментарии к статьям через INNER JOIN, статьи без единого комментария просто пропадут из выборки! Поэтому для необязательных связей всегда используй LEFT JOIN.","Обязательно создавай индексы (CREATE INDEX) на все внешние ключи (author_id, category_id) и поля, участвующие в WHERE и ORDER BY.","Не пиши SELECT * в продакшене — перечисляй только нужные колонки, чтобы не гонять тяжёлые текстовые поля по сети впустую."],"tags":["PHP","SQL","JOIN","LEFT JOIN","INNER JOIN","GROUP BY","INDEX","база данных","запросы"],"when":"При выводе списков статей с авторами, заказов с клиентами и категорий с количеством товаров.","alternatives":"Избегай проблемы N+1 запросов (когда внутри цикла foreach по 20 статьям выполняется ещё 20 отдельных SQL-запросов за автором каждой статьи!).","url":"https://www.php.net/manual/ru/book.pdo.php"},{"lang":"php","id":"php-password-token-random-bytes","title":"PHP 8: генерация криптостойких токенов (random_bytes, random_int) и HMAC-подписи","summary":"Создание безопасных ссылок сброса пароля, API-ключей, одноразовых СМС-кодов и проверка подписи вебхуков.","code":"\u003c?php\ndeclare(strict_types=1);\n\n// 1. 64-символьный криптостойкий токен для сброса пароля или API-ключа\n$resetToken = bin2hex(random_bytes(32));\n\n// 2. Криптостойкий 6-значный код подтверждения для СМС / Email\n$smsCode = (string) random_int(100000, 999999);\n\n// 3. Проверка цифровой подписи вебхука (HMAC-SHA256) от платёжной системы\n$expectedSig = hash_hmac('sha256', $rawWebhookBody, $webhookSecretKey);\nif (!hash_equals($expectedSig, $receivedSignatureHeader)) {\n    http_response_code(401);\n    exit('Неверная подпись вебхука');\n}","example":"/* НИКОГДА не используй rand(), mt_rand() или uniqid() для токенов безопасности — они легко предсказываются! */","points":["Старые функции rand(), mt_rand() и uniqid() НЕ являются криптографически безопасными. Для любых токенов, паролей и кодов из СМС используй ТОЛЬКО random_bytes() и random_int()!","Функция hash_hmac(\"sha256\", $payload, $secret) позволяет гарантировать, что пришедший на твой сервер вебхук об оплате действительно отправлен банком, а не подделан.","При хранении токенов сброса пароля в БД хорошей практикой является хранение их хеша hash(\"sha256\", $token) с ограниченным временем жизни (например, 30 минут)."],"tags":["PHP","random_bytes","random_int","bin2hex","hash_hmac","hash_equals","токен","безопасность","вебхук"],"when":"При генерации ссылок восстановления пароля, ключей API, пин-кодов и приёме платёжных уведомлений.","alternatives":"Для генерации стандартного UUID v4 в PHP также используют random_bytes(16).","url":"https://www.php.net/manual/ru/function.random-bytes.php"},{"lang":"php","id":"php-output-buffering-templates","title":"PHP 8: нативная шаблонизация через буферизацию вывода (ob_start / ob_get_clean)","summary":"Чистое разделение PHP-логики и HTML-верстки без тяжёлых сторонних библиотек в 10 строчек кода.","code":"\u003c?php\ndeclare(strict_types=1);\n\n/**\n * Рендерит PHP-шаблон с переданными переменными и возвращает готовую HTML-строку\n */\nfunction renderView(string $templatePath, array $vars = []): string {\n    extract($vars, EXTR_SKIP); // EXTR_SKIP защищает от перезаписи существующих переменных\n    ob_start();\n    include $templatePath;\n    return (string) ob_get_clean();\n}\n\n// Использование: собираем карточку и вставляем её внутрь главного layout.php\n$contentHtml = renderView(__DIR__ . '/views/catalog.php', ['items' => $products]);\necho renderView(__DIR__ . '/views/layout.php', ['title' => 'Каталог', 'content' => $contentHtml]);","example":"\u003ch1>\u003c?= htmlspecialchars($title, ENT_QUOTES, 'UTF-8') ?>\u003c/h1>","points":["Пара функций ob_start() и ob_get_clean() перехватывает весь HTML-вывод подключаемого файла в строку вместо немедленной отправки в браузер!","Это позволяет сначала отрендерить внутреннюю страницу (и узнать её заголовок и метатеги), а затем обернуть результат в общий каркас шапки и подвала (layout.php).","Внутри HTML-шаблонов используй короткий эхо-тег \u003c?= e($var) ?> и альтернативный синтаксис foreach ($items as $item): ... endforeach;."],"tags":["PHP","ob_start","ob_get_clean","include","require","шаблонизатор","views","layout"],"when":"При создании лёгких сайтов, лендингов и личных кабинетов на чистом PHP без сложного фреймворка.","alternatives":"В крупных командных проектах используют шаблонизаторы Twig или Blade с автоэкранированием.","url":"https://www.php.net/manual/ru/function.ob-get-clean.php"},{"lang":"xml","id":"seo-security-headers-csp","title":"SEO & Безопасность: ключевые HTTP-заголовки защиты (CSP, HSTS, X-Frame-Options)","summary":"Защита сайта от внедрения чужих скриптов (XSS), кликджекинга в чужих iframe и принудительный HTTPS.","code":"# Конфигурация для Nginx (или через header() в PHP / .htaccess в Apache):\nadd_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;\nadd_header X-Content-Type-Options \"nosniff\" always;\nadd_header X-Frame-Options \"SAMEORIGIN\" always;\nadd_header Referrer-Policy \"strict-origin-when-cross-origin\" always;\nadd_header Permissions-Policy \"camera=(), microphone=(), geolocation=()\" always;","example":"/* Именно из-за заголовка X-Frame-Options: DENY сайты вроде MDN и Google нельзя открыть внутри чужого \u003ciframe>! */","points":["Заголовок X-Frame-Options: SAMEORIGIN (или CSP frame-ancestors 'self') запрещает мошенническим сайтам встраивать твой сайт в прозрачный \u003ciframe> поверх чужих кнопок (защита от Clickjacking).","X-Content-Type-Options: nosniff запрещает браузеру пытаться угадать и выполнить загруженный текстовый файл как JavaScript.","Strict-Transport-Security (HSTS) заставляет браузер обращаться к домену строго по защищённому протоколу HTTPS."],"tags":["XML","SEO","CSP","HSTS","X-Frame-Options","nosniff","безопасность","заголовки сервера"],"when":"При настройке продакшен-сервера Nginx, Apache или Cloudflare для любого веб-проекта.","alternatives":"Не включай HSTS (Strict-Transport-Security) на локальном тестовом домене без SSL-сертификата.","url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy"},{"lang":"html","id":"html-form-input-search","title":"HTML: поле поиска \u003cinput type=\"search\"> и очистка крестиком","summary":"Специализированное текстовое поле для поисковых строк с системной кнопкой быстрой очистки и клавишей Enter.","code":"\u003csearch>\n  \u003cform role=\"search\" action=\"/search\">\n    \u003clabel for=\"site-q\" class=\"sr-only\">Поиск по справочнику\u003c/label>\n    \u003cinput\n      type=\"search\"\n      id=\"site-q\"\n      name=\"q\"\n      placeholder=\"Например: flexbox, dialog, fetch...\"\n      autocomplete=\"off\"\n      spellcheck=\"false\"\n    >\n  \u003c/form>\n\u003c/search>","example":"input[type=\"search\"]::-webkit-search-cancel-button { cursor: pointer; }","points":["В отличие от обычного type=\"text\", поле type=\"search\" на мобильных клавиатурах меняет кнопку «Ввод» на синюю кнопку с лупой «Найти».","В браузерах на базе Chromium и Safari внутри поля автоматически появляется крестик сброса введённого текста.","Событие input срабатывает как при печати с клавиатуры, так и при нажатии на встроенный крестик очистки!"],"tags":["HTML","input","search","поиск","крестик","форма"],"when":"Для главной строки поиска в шапке сайта, фильтрации таблиц и командных палитр.","alternatives":"Если рисуешь собственную кастомную кнопку очистки \u003cbutton class=\"clear\">, скройте системный крестик через ::-webkit-search-cancel-button { display: none; }.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Element/input/search"},{"lang":"html","id":"html-input-checkbox-indeterminate","title":"HTML & JS: чекбокс «Выбрать все» и третье состояние (indeterminate)","summary":"Реализация главного чекбокса таблицы с состоянием «выбрана часть строк» (тире внутри квадратика).","code":"\u003clabel>\n  \u003cinput type=\"checkbox\" id=\"select-all\"> Выбрать все элементы\n\u003c/label>\n\n\u003cscript>\nconst master = document.getElementById('select-all');\n// Третье визуальное состояние чекбокса (частичный выбор — задаётся только через JS!)\nmaster.indeterminate = true;\n\u003c/script>","example":"input:indeterminate {\n  accent-color: #38bdf8;\n}","points":["У нативного \u003cinput type=\"checkbox\"> кроме checked = true/false есть третье визуальное состояние: checkbox.indeterminate = true (отображается как горизонтальное тире внутри чекбокса)!","Это состояние задаётся только через JavaScript, когда в группе выбран хотя бы один дочерний чекбокс, но не все.","В CSS такое состояние можно стилизовать через псевдокласс input:indeterminate."],"tags":["HTML","checkbox","indeterminate","checked","выбрать все","чекбокс","таблица"],"when":"В таблицах админ-панелей, корзине товаров и древовидных фильтрах категорий.","alternatives":"Не нужно рисовать кастомные SVG-иконки для состояния частичного выбора — браузер рисует его нативно.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Element/input/checkbox"},{"lang":"html","id":"html-ol-attributes","title":"HTML: атрибуты нумерованного списка \u003col> (start, reversed, type) и \u003cli value>","summary":"Продолжение нумерации списка после прерывания картинкой и обратный отсчёт рейтингов Топ-10.","code":"\u003c!-- Обратный отсчёт рейтинга: 3, 2, 1 -->\n\u003col reversed start=\"3\">\n  \u003cli>Третье место\u003c/li>\n  \u003cli>Второе место\u003c/li>\n  \u003cli>Первое место\u003c/li>\n\u003c/ol>\n\n\u003c!-- Римская или буквенная нумерация (type=\"I\" / \"A\" / \"a\") -->\n\u003col type=\"I\">\n  \u003cli>Глава первая\u003c/li>\n  \u003cli value=\"5\">Глава пятая (перескок номера)\u003c/li>\n\u003c/ol>","example":"\u003col start=\"11\"> /* Продолжить список с 11-го пункта после врезки кода */","points":["Если между пунктами инструкции вставлена широкая иллюстрация или таблица, второй список \u003col start=\"4\"> аккуратно продолжит счёт с 4-го шага!","Атрибут reversed автоматически ведёт обратный отсчёт номеров сверху вниз (10, 9, 8... 1) для хит-парадов и рейтингов.","Атрибут value=\"10\" на отдельном теге \u003cli> позволяет принудительно задать номер конкретному пункту."],"tags":["HTML","ol","li","start","reversed","type","нумерованный список","рейтинг"],"when":"В пошаговых руководствах, юридических договорах и рейтингах.","alternatives":"Для сложной вложенной нумерации вида 1.1, 1.2 используй CSS-счётчики counters(item, \".\").","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/ol"},{"lang":"html","id":"html-audio-video-track-vtt","title":"HTML: субтитры и таймкоды глав для видео (\u003ctrack kind=\"captions\" src=\"subs.vtt\">)","summary":"Подключение файла субтитров в формате WebVTT к видеоплееру для доступности и переключения языков.","code":"\u003cvideo controls src=\"/video/lesson.mp4\">\n  \u003ctrack kind=\"subtitles\" src=\"/video/ru.vtt\" srclang=\"ru\" label=\"Русский\" default>\n  \u003ctrack kind=\"subtitles\" src=\"/video/en.vtt\" srclang=\"en\" label=\"English\">\n  \u003ctrack kind=\"chapters\" src=\"/video/chapters.vtt\" srclang=\"ru\">\n\u003c/video>\n\n\u003c!-- Пример содержимого текстового файла ru.vtt:\nWEBVTT\n\n00:00:01.000 --> 00:00:05.000\nДобро пожаловать в интерактивный справочник DevShelf!\n-->","example":"video::cue {\n  background: rgba(9, 13, 20, 0.85);\n  color: #f8fafc;\n}","points":["Формат WebVTT (.vtt) — это простой текстовый файл, начинающийся со слова WEBVTT и содержащий таймкоды и фразы.","Псевдоэлемент video::cue в CSS позволяет настроить шрифт, цвет и полупрозрачную подложку субтитров прямо поверх видео!","Атрибут default включает выбранную дорожку субтитров автоматически при запуске плеера."],"tags":["HTML","track","vtt","webvtt","subtitles","captions","cue","субтитры","видео"],"when":"Во всех обучающих видеороликах, вебинарах и презентациях продуктов.","alternatives":"Вшитые в сам видеофайл (hardcoded) субтитры нельзя отключить, скопировать или перевести.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/track"},{"lang":"html","id":"html-aria-roles-landmarks","title":"HTML & ARIA: ориентиры страницы (Landmarks) и роли компонентов (role)","summary":"Карта соответствия нативных HTML5-тегов и ролей WAI-ARIA для быстрой навигации незрячих пользователей.","code":"\u003c!-- Нативные теги уже имеют встроенные ARIA-роли по умолчанию: -->\n\u003cheader>  \u003c!-- role=\"banner\" --> \u003c/header>\n\u003cnav>     \u003c!-- role=\"navigation\" --> \u003c/nav>\n\u003cmain>    \u003c!-- role=\"main\" --> \u003c/main>\n\u003caside>   \u003c!-- role=\"complementary\" --> \u003c/aside>\n\u003cfooter>  \u003c!-- role=\"contentinfo\" --> \u003c/footer>\n\n\u003c!-- Явные роли для специализированных динамических виджетов: -->\n\u003cdiv role=\"alert\">Ошибка соединения с сервером!\u003c/div>\n\u003cdiv role=\"tablist\" aria-label=\"Режимы редактора\">...\u003c/div>","example":"/* Не пиши \u003cnav role=\"navigation\"> — это избыточное дублирование! */","points":["Скринридеры позволяют пользователю одним нажатием горячей клавиши перемещаться по ориентирам страницы (шапка -> поиск -> меню -> главный контент -> подвал).","Не дублируй встроенную роль на нативном теге (не нужно писать \u003cmain role=\"main\"> или \u003cbutton role=\"button\">).","Роль role=\"alert\" предназначена для срочных ошибок: она немедленно озвучивается скринридером при появлении в DOM."],"tags":["HTML","ARIA","role","landmarks","alert","tablist","banner","доступность"],"when":"При проектировании доступных веб-приложений, табов, уведомлений и диалогов.","alternatives":"Всегда отдавай приоритет семантическим тегам HTML5 перед ручным назначением role на \u003cdiv>.","url":"https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Roles"},{"lang":"css","id":"css-background-clip-text-stroke","title":"CSS: контурный и градиентный текст (-webkit-text-stroke и background-clip: text)","summary":"Создание выразительных акцентных заголовков с градиентной заливкой или тонкой векторной обводкой букв.","code":"/* 1. Заголовок с заливкой линейным градиентом */\n.text-gradient {\n  background: linear-gradient(135deg, #f8fafc 0%, #38bdf8 100%);\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n}\n\n/* 2. Полый контурный текст (Outline Text) для крупных фоновых цифр */\n.text-outline {\n  color: transparent;\n  -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.25);\n}","example":".step-number { font-size: 64px; -webkit-text-stroke: 1px var(--accent); color: transparent; }","points":["При использовании background-clip: text цвет самого текста задают прозрачным (color: transparent), чтобы сквозь контуры букв проступил фоновый градиент.","Свойство -webkit-text-stroke поддерживается во всех современных браузерах (Chrome, Safari, Firefox, Edge) и отлично подходит для крупных фоновых номеров секций (01, 02, 03).","Следи, чтобы блок с background-clip: text имел display: inline-block, если градиент должен растягиваться ровно по ширине слова, а не всей строки."],"tags":["CSS","background-clip","text-stroke","gradient text","outline text","градиентный текст","обводка текста"],"when":"Для главных заголовков на лендингах и крупных декоративных цифр шагов.","alternatives":"Для сложных многослойных контуров с тенями лучше использовать инлайновый \u003csvg>\u003ctext>.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/background-clip"},{"lang":"css","id":"css-shape-outside-float","title":"CSS: фигурное обтекание иллюстраций текстом (shape-outside: circle())","summary":"Журнальная верстка статей, в которой строки абзаца плавно огибают круглый аватар автора по дуге.","code":".author-avatar-float {\n  float: left;\n  width: 120px;\n  height: 120px;\n  border-radius: 50%;\n  margin-right: 20px;\n  margin-bottom: 12px;\n  /* Текст статьи огибает аватар по кругу, а не по квадратной коробке! */\n  shape-outside: circle(50%);\n}","example":"shape-outside: polygon(0 0, 100% 0, 60% 100%, 0 100%);","points":["Сегодня свойство float больше не используется для сеток колонок (там царят Flex и Grid), но float остаётся единственным инструментом для обтекания картинки живым текстом внутри статьи!","Добавление shape-outside: circle(50%) к круглой картинке с float: left заставляет строки текста повторять изгиб круга.","Свойство shape-margin: 16px задаёт аккуратный воздушный зазор вдоль криволинейного контура."],"tags":["CSS","shape-outside","float","circle","обтекание текстом","верстка статей"],"when":"Во врезках с цитатами, круглыми портретами спикеров и журнальных лонгридах.","alternatives":"Для обычного расположения аватара слева от имени и должности всегда используй display: flex; align-items: center; gap: 12px.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/shape-outside"},{"lang":"css","id":"css-order-align-self","title":"CSS: индивидуальное управление элементом сетки (align-self, justify-self, order)","summary":"Точечное выравнивание отдельной карточки или кнопки по краю родителя без создания дополнительных обёрток.","code":".header-flex {\n  display: flex;\n  align-items: center;\n  gap: 16px;\n}\n\n.special-badge {\n  /* Только этот элемент прижимается к верхнему краю, пока остальные стоят по центру */\n  align-self: flex-start;\n}\n\n.close-btn {\n  /* Внутри CSS Grid прижимает кнопку строго в правый верхний угол ячейки */\n  justify-self: end;\n  align-self: start;\n}","example":"place-self: start end; /* Сокращение для align-self + justify-self в CSS Grid */","points":["align-self переопределяет общее правило align-items родителя для одного конкретного дочернего элемента (как во Flexbox, так и в CSS Grid).","В CSS Grid также работает свойство justify-self (выравнивание элемента по горизонтали внутри своей ячейки) и сокращение place-self: center end.","Не злоупотребляй свойством order: -1 для перестановки важных кнопок, так как порядок обхода клавишей Tab всё равно останется таким, как в исходном HTML!"],"tags":["CSS","align-self","justify-self","place-self","order","выравнивание","flex","grid"],"when":"Когда один элемент внутри ряда (кнопка, бейдж, цена) должен стоять у другого края.","alternatives":"Во Flexbox для прижатия элемента вправо вдоль главной оси используй margin-left: auto.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/align-self"},{"lang":"css","id":"css-inset-border-image-outline","title":"CSS: вложенные тени (box-shadow: inset) и эффект вдавленной панели (Well / Input)","summary":"Создание глубины для полей ввода, блоков кода и активных переключателей с помощью внутренней тени и верхней подсветки.","code":"/* Поле ввода или блок кода, визуально утопленный внутрь панели */\n.code-well,\n.input-recessed {\n  background: #070a10;\n  border: 1px solid rgba(255, 255, 255, 0.08);\n  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.45);\n}\n\n/* Выпуклая кнопка с тонким бликом по верхнему краю (1px inner highlight) */\n.btn-tactile {\n  background: #161e31;\n  border: 1px solid rgba(255, 255, 255, 0.12);\n  box-shadow:\n    inset 0 1px 0 rgba(255, 255, 255, 0.1),\n    0 2px 4px rgba(0, 0, 0, 0.3);\n}","example":".btn-tactile:active {\n  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);\n}","points":["Ключевое слово inset разворачивает тень внутрь коробки элемента, создавая ощущение утопленной поверхности (идеально для инпутов, треков ползунков и окон кода).","Тонкий светлый внутренний блик сверху (inset 0 1px 0 rgba(255,255,255,0.1)) придаёт кнопкам и карточкам в тёмной теме благородный тактильный объём (как в интерфейсах Linear и Raycast)!","В одном свойстве box-shadow можно комбинировать через запятую и внутренние (inset), и внешние тени."],"tags":["CSS","box-shadow","inset","внутренняя тень","блик","кнопка","инпут","дизайн"],"when":"При оформлении кнопок, переключателей вкладок, полей ввода и панелей инструментов.","alternatives":"Не делай внутреннюю тень слишком широкой и размытой, чтобы интерфейс не выглядел устаревшим.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/box-shadow"},{"lang":"css","id":"css-print-page-break","title":"CSS: стили для печати документа и экспорта в PDF (@media print, @page)","summary":"Очистка страницы от меню и кнопок при отправке на принтер или сохранении счёта/резюме в PDF.","code":"@media print {\n  /* Скрываем шапку, сайдбар, поиск и кнопки действий */\n  .top, .sidebar, .searchbox, .no-print, footer {\n    display: none !important;\n  }\n\n  /* Принудительно делаем фон белым, а текст чёрным для экономии тонера и чёткости PDF */\n  body {\n    background: #ffffff !important;\n    color: #000000 !important;\n    font-size: 12pt;\n  }\n\n  /* Запрещаем разрывать карточки и блоки кода пополам между листами бумаги А4 */\n  pre, blockquote, table, figure, .card {\n    break-inside: avoid;\n  }\n}","example":"a[href^=\"http\"]::after { content: \" (\" attr(href) \")\"; } /* Вывод полных URL ссылок на бумаге */","points":["Пользователи часто сохраняют справочные статьи, чеки и счета через системный диалог «Печать -> Сохранить как PDF». Правило @media print гарантирует чистый документ без шапки и тёмного фона!","Свойство break-inside: avoid запрещает браузеру разрезать таблицу или сниппет кода на границе двух страниц А4.","Свойство print-color-adjust: exact заставляет браузер сохранить цветные бейджи и графики при экспорте в PDF."],"tags":["CSS","print","media print","pdf","break-inside","печать","экспорт в pdf"],"when":"На страницах документации, статей, резюме, билетов, чеков и счетов на оплату.","alternatives":"Серверная генерация PDF нужна только для официальных бланков со строгой пиксельной сеткой и печатями.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/CSS_media_queries/Printing"},{"lang":"javascript","id":"js-console-debugging","title":"JS: продвинутая отладка в консоли (console.table, time, group, assert)","summary":"Наглядный вывод массивов объектов в виде сортируемой таблицы и точный замер скорости работы функций.","code":"const users = [\n  { id: 1, name: 'Павел', role: 'admin' },\n  { id: 2, name: 'Елена', role: 'editor' }\n];\n\n// 1. Выводит красивую интерактивную таблицу прямо в DevTools!\nconsole.table(users, ['id', 'name', 'role']);\n\n// 2. Точный замер времени выполнения участка кода\nconsole.time('renderGrid');\nrenderItems(users);\nconsole.timeEnd('renderGrid'); // \"renderGrid: 1.42 ms\"","example":"console.assert(users.length > 0, 'Массив пользователей не должен быть пустым!');","points":["console.table(array) — самый удобный способ посмотреть структуру ответа от сервера (массив товаров или пользователей) с возможностью сортировки по колонкам в DevTools!","Пара console.time(\"label\") и console.timeEnd(\"label\") замеряет время выполнения кода с точностью до долей миллисекунды.","console.groupCollapsed(\"Детали запроса\") позволяет аккуратно свернуть длинные логи в раскрывающуюся папку."],"tags":["JavaScript","console","console.table","console.time","debug","devtools","отладка","консоль"],"when":"Во время локальной разработки, профилирования циклов и проверки ответов API.","alternatives":"Для пошаговой остановки скрипта с просмотром всех локальных переменных используй ключевое слово debugger; или брейкпоинты во вкладке Sources.","url":"https://developer.mozilla.org/ru/docs/Web/API/console/table"},{"lang":"javascript","id":"js-encode-uri-base64","title":"JS: кодирование URL-параметров (encodeURIComponent) и UTF-8 Base64","summary":"Безопасная передача строк со спецсимволами (&, ?, #, пробел) в ссылках и кодирование кириллицы в Base64.","code":"const userQuery = 'C++ & C# разработка';\n\n// encodeURIComponent кодирует амперсанд & и решётку #, чтобы они не сломали GET-запрос!\nconst safeUrl = `/search?q=${encodeURIComponent(userQuery)}`;\n// \"/search?q=C%2B%2B%20%26%20C%23%20%D1%80%D0%B0%D0%B7...\"\n\n// Безопасное кодирование и декодирование кириллицы UTF-8 в Base64\nconst toBase64 = (str) => btoa(String.fromCharCode(...new TextEncoder().encode(str)));\nconst fromBase64 = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));","example":"/* Обычный encodeURI() НЕ кодирует символы &, = и +, поэтому для параметров всегда используй encodeURIComponent()! */","points":["Для отдельных значений GET-параметров ВСЕГДА используй encodeURIComponent(val) (или класс URLSearchParams), а не encodeURI()! Иначе поиск по запросу \"H&M\" или \"C#\" обрежет строку по символу & или #.","Старая функция btoa(\"Привет\") падает с ошибкой InvalidCharacterError на русских буквах. Связка с TextEncoder() решает это для любого языка мира.","Для обратной расшифровки параметра из адресной строки используется decodeURIComponent(encodedStr)."],"tags":["JavaScript","encodeURIComponent","decodeURIComponent","Base64","btoa","TextEncoder","кодирование","url"],"when":"При формировании ссылок для Telegram/WhatsApp, передаче поисковых фраз и работе с токенами.","alternatives":"При использовании new URLSearchParams({ q: userQuery }) кодирование выполняется автоматически.","url":"https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/encodeURIComponent"},{"lang":"php","id":"php-interfaces-traits-abstract","title":"PHP 8: интерфейсы (interface), трейты (trait) и внедрение зависимостей (DI)","summary":"Проектирование гибкой архитектуры приложения: контракты для сервисов оплаты/уведомлений и переиспользование методов.","code":"\u003c?php\ndeclare(strict_types=1);\n\ninterface NotifierInterface {\n    public function send(string $recipient, string $message): bool;\n}\n\nclass TelegramNotifier implements NotifierInterface {\n    public function send(string $recipient, string $message): bool {\n        // Отправка в Telegram API\n        return true;\n    }\n}\n\n// Класс OrderService зависит от интерфейса, а не от конкретного мессенджера!\nreadonly class OrderService {\n    public function __construct(private NotifierInterface $notifier) {}\n\n    public function complete(string $chatId): void {\n        $this->notifier->send($chatId, 'Ваш заказ успешно собран!');\n    }\n}","example":"trait TimestampsTrait {\n    public ?DateTimeImmutable $createdAt = null;\n}","points":["Интерфейс (interface) задаёт строгий контракт: какие методы обязан реализовать класс. Это позволяет легко подменить отправку СМС на Telegram или тестовую заглушку без переписывания бизнес-логики!","Трейт (trait) позволяет горизонтально подключить готовый набор методов (например, логирование или расчёт дат) сразу в несколько несвязанных классов через ключевое слово use.","Передача зависимостей через конструктор (Dependency Injection) делает классы чистыми и легко тестируемыми."],"tags":["PHP","interface","trait","implements","abstract","DI","ооп","интерфейс","архитектура"],"when":"При написании модулей оплаты, доставки, уведомлений и хранилищ кэша.","alternatives":"Избегай глубоких цепочек наследования (extends на 4 уровня) — отдавай предпочтение композиции и интерфейсам.","url":"https://www.php.net/manual/ru/language.oop5.interfaces.php"},{"lang":"php","id":"php-filter-var-validation","title":"PHP 8: валидация данных через filter_var (Email, URL, IP, целые числа в диапазоне)","summary":"Встроенный в ядро PHP валидатор и санитайзер входящих параметров без сложных регулярных выражений.","code":"\u003c?php\ndeclare(strict_types=1);\n\n// 1. Проверка корректности Email\n$email = filter_var(trim($rawEmail), FILTER_VALIDATE_EMAIL);\nif ($email === false) {\n    throw new InvalidArgumentException('Указан некорректный адрес почты');\n}\n\n// 2. Проверка целого числа строго в заданном диапазоне (например, номер страницы от 1 до 1000)\n$page = filter_var($_GET['page'] ?? 1, FILTER_VALIDATE_INT, [\n    'options' => ['default' => 1, 'min_range' => 1, 'max_range' => 1000],\n]);\n\n// 3. Проверка валидности URL и IP-адреса\n$isValidUrl = filter_var($url, FILTER_VALIDATE_URL) !== false;\n$isValidIp  = filter_var($ip, FILTER_VALIDATE_IP) !== false;","example":"$boolFlag = filter_var($_POST['active'] ?? false, FILTER_VALIDATE_BOOL); /* Понимает \"true\", \"1\", \"on\", \"yes\"! */","points":["В случае ошибки валидации filter_var() возвращает булево значение false (поэтому всегда проверяй результат строго через === false).","Опции min_range, max_range и default в FILTER_VALIDATE_INT позволяют проверить и ограничить числовой параметр в один вызов!","Фильтр FILTER_VALIDATE_BOOL умно распознаёт строки \"1\", \"true\", \"on\", \"yes\" как true, а \"0\", \"false\", \"off\", \"no\" как false."],"tags":["PHP","filter_var","FILTER_VALIDATE_EMAIL","FILTER_VALIDATE_INT","FILTER_VALIDATE_URL","валидация","проверка"],"when":"На входе любых контроллеров, API-эндпоинтов и обработчиков форм.","alternatives":"Не используй удалённый в PHP 8.1 фильтр FILTER_SANITIZE_STRING — для защиты вывода в HTML используй htmlspecialchars().","url":"https://www.php.net/manual/ru/function.filter-var.php"},{"lang":"html","id":"html-input-color-date-time","title":"HTML: нативные пикеры цвета и времени (type=\"color\", \"date\", \"time\", \"datetime-local\")","summary":"Системные виджеты выбора цвета, календарной даты и времени с ограничением доступного диапазона min и max.","code":"\u003clabel>\n  Акцентный цвет:\n  \u003cinput type=\"color\" name=\"accent\" value=\"#38bdf8\">\n\u003c/label>\n\n\u003clabel>\n  Дата бронирования (только 2026 год):\n  \u003cinput type=\"date\" name=\"booking_date\" min=\"2026-01-01\" max=\"2026-12-31\" required>\n\u003c/label>\n\n\u003clabel>\n  Время встречи (с 09:00 до 19:00 с шагом 15 минут):\n  \u003cinput type=\"time\" name=\"slot\" min=\"09:00\" max=\"19:00\" step=\"900\">\n\u003c/label>","example":"/* Цвет иконки календаря внутри инпута автоматически следует за свойством color-scheme: dark! */","points":["Значение (value, min, max) у \u003cinput type=\"date\"> в коде и при отправке на сервер ВСЕГДА имеет строгий формат ГГГГ-ММ-ДД (\"2026-09-15\"), независимо от того, как браузер отображает дату на экране пользователя (15.09.2026)!","У \u003cinput type=\"time\"> атрибут step задаётся в секундах: step=\"900\" делает шаг выбора равным 15 минутам (900 секунд).","У \u003cinput type=\"color\"> значение всегда представляет собой 7-символьный HEX-код в нижнем регистре (\"#38bdf8\")."],"tags":["HTML","color","date","time","datetime-local","month","week","календарь","палитра","дата"],"when":"В формах бронирования, фильтрах по датам, редакторах тем и генераторах стилей.","alternatives":"Если у иконки календаря в тёмной теме остался чёрный цвет, убедись, что на :root или самом инпуте задано color-scheme: dark.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Element/input/date"},{"lang":"html","id":"html-meter-vs-progress","title":"HTML: семантика \u003cmark>, \u003cins>, \u003cdel>, \u003ckbd>, \u003csamp> и \u003coutput> в интерфейсах","summary":"Быстрая шпаргалка по строчным семантическим тегам для результатов поиска, диффов кода и горячих клавиш.","code":"\u003c!-- Подсветка найденного слова в результатах поиска -->\n\u003cp>По запросу «\u003cmark>grid\u003c/mark>» найдено \u003coutput>18\u003c/output> справочников.\u003c/p>\n\n\u003c!-- Отображение изменений в истории версий (Diff) -->\n\u003cp>Поддержка: \u003cdel>IE 11\u003c/del> \u003cins>Все современные браузеры\u003c/ins>\u003c/p>\n\n\u003c!-- Горячая клавиша в меню -->\n\u003cspan class=\"shortcut\">\u003ckbd>Ctrl\u003c/kbd> + \u003ckbd>S\u003c/kbd>\u003c/span>","example":"mark { background: rgba(56, 189, 248, 0.25); color: inherit; border-radius: 3px; padding: 0 3px; }","points":["По умолчанию браузер красит \u003cmark> в ярко-жёлтый цвет маркера. В тёмной теме обязательно переопредели его на мягкий полупрозрачный акцент (rgba(56, 189, 248, 0.22)).","Пара \u003cdel> (удалено) и \u003cins> (добавлено) идеально подходит как для старых/новых цен, так и для показа правок текста или чейнджлогов.","Тег \u003coutput> семантически связывает результат расчёта с ползунками и инпутами формы."],"tags":["HTML","mark","output","del","ins","kbd","подсветка поиска","дифф","горячие клавиши"],"when":"В выдаче живого поиска, калькуляторах, документации и истории изменений.","alternatives":"Обычный \u003cspan class=\"highlight\"> не сообщает скринридеру о смысловом выделении совпадения.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/mark"},{"lang":"html","id":"html-svg-primitives","title":"SVG: базовые фигуры (\u003crect>, \u003ccircle>, \u003cline>, \u003cpolyline>, \u003cpath>)","summary":"Рисование аккуратных векторных иконок, стрелок, чекбоксов и графиков прямо в HTML-коде без графических редакторов.","code":"\u003csvg width=\"120\" height=\"40\" viewBox=\"0 0 120 40\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  \u003c!-- Прямоугольник со скруглёнными углами rx=\"6\" -->\n  \u003crect x=\"2\" y=\"2\" width=\"36\" height=\"36\" rx=\"6\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n  \u003c!-- Круг по центру (cx, cy) и радиусу r -->\n  \u003ccircle cx=\"60\" cy=\"20\" r=\"16\" stroke=\"#818cf8\" stroke-width=\"2\"/>\n  \u003c!-- Ломаная линия галочки (polyline) -->\n  \u003cpolyline points=\"90 20 98 28 114 12\" stroke=\"#10b981\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n\u003c/svg>","example":"stroke-dasharray: 100; stroke-dashoffset: 25; /* Заполнение кругового прогресс-бара на 75%! */","points":["Атрибуты stroke-linecap=\"round\" и stroke-linejoin=\"round\" скругляют кончики и углы векторных линий, делая иконки дружелюбными и аккуратными (как в Lucide / Feather Icons).","У прямоугольника \u003crect> скругление углов задаётся атрибутом rx=\"8\".","Добавив кругу \u003ccircle> атрибут pathLength=\"100\", можно задавать процент заполнения кольца напрямую через stroke-dasharray=\"75 100\" без вычисления длины окружности 2πR!"],"tags":["HTML","SVG","rect","circle","line","polyline","path","pathLength","векторные фигуры"],"when":"При создании иконок интерфейса, круговых индикаторов прогресса и мини-спарклайнов.","alternatives":"Для растровых фотографий используй WebP/AVIF, а для всех иконок и схем — только SVG.","url":"https://developer.mozilla.org/ru/docs/Web/SVG/Tutorial/Basic_Shapes"},{"lang":"css","id":"css-grid-template-rows-animate","title":"CSS: плавная анимация высоты от 0 до auto через grid-template-rows: 0fr -> 1fr","summary":"Современный чистый способ плавно раскрыть аккордеон или выпадающий блок с неизвестной высотой текста без JS.","code":".accordion-body {\n  display: grid;\n  grid-template-rows: 0fr; /* В закрытом состоянии высота дорожки равна 0fr */\n  transition: grid-template-rows 250ms cubic-bezier(0.22, 1, 0.36, 1);\n}\n\n.accordion-body.is-open {\n  grid-template-rows: 1fr; /* Плавно раскрывается ровно под реальную высоту текста! */\n}\n\n.accordion-inner {\n  overflow: hidden;        /* Обязательная внутренняя обёртка для схлопывания в 0 */\n}","example":"/* Больше никаких костылей с max-height: 999px и кривыми таймингами! */","points":["Десять лет в CSS нельзя было плавно анимировать height: 0 -> height: auto. Переход grid-template-rows: 0fr -> 1fr решает эту задачу идеально и без угадывания max-height!","Для работы трюка внутри .accordion-body должен лежать один дочерний div (.accordion-inner) со свойством overflow: hidden;.","В новейших браузерах также появляется прямое свойство interpolate-size: allow-keywords для анимации height: auto."],"tags":["CSS","grid-template-rows","0fr","1fr","height auto","accordion","анимация высоты","аккордеон"],"when":"При верстке плавно раскрывающихся спойлеров, карточек FAQ и мобильных подменю.","alternatives":"Старый хак с max-height: 1000px создаёт задержку при закрытии короткого текста.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/grid-template-rows"},{"lang":"css","id":"css-focus-ring-button-reset","title":"CSS: профессиональный сброс стилей кнопки (button reset) и состояний","summary":"Базовый эталонный класс кнопки (.btn) с выравниванием иконки, защитой от сжатия во флексе и тактильным нажатием.","code":".btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  padding: 8px 16px;\n  font: inherit;\n  font-weight: 500;\n  white-space: nowrap;\n  flex-shrink: 0;          /* Кнопка никогда не сплющится в узкой шапке или строке поиска! */\n  user-select: none;\n  cursor: pointer;\n  border-radius: 6px;\n  border: 1px solid var(--line);\n  transition: transform 100ms ease, border-color 150ms ease, background-color 150ms ease;\n}\n\n.btn:active:not(:disabled) {\n  transform: translateY(1px); /* Лёгкий тактильный отклик при клике */\n}","example":".btn svg { width: 16px; height: 16px; flex-shrink: 0; pointer-events: none; }","points":["Свойство flex-shrink: 0 на кнопке и на иконке svg внутри неё гарантирует, что длинный заголовок рядом никогда не сплющит кнопку в овал!","display: inline-flex; align-items: center; gap: 8px идеально выравнивает SVG-иконку и текст кнопки по одной оптической линии.","Лёгкое смещение transform: translateY(1px) (или scale(0.98)) в состоянии :active делает интерфейс живым и отзывчивым."],"tags":["CSS","button","btn","inline-flex","flex-shrink","active","кнопка","сброс стилей"],"when":"В качестве базового класса для всех кнопок дизайн-системы проекта.","alternatives":"Всегда наследуй шрифт через font: inherit;, так как браузеры по умолчанию ставят кнопкам системный Arial.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/button"},{"lang":"css","id":"css-table-responsive-cards","title":"CSS: адаптивная таблица (горизонтальный скролл и трансформация в карточки)","summary":"Два надёжных паттерна отображения широких таблиц данных на узких экранах смартфонов без поломки верстки.","code":"/* Способ 1: аккуратная прокручиваемая обёртка с тенью */\n.table-responsive {\n  width: 100%;\n  overflow-x: auto;\n  -webkit-overflow-scrolling: touch;\n  border: 1px solid var(--line);\n  border-radius: 8px;\n}\n\n/* Способ 2: вывод названия колонки из data-label на мобильных */\n@media (max-width: 600px) {\n  .mobile-cards-table td::before {\n    content: attr(data-label);\n    font-weight: 600;\n    color: var(--muted);\n  }\n}","example":"\u003ctd data-label=\"Тариф\">Pro\u003c/td>","points":["Горизонтальная обёртка .table-responsive с overflow-x: auto — самый честный и удобный способ для таблиц сравнения, где пользователю важно сопоставлять колонки глазами.","Для таблиц истории заказов (номер, дата, статус, сумма) на мобильных удобно превращать каждую строку \u003ctr> в карточку с подписями из attr(data-label).","Не забудь задать ячейкам с датами и ценами white-space: nowrap, чтобы они не ломались на 3 этажа."],"tags":["CSS","table","responsive","overflow-x","data-label","адаптивная таблица","мобильная таблица"],"when":"При верстке любых прайс-листов, историй операций и таблиц характеристик.","alternatives":"Никогда не оставляй широкую таблицу без обёртки — она вызовет горизонтальный скролл всей страницы.","url":"https://developer.mozilla.org/ru/docs/Learn_web_development/Core/Styling_basics/Tables"},{"lang":"css","id":"css-sticky-footer-layout","title":"CSS: прижатый к низу экрана подвал (Sticky Footer на Grid и Flex)","summary":"Классический каркас страницы, при котором подвал \u003cfooter> всегда прижат к низу монитора, даже если на странице мало текста.","code":"body {\n  min-height: 100dvh;\n  display: flex;\n  flex-direction: column;\n  margin: 0;\n}\n\nmain {\n  flex: 1 0 auto; /* Главный контент растягивается и толкает footer в самый низ! */\n}\n\nfooter {\n  flex-shrink: 0;\n}","example":"/* Альтернатива на CSS Grid в 3 строки:\nbody { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; } */","points":["Если на странице мало контента (например, страница 404, форма входа или пустая корзина), без этого правила подвал некрасиво подпрыгивает к середине экрана.","Вариант на CSS Grid ещё короче: body { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; } (где шапка = auto, main = 1fr, подвал = auto)!","Используй min-height: 100dvh (а не фиксированный height: 100vh), чтобы длинные страницы спокойно прокручивались дальше вниз."],"tags":["CSS","sticky footer","min-height","100dvh","flex","grid","прижать подвал","футер к низу"],"when":"На теге \u003cbody> или корневом контейнере #app в каждом проекте.","alternatives":"Никогда не прибивай обычный подвал сайта через position: fixed; bottom: 0 — он перекроет контент на маленьких экранах.","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/Layout_cookbook/Sticky_footers"},{"lang":"javascript","id":"js-form-validation-api","title":"JS: нативный Constraint Validation API (checkValidity, setCustomValidity, reportValidity)","summary":"Программная проверка валидности формы и вывод кастомных русских сообщений об ошибках в нативных тултипах браузера.","code":"const passInput = document.getElementById('password');\nconst confirmInput = document.getElementById('password-confirm');\n\nfunction validatePasswordsMatch() {\n  if (confirmInput.value !== passInput.value) {\n    // Устанавливаем собственный текст ошибки\n    confirmInput.setCustomValidity('Пароли не совпадают');\n  } else {\n    // ВАЖНО: пустая строка '' сбрасывает ошибку и помечает поле как валидное!\n    confirmInput.setCustomValidity('');\n  }\n}\n\nconfirmInput.addEventListener('input', validatePasswordsMatch);","example":"if (!form.reportValidity()) return; /* Показывает системную подсказку у первого незаполненного поля */","points":["Главное правило setCustomValidity(msg): пока передана любая непустая строка, поле считается невалидным (:invalid). Чтобы разрешить отправку формы после исправления, ОБЯЗАТЕЛЬНО вызови input.setCustomValidity(\"\") с пустой строкой!","Метод form.checkValidity() тихо возвращает true/false, а метод form.reportValidity() дополнительно подсвечивает первое ошибочное поле и показывает подсказку пользователю.","Объект input.validity содержит булевы флаги причины ошибки: valueMissing (пустое required), typeMismatch (неверный email), tooShort (меньше minlength)."],"tags":["JavaScript","setCustomValidity","checkValidity","reportValidity","validity","валидация форм","пароли"],"when":"При проверке совпадения паролей, уникальности логина или сложных условий формы.","alternatives":"Для полного контроля над дизайном ошибок ставят \u003cform novalidate> и выводят текст в соседний \u003cspan class=\"error-msg\">.","url":"https://developer.mozilla.org/ru/docs/Learn_web_development/Extensions/Forms/Form_validation"},{"lang":"javascript","id":"js-history-pushstate-spa","title":"JS: управление историей браузера без перезагрузки (history.pushState, replaceState, popstate)","summary":"Смена URL при фильтрации каталога или переключении вкладок с поддержкой системных кнопок «Назад» и «Вперёд».","code":"// 1. Обновление URL при выборе вкладки (добавляет шаг в историю кнопки «Назад»)\nfunction selectCategory(categorySlug) {\n  const url = new URL(window.location.href);\n  url.searchParams.set('cat', categorySlug);\n  window.history.pushState({ cat: categorySlug }, '', url);\n  renderCatalog(categorySlug);\n}\n\n// 2. Реакция на нажатие пользователем кнопки «Назад / Вперёд» в браузере\nwindow.addEventListener('popstate', (event) => {\n  const cat = new URLSearchParams(location.search).get('cat') ?? 'all';\n  renderCatalog(cat);\n});","example":"history.replaceState(null, '', '?q=' + encodeURIComponent(query)); /* Меняет URL без засорения истории на каждую букву! */","points":["Разница между pushState и replaceState: для живого поиска при наборе каждой буквы используй replaceState (чтобы пользователю не пришлось нажимать кнопку «Назад» 20 раз по одной букве!), а для переключения крупных разделов/страниц — pushState!","Событие popstate срабатывает, когда пользователь нажимает системные кнопки «Назад» или «Вперёд» в браузере (или делает свайп назад на смартфоне).","Хранение активного таба и фильтра в URL позволяет пользователю обновить страницу по F5 или отправить ссылку коллеге без потери выбранного раздела."],"tags":["JavaScript","history","pushState","replaceState","popstate","роутинг","url","назад"],"when":"В табах, фильтрах каталога, живом поиске, модальных галереях и пошаговых формах.","alternatives":"Для простых переходов внутри одной страницы также можно использовать window.location.hash и событие hashchange.","url":"https://developer.mozilla.org/ru/docs/Web/API/History_API"},{"lang":"javascript","id":"js-web-workers-offload","title":"JS: фоновые вычисления без зависания интерфейса (Web Workers API)","summary":"Вынос тяжёлого парсинга больших JSON/CSV-файлов, поиска или фильтрации из главного потока в отдельный поток процессора.","code":"// В главном скрипте (main.js): создаём воркер и отправляем ему массив данных\nconst worker = new Worker(new URL('./search-worker.js', import.meta.url), { type: 'module' });\n\nworker.postMessage({ items: hugeDataset, query: 'flexbox' });\n\nworker.addEventListener('message', (e) => {\n  console.log('Отфильтровано в фоне без фризов UI:', e.data.results);\n});\n\n// В файле search-worker.js:\nself.addEventListener('message', (e) => {\n  const { items, query } = e.data;\n  const results = items.filter(i => i.title.includes(query));\n  self.postMessage({ results });\n});","example":"worker.terminate(); /* Принудительная остановка фонового потока */","points":["JavaScript в браузере однопоточен: если цикл обрабатывает 100 000 строк в главном потоке дольше 50 мс, анимации, скролл и ввод текста замирают. Web Worker выполняет код параллельно на другом ядре процессора!","Внутри Web Worker нет доступа к объектам window и document (DOM), общение происходит через быстрые сообщения postMessage().","Опция { type: \"module\" } позволяет использовать стандартные import / export внутри файла воркера."],"tags":["JavaScript","Web Worker","Worker","postMessage","многопоточность","производительность","фон"],"when":"При клиентском поиске по большим базам, генерации отчётов, сжатии изображений и криптографии.","alternatives":"Для небольших задач до 10–20 мс оверхед на пересылку данных в воркер не нужен.","url":"https://developer.mozilla.org/ru/docs/Web/API/Web_Workers_API/Using_web_workers"},{"lang":"php","id":"php-cookies-setcookie","title":"PHP 8: безопасная установка и удаление Cookies (setcookie с массивом опций)","summary":"Современный синтаксис setcookie() с защитными флагами HttpOnly, Secure, SameSite и корректное удаление куки.","code":"\u003c?php\ndeclare(strict_types=1);\n\n// 1. Установка защищённой куки на 30 дней (современный синтаксис с массивом опций)\nsetcookie('remember_token', $tokenValue, [\n    'expires'  => time() + 60 * 60 * 24 * 30,\n    'path'     => '/',\n    'secure'   => true,     // Передавать только по HTTPS\n    'httponly' => true,     // Запретить чтение из JS (document.cookie) для защиты от XSS!\n    'samesite' => 'Lax',    // Защита от CSRF-атак при переходах с чужих сайтов\n]);\n\n// 2. Удаление куки (установка времени истечения в прошлое с тем же path!)\nsetcookie('remember_token', '', ['expires' => 1, 'path' => '/']);","example":"$theme = $_COOKIE['theme'] ?? 'dark';","points":["Начиная с PHP 7.3+ функция setcookie() принимает удобный ассоциативный массив опций третьим аргументом вместо 7 позиционных параметров!","При удалении куки через expires => 1 обязательно передавай точно такой же параметр path => \"/\", с каким она создавалась, иначе браузер не удалит её!","Учитывай, что после вызова setcookie() новое значение появится в массиве $_COOKIE только при СЛЕДУЮЩЕМ HTTP-запросе от браузера."],"tags":["PHP","setcookie","COOKIE","httponly","samesite","secure","куки","авторизация"],"when":"Для функции «Запомнить меня», хранения идентификатора гостевой корзины и реферальных меток.","alternatives":"Не храни в открытых куках роль пользователя (role=admin) — клиент может легко подделать куку в DevTools! Храни роли в
