\n  place-items: center; /* Сокращение для align-items: center + justify-items: center */\n  min-height: 300px;\n}\n\n/* Наложение двух элементов друг на друга в одной ячейке без position: absolute! */\n.hero-stack {\n  display: grid;\n  place-items: center;\n}\n.hero-stack > * {\n  grid-area: 1 / 1;\n}","example":"margin: auto; /* Внутри display: flex или display: grid также центрирует дочерний блок! */","points":["display: grid; place-items: center; — самый лаконичный способ отцентрировать иконку в кнопке или карточку на экране.","Трюк grid-area: 1 / 1 для всех детей грида помещает фоновую картинку и текст в одну ячейку друг над другом без вырывания из потока через position: absolute!","Внутри флекс- или грид-контейнера дочернему элементу можно просто написать margin: auto для центрирования."],"tags":["CSS","place-items","place-content","align-items","justify-content","центрирование","grid"],"when":"Для центрирования иконок, заглушек пустых состояний (empty state), лоадеров и модалок.","alternatives":"Старое центрирование через position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) длиннее и вырывает блок из потока.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/place-items"},{"lang":"css","id":"css-text-decoration-underline","title":"CSS: красивое подчёркивание ссылок (text-underline-offset и text-decoration-thickness)","summary":"Тонкая настройка отступа, толщины и цвета линии подчёркивания текста без костылей с border-bottom.","code":"a {\n  color: #38bdf8;\n  text-decoration: underline;\n  text-decoration-color: rgba(56, 189, 248, 0.35);\n  text-decoration-thickness: 1.5px;\n  text-underline-offset: 4px; /* Опускает линию на 4px ниже базовой линии букв! */\n  transition: text-decoration-color 150ms ease;\n}\n\na:hover {\n  text-decoration-color: #38bdf8;\n}","example":"text-decoration-style: dashed; /* Пунктирное подчёркивание для тултипов и модальных ссылок */","points":["Раньше для красивого отступа линии под ссылкой приходилось отключать text-decoration и лепить border-bottom, который ломался на многострочных ссылках!","Свойство text-underline-offset: 4px аккуратно отодвигает нативное подчёркивание вниз и отлично работает даже если ссылка перенеслась на 2–3 строки.","Браузер по умолчанию включает text-decoration-skip-ink: auto, чтобы линия не перечёркивала нижние хвостики букв «р», «у», «д», «ц»."],"tags":["CSS","text-underline-offset","text-decoration","text-decoration-color","подчёркивание","ссылки","типографика"],"when":"Для всех текстовых ссылок в статьях, документации и навигации.","alternatives":"Анимированную линию, выезжающую слева направо, делают через background-image: linear-gradient(...) и background-size.","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/text-underline-offset"},{"lang":"css","id":"css-Sticky-table-header","title":"CSS: липкая шапка таблицы (sticky \u003cth>) и фиксированная первая колонка","summary":"Закрепление заголовков столбцов при вертикальной прокрутке больших таблиц данных и прайс-листов.","code":".table-scroll {\n  max-height: 420px;\n  overflow: auto;\n  border: 1px solid var(--line);\n}\n\ntable {\n  width: 100%;\n  border-collapse: separate; /* Важно для сохранения рамок у sticky-ячеек! */\n  border-spacing: 0;\n}\n\nthead th {\n  position: sticky;\n  top: 0;\n  z-index: 2;\n  background: #121827; /* Непрозрачный фон обязателен, чтобы строки не просвечивали */\n  border-bottom: 1px solid var(--line-strong);\n}","example":"tbody th:first-child {\n  position: sticky;\n  left: 0;\n  background: #0e1320;\n}","points":["При position: sticky на ячейках \u003cth> используй border-collapse: separate; border-spacing: 0 вместо border-collapse: collapse — иначе нижняя рамка шапки пропадёт при скролле!","Обязательно задай ячейкам \u003cth> плотный непрозрачный background, чтобы прокручиваемые строки таблицы не просвечивали сквозь шапку.","Аналогично через position: sticky; left: 0 можно зафиксировать первый столбец с названиями товаров при горизонтальном скролле на телефоне."],"tags":["CSS","table","sticky","thead","th","border-collapse","липкая шапка","таблица"],"when":"В админ-панелях, CRM, таблицах сравнения характеристик и финансовых отчётах.","alternatives":"Две отдельные таблицы (одна для шапки, вторая для тела) ломают совпадение ширины колонок.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/border-collapse"},{"lang":"css","id":"css-sr-only-visually-hidden","title":"CSS: доступное скрытие текста для скринридеров (.visually-hidden / .sr-only)","summary":"Стандартный паттерн скрытия подписи кнопки или заголовка секции для глаз с полным сохранением для голосового чтения.","code":".sr-only,\n.visually-hidden {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}","example":"\u003cbutton type=\"button\">\n  \u003csvg aria-hidden=\"true\">...\u003c/svg>\n  \u003cspan class=\"sr-only\">Удалить из избранного\u003c/span>\n\u003c/button>","points":["Обычные display: none и visibility: hidden полностью вырезают элемент и для глаз, и для программ экранного доступа (скринридеров)!","Класс .sr-only (screen reader only) сжимает текст до 1 пикселя без удаления из дерева доступности — незрячий пользователь услышит чёткую подпись кнопки.","Полезно также для ссылки «Перейти к основному контенту» (.skip-link:focus-visible), которая проявляется при первом нажатии Tab."],"tags":["CSS","sr-only","visually-hidden","accessibility","a11y","скринридер","скрыть элемент"],"when":"Для кнопок, содержащих только иконку, скрытых заголовков секций и таблиц.","alternatives":"На самой кнопке без текста можно также использовать атрибут aria-label=\"Удалить\".","url":"https://www.w3.org/WAI/tutorials/forms/labels/#note-on-hiding-elements"},{"lang":"css","id":"css-will-change-contain","title":"CSS: аппаратное ускорение и изоляция рендеринга (contain, content-visibility: auto)","summary":"Кратный прирост скорости отрисовки длинных страниц с сотнями карточек за счёт пропуска рендеринга вне экрана.","code":".catalog-card,\n.doc-section {\n  /* Браузер пропускает расчёт лейаута и отрисовку карточек, находящихся далеко за пределами экрана! */\n  content-visibility: auto;\n  /* Примерная высота карточки, чтобы ползунок скроллбара не прыгал */\n  contain-intrinsic-size: auto 260px;\n}","example":"/* Прирост скорости начальной отрисовки на длинных списках достигает 3–5 раз! */","points":["content-visibility: auto — одно из самых мощных свойств современного CSS: браузер не тратит ресурсы на рендеринг блоков, пока пользователь не подскроллит к ним!","Свойство contain-intrinsic-size: auto 260px сообщает браузеру ориентировочную высоту скрытого блока, чтобы общая высота страницы оставалась точной.","Свойство will-change: transform ставь точечно только на элементы, которые реально постоянно двигаются (иначе переполнится видеопамять GPU)."],"tags":["CSS","content-visibility","contain-intrinsic-size","contain","will-change","производительность","оптимизация"],"when":"На длинных страницах документации, лендингах с 10+ секциями и больших списках карточек.","alternatives":"Виртуализация списков на JS (Virtual Scroll) сложнее и ломает встроенный поиск по странице Ctrl+F.","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/content-visibility"},{"lang":"html","id":"html-a-download-rel","title":"HTML: атрибут rel (noopener, noreferrer, nofollow, sponsored, preload)","summary":"Управление безопасностью внешних ссылок, передачей реферера, SEO-весом рекламных ссылок и предзагрузкой.","code":"\u003c!-- Безопасная внешняя ссылка без передачи window.opener -->\n\u003ca href=\"https://example.com\" target=\"_blank\" rel=\"noopener noreferrer\">Внешний ресурс\u003c/a>\n\n\u003c!-- Ссылка в комментариях пользователей или партнёрский блок (для SEO) -->\n\u003ca href=\"https://partner.ru\" rel=\"nofollow sponsored\">Партнёрский материал\u003c/a>","example":"\u003clink rel=\"canonical\" href=\"https://devshelf.ru/docs\">","points":["rel=\"noopener\" защищает страницу от перехвата управления вкладкой через window.opener при target=\"_blank\".","rel=\"noreferrer\" дополнительно скрывает адрес твоего сайта в заголовке Referer при переходе по внешней ссылке.","rel=\"nofollow\" и rel=\"ugc\" указывают поисковым роботам не передавать ссылочный вес ссылкам из пользовательских комментариев."],"tags":["HTML","rel","noopener","noreferrer","nofollow","sponsored","canonical","ссылки","seo"],"when":"На всех внешних ссылках, рекламных интеграциях и ссылках из пользовательского контента.","alternatives":"Современные браузеры автоматически подразумевают noopener при target=\"_blank\", но явное указание остаётся стандартом.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Attributes/rel"},{"lang":"html","id":"html-img-srcset-sizes","title":"HTML: адаптивные изображения srcset и sizes для экранов Retina (2x, 3x)","summary":"Автоматический выбор браузером оптимального размера картинки под плотность пикселей и ширину экрана смартфона.","code":"\u003cimg\n  src=\"/img/card-800.webp\"\n  srcset=\"\n    /img/card-400.webp 400w,\n    /img/card-800.webp 800w,\n    /img/card-1200.webp 1200w\n  \"\n  sizes=\"(max-width: 640px) 100vw, (max-width: 1024px) 50vw, 400px\"\n  alt=\"Превью проекта\"\n  width=\"400\"\n  height=\"300\"\n  loading=\"lazy\"\n>","example":"\u003cimg src=\"logo-1x.png\" srcset=\"logo-1x.png 1x, logo-2x.png 2x\" alt=\"Логотип\">","points":["Дескрипторы ширины (400w, 800w) в srcset сообщают браузеру реальную ширину каждого файла в пикселях до его скачивания.","Атрибут sizes подсказывает браузеру, какую ширину на экране займёт картинка в текущей сетке колонок.","Для фиксированных элементов (логотипы, иконки) используй дескрипторы плотности пикселей: 1x, 2x."],"tags":["HTML","srcset","sizes","retina","img","webp","адаптивные картинки"],"when":"Для контентных фотографий в каталогах, карточках блога и баннерах.","alternatives":"Если нужно полностью сменить кадрирование (например, вертикальное фото на телефоне и горизонтальное на ПК), используй тег \u003cpicture>.","url":"https://developer.mozilla.org/ru/docs/Learn_web_development/Core/Structuring_content/Responsive_images"},{"lang":"html","id":"html-input-file-accept","title":"HTML: выбор файлов \u003cinput type=\"file\"> (accept, multiple, capture)","summary":"Фильтрация разрешённых форматов файлов в проводнике и прямой вызов камеры смартфона для фото документа.","code":"\u003c!-- Выбор нескольких изображений в формате PNG, JPG или WebP -->\n\u003clabel class=\"upload-zone\">\n  \u003cspan>Выберите фотографии или перетащите сюда\u003c/span>\n  \u003cinput\n    type=\"file\"\n    name=\"photos[]\"\n    accept=\"image/png, image/jpeg, image/webp\"\n    multiple\n  >\n\u003c/label>\n\n\u003c!-- Вызов камеры смартфона напрямую для сканирования документа -->\n\u003cinput type=\"file\" accept=\"image/*\" capture=\"environment\">","example":"accept=\".pdf,.docx,application/pdf\"","points":["Атрибут accept=\"image/png, image/jpeg\" делает неактивными все неподходящие файлы в системном окне выбора.","Для загрузки сразу нескольких файлов на сервер в PHP имя инпута должно заканчиваться квадратными скобками: name=\"photos[]\" и атрибут multiple.","capture=\"environment\" на телефонах сразу открывает заднюю камеру, а capture=\"user\" — фронтальную селфи-камеру."],"tags":["HTML","file","accept","multiple","capture","upload","загрузка файла","камера"],"when":"В формах загрузки аватара, прикрепления документов, чеков и галерей.","alternatives":"Не забывай дублировать проверку MIME-типа на сервере через PHP finfo, так как фильтр accept можно обойти.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Element/input/file"},{"lang":"html","id":"html-contenteditable-spellcheck","title":"HTML: редактируемые блоки contenteditable, spellcheck и translate=\"no\"","summary":"Превращение любого HTML-элемента в визуальный редактор текста и управление автопереводом брендов и кода.","code":"\u003c!-- Инлайн-редактируемый заголовок документа (как в Notion) -->\n\u003ch2 contenteditable=\"plaintext-only\" spellcheck=\"true\">\n  Нажмите, чтобы переименовать проект\n\u003c/h2>\n\n\u003c!-- Запрет автопереводчику браузера ломать названия брендов и код -->\n\u003ccode translate=\"no\">justify-content: space-between\u003c/code>","example":"\u003cinput type=\"text\" spellcheck=\"false\" autocapitalize=\"off\" autocomplete=\"off\">","points":["Современное значение contenteditable=\"plaintext-only\" разрешает редактировать текст, но при вставке из буфера обмена автоматически очищает чужие шрифты и стили!","Атрибут translate=\"no\" защищает логотипы, имена переменных, команды терминала и фрагменты кода от искажения встроенным переводчиком Chrome/Яндекс.","На полях логина, email и поиска кода ставь spellcheck=\"false\", чтобы браузер не подчёркивал никнеймы красной волнистой линией."],"tags":["HTML","contenteditable","plaintext-only","spellcheck","translate","редактор","автоперевод"],"when":"Для быстрых редактируемых заметок, заголовков досок задач и блоков кода.","alternatives":"Для обычных полей ввода в формах всегда предпочтительнее стандартные \u003cinput> и \u003ctextarea>.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Global_attributes/contenteditable"},{"lang":"html","id":"html-noscript-base-meta-refresh","title":"HTML: служебные теги \u003chead> (\u003cbase>, \u003cnoscript>, http-equiv, color-scheme)","summary":"Системная поддержка светлой/тёмной темы контролов браузера, фолбэк без JS и базовый URL документа.","code":"\u003chead>\n  \u003c!-- Сообщает браузеру тему страницы ещё до загрузки CSS (перекрашивает фон и скроллбары!) -->\n  \u003cmeta name=\"color-scheme\" content=\"dark light\">\n\n  \u003c!-- Предупреждение на случай отключённого JavaScript -->\n  \u003cnoscript>\n    \u003cdiv class=\"alert\">Для работы интерактивной песочницы включите JavaScript.\u003c/div>\n  \u003c/noscript>\n\u003c/head>","example":"\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self'\">","points":["\u003cmeta name=\"color-scheme\" content=\"dark light\"> мгновенно переключает системный фон браузера, полосы прокрутки и поля форм в тёмный режим без белой вспышки при загрузке!","Тег \u003cnoscript> рендерит своё содержимое только если в браузере пользователя выключен или заблокирован JavaScript.","Тег \u003cbase href=\"https://example.com/app/\"> меняет базовый путь для всех относительных ссылок на странице (используй с осторожностью, так как он влияет и на якорные ссылки #anchor)."],"tags":["HTML","color-scheme","noscript","base","http-equiv","csp","head","тёмная тема"],"when":"Метатег color-scheme рекомендуется добавлять во все проекты с поддержкой тёмной темы.","alternatives":"Редиректы лучше делать через HTTP-статус 301/302 на сервере, а не через устаревший \u003cmeta http-equiv=\"refresh\">.","url":"https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta/name"},{"lang":"css","id":"css-attribute-selectors","title":"CSS: селекторы по атрибутам ([href^=\"https\"], [href$=\".pdf\"], [data-*])","summary":"Автоматическая стилизация внешних ссылок, ссылок на скачивание документов и состояний компонентов без лишних классов.","code":"/* Все внешние ссылки, начинающиеся с https:// */\na[href^=\"https://\"]:not([href*=\"devshelf.ru\"])::after {\n  content: \" ↗\";\n}\n\n/* Все ссылки, заканчивающиеся на .pdf или .zip */\na[href$=\".pdf\"]::before {\n  content: \"📄 \";\n}\n\n/* Поиск подстроки в любом месте атрибута без учёта регистра (флаг i) */\nimg[src*=\".svg\" i] {\n  display: inline-block;\n}","example":"[aria-expanded=\"true\"] .chevron { rotate: 180deg; }","points":["[attr^=\"val\"] проверяет начало строки, [attr$=\"val\"] — конец строки, а [attr*=\"val\"] — вхождение подстроки в любом месте!","Флаг i перед закрывающей скобкой ([href$=\".pdf\" i]) делает проверку нечувствительной к регистру (.PDF и .pdf).","Привязка стилей к ARIA-состояниям ([aria-selected=\"true\"], [aria-expanded=\"true\"]) избавляет от рассинхрона между визуальным классом .active и доступностью."],"tags":["CSS","attribute selectors","href","data","aria","селекторы атрибутов","ссылки"],"when":"Для автоматической маркировки внешних ссылок, файлов для скачивания и стилизации ARIA-компонентов.","alternatives":"Ручное проставление класса .external-link на каждой ссылке в статьях легко забыть.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/Attribute_selectors"},{"lang":"css","id":"css-combinators","title":"CSS: комбинаторы селекторов (>, +, ~) и паттерн «Лоботомированная сова» (* + *)","summary":"Точный выбор непосредственных детей, следующего соседа и автоматические отступы между блоками статьи.","code":"/* Только прямые дочерние li первого уровня (не трогая вложенные подменю) */\n.menu > li {\n  padding-inline: 12px;\n}\n\n/* Классический ритм статьи: отступ сверху у каждого элемента, за которым кто-то идёт (* + *) */\n.prose > * + * {\n  margin-top: 1em;\n}\n\n/* Подпись сразу после заголовка h2 имеет уменьшенный отступ */\n.prose > h2 + p {\n  margin-top: 0.4em;\n}","example":"input:checked + .slider-thumb { translate: 20px 0; }","points":["Комбинатор > выбирает только прямых детей (первый уровень вложенности), защищая вложенные компоненты от протечки стилей.","Комбинатор + (следующий сосед) выбирает элемент, который идёт СРАЗУ после первого (идеально для связки input:checked + label и h2 + p).","Паттерн .prose > * + * задаёт верхний отступ всем элементам внутри статьи, кроме самого первого, создавая идеальный вертикальный ритм!"],"tags":["CSS","combinators","child","sibling","owl","комбинаторы","соседний селектор","ритм"],"when":"При оформлении текстовых статей (.prose), кастомных переключателей (checkbox + span) и многоуровневых меню.","alternatives":"Для одномерных списков карточек и кнопок проще использовать display: flex; flex-direction: column; gap: 16px.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/CSS_selectors/Selectors_and_combinators"},{"lang":"css","id":"css-min-max-fit-content","title":"CSS: адаптивные ключевые слова размеров (min-content, max-content, fit-content)","summary":"Подстройка ширины блока ровно под длину текста внутри него без растягивания на всю ширину родителя.","code":".section-badge {\n  /* Блок сжимается ровно по ширине текста, но не шире 100% экрана на мобильном! */\n  width: fit-content;\n  padding: 4px 12px;\n  border: 1px solid var(--line);\n}\n\n.pricing-grid {\n  display: grid;\n  /* Первая колонка ровно по ширине самой длинной подписи, вторая забирает остаток */\n  grid-template-columns: max-content 1fr;\n}","example":"width: fit-content;\nmargin-inline: auto; /* Центрирует блок по ширине его контента без inline-block! */","points":["width: fit-content — волшебное свойство: блок обтягивает свой текст как inline-block, но при этом остаётся блочным (его можно отцентрировать через margin-inline: auto) и переносит строки, если экран уже текста!","max-content разворачивает текст в одну длинную строку без переносов (удобно для колонок с датами и ценами в гриде).","min-content сжимает блок до ширины самого длинного слова внутри него."],"tags":["CSS","fit-content","max-content","min-content","width","размеры","центрирование"],"when":"Для бейджей, тегов, центрируемых заголовков с рамкой, цитат и колонок CSS Grid.","alternatives":"display: inline-block не позволяет отцентрировать сам элемент через margin: 0 auto без text-align на родителе.","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/fit-content"},{"lang":"css","id":"css-blend-modes-masks","title":"CSS: режимы наложения (mix-blend-mode) и градиентные маски затухания (mask-image)","summary":"Плавное растворение краёв прокручиваемого списка или кода в прозрачность на любом фоне.","code":"/* Плавное растворение правого края длинной строки табов или кода в прозрачность */\n.scroll-fade-right {\n  -webkit-mask-image: linear-gradient(to right, #000 85%, transparent 100%);\n  mask-image: linear-gradient(to right, #000 85%, transparent 100%);\n}\n\n/* Плавное растворение текста снизу в превью статьи */\n.article-preview {\n  mask-image: linear-gradient(to bottom, #000 60%, transparent 100%);\n}","example":"mix-blend-mode: overlay; /* Наложение текстуры или свечения на фон */","points":["Почему mask-image лучше наложенного поверх градиента? Потому что mask-image делает прозрачным сам элемент, и под ним может быть любой сложный фон, картинка или смена темы оформления!","Внутри mask-image чёрный цвет (#000, непрозрачный) означает 100% видимую область, а transparent — полностью скрытую.","Свойство mix-blend-mode: multiply позволяет мгновенно убрать белый фон у логотипа на светлой странице."],"tags":["CSS","mask-image","mix-blend-mode","background-blend-mode","маска","затухание","прозрачность"],"when":"Для горизонтальных списков табов, превью заблокированных статей и каруселей логотипов.","alternatives":"Костыль с position: absolute и градиентом в цвет фона ломается при переключении тёмной/светлой темы.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/mask-image"},{"lang":"css","id":"css-property-houdini","title":"CSS: типизированные переменные @property (плавная анимация градиентов и чисел)","summary":"Регистрация типа CSS-переменной (\u003cangle>, \u003ccolor>, \u003clength>), позволяющая плавно анимировать градиенты в браузере.","code":"@property --gradient-angle {\n  syntax: '\u003cangle>';\n  initial-value: 0deg;\n  inherits: false;\n}\n\n.animated-border {\n  background: conic-gradient(from var(--gradient-angle), #38bdf8, #818cf8, #38bdf8);\n  animation: spin-angle 4s linear infinite;\n}\n\n@keyframes spin-angle {\n  to { --gradient-angle: 360deg; }\n}","example":"/* Без @property браузер считает переменную обычной строкой и не может плавно менять её от 0deg до 360deg */","points":["По умолчанию CSS-переменные не имеют типа, поэтому браузер не умеет плавно интерполировать их внутри linear-gradient или conic-gradient.","Директива @property сообщает движку CSS точный тип переменной (\u003cangle>, \u003ccolor>, \u003cpercentage>, \u003cnumber>), открывая полноценную анимацию через transition и @keyframes!","Параметр initial-value обязателен при объявлении @property."],"tags":["CSS","@property","houdini","custom properties","переменные","анимация градиента","conic-gradient"],"when":"Для анимированных градиентных рамок, плавной смены цветов градиента при ховере и круговых прогресс-баров.","alternatives":"Вращение огромного псевдоэлемента ::before через transform: rotate(360deg) требует overflow: hidden.","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/@property"},{"lang":"css","id":"css-starting-style-discrete","title":"CSS: плавная анимация появления из display: none (@starting-style и allow-discrete)","summary":"Современный стандарт CSS для плавного открытия и закрытия модальных окон \u003cdialog> и поповеров без JS-таймеров.","code":"dialog {\n  opacity: 0;\n  transform: scale(0.95);\n  transition:\n    opacity 200ms ease,\n    transform 200ms ease,\n    display 200ms allow-discrete,\n    overlay 200ms allow-discrete;\n}\n\ndialog[open] {\n  opacity: 1;\n  transform: scale(1);\n\n  /* Начальная точка анимации в момент перехода из display: none в открытое состояние! */\n  @starting-style {\n    opacity: 0;\n    transform: scale(0.95);\n  }\n}","example":"/* Позволяет плавно анимировать и открытие, и закрытие нативного \u003cdialog> и [popover] */","points":["Раньше элемент, появляющийся из display: none, прыгал мгновенно без transition. Правило @starting-style задаёт стартовые стили первого кадра появления!","Ключевое слово transition-behavior: allow-discrete удерживает элемент в DOM на время анимации закрытия (200ms), прежде чем применить display: none.","Свойство overlay в списке transition удерживает модалку в верхнем слое (#top-layer) до конца плавного затухания."],"tags":["CSS","@starting-style","allow-discrete","dialog","popover","анимация появления","display none"],"when":"При стилизации нативных модальных окон \u003cdialog>, выпадающих меню [popover] и добавляемых в DOM карточек.","alternatives":"Для старых браузеров используют покадровую анимацию animation: fadeIn 200ms ease.","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/@starting-style"},{"lang":"javascript","id":"js-reduce-flatmap","title":"JS: агрегация данных (.reduce) и плоская трансформация (.flatMap)","summary":"Подсчёт общей суммы корзины товаров, сборка словаря по ID и разворачивание вложенных массивов за один проход.","code":"const cart = [\n  { id: 1, title: 'Клавиатура', price: 4500, qty: 1, tags: ['usb', 'mech'] },\n  { id: 2, title: 'Мышь',       price: 2200, qty: 2, tags: ['usb', 'wireless'] }\n];\n\n// Подсчёт итоговой стоимости корзины (всегда передавай начальное значение 0!)\nconst total = cart.reduce((sum, item) => sum + item.price * item.qty, 0); // 8900\n\n// Сбор всех тегов из всех товаров в один плоский массив\nconst allTags = cart.flatMap(item => item.tags); // ['usb', 'mech', 'usb', 'wireless']","example":"const byId = cart.reduce((acc, item) => ({ ...acc, [item.id]: item }), {});","points":["В метод .reduce(fn, initialValue) ВСЕГДА передавай второй аргумент (например, 0 или {}), иначе на пустом массиве [] вызов упадёт с TypeError!","Метод .flatMap(fn) работает как комбинация .map() + .flat(1), но быстрее за один проход (также позволяет одновременно фильтровать и мапить, возвращая [] для пропуска элемента!).","Для простой группировки элементов по полю в современном JS лучше использовать нативный Object.groupBy(items, fn) вместо сложного reduce."],"tags":["JavaScript","reduce","flatMap","flat","корзина","сумма","агрегация","массивы"],"when":"При расчёте итогов заказа, статистики дашборда и извлечении вложенных списков тегов или комментариев.","alternatives":"Если reduce становится нечитаемым на 15 строк, обычный цикл for (const item of items) будет понятнее коллегам.","url":"https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/Array/reduce"},{"lang":"javascript","id":"js-classes-private-fields","title":"JS: классы ES2022+, приватные поля (#field), геттеры и статические методы","summary":"Настоящая инкапсуляция состояния через синтаксис решётки #private без утечки внутренних свойств наружу.","code":"class TokenStore {\n  // Настоящее приватное поле: недоступно снаружи класса!\n  #token = null;\n\n  constructor(initialToken) {\n    this.#token = initialToken;\n  }\n\n  get isAuthenticated() {\n    return Boolean(this.#token);\n  }\n\n  clear() {\n    this.#token = null;\n  }\n}\n\nconst store = new TokenStore('secret_jwt');\nconsole.log(store.isAuthenticated); // true","example":"static fromJson(jsonStr) { return new User(JSON.parse(jsonStr)); }","points":["Поля и методы, начинающиеся с символа # (например, #token, #validate()), защищены на уровне движка JS — к ним нельзя обратиться снаружи даже через точку.","Геттеры (get propName()) позволяют вычислять свойство на лету при чтении без круглых скобок: store.isAuthenticated.","Поля класса теперь можно объявлять прямо в теле класса сверху без обязательного конструктора."],"tags":["JavaScript","class","private","#field","get","set","static","ооп","классы"],"when":"При написании UI-компонентов, сторов состояния, API-клиентов и игровых сущностей.","alternatives":"Для небольших утилит без внутреннего состояния достаточно обычных экспортируемых функций или замыканий.","url":"https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Classes/Private_properties"},{"lang":"javascript","id":"js-date-timestamps","title":"JS: работа с датами (Date.now, toISOString, сравнение и разница дат)","summary":"Хранение времени в UTC, вычисление разницы между датами в днях/часах и проверка истечения срока.","code":"const nowMs = Date.now(); // Текущий таймстамп в миллисекундах\nconst isoString = new Date().toISOString(); // \"2026-09-15T11:30:00.000Z\" (стандарт для БД и API)\n\n// Прибавление 7 дней к текущей дате\nconst nextWeek = new Date();\nnextWeek.setDate(nextWeek.getDate() + 7);\n\n// Разница между двумя датами в полных сутках\nconst diffMs = nextWeek - new Date();\nconst diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24)); // 7","example":"const isExpired = new Date(order.expiresAt).getTime() \u003c Date.now();","points":["Осторожно: в конструкторе new Date(2026, 0, 15) месяцы нумеруются с нуля (0 — январь, 11 — декабрь), а дни недели в getDay() начинаются с воскресенья (0)!","Для передачи дат между фронтендом и сервером всегда используй строку ISO 8601 (date.toISOString()) или Unix-таймстамп.","Для красивого вывода даты пользователю на русском языке используй new Intl.DateTimeFormat(\"ru-RU\").format(date)."],"tags":["JavaScript","Date","Date.now","toISOString","timestamp","дата","время","таймер"],"when":"В таймерах обратного отсчёта акций, проверке свежести кэша и фильтрах по диапазону дат.","alternatives":"При сложной работе с часовыми поясами используют Intl.DateTimeFormat с опцией timeZone: \"Europe/Moscow\".","url":"https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/Date"},{"lang":"javascript","id":"js-keyboard-shortcuts","title":"JS: обработка горячих клавиш (keydown, e.key, Ctrl+K / Cmd+K и Esc)","summary":"Профессиональная настройка глобальных шорткатов с кроссплатформенной поддержкой Windows/Linux (Ctrl) и macOS (Cmd).","code":"window.addEventListener('keydown', (e) => {\n  // Поддержка и Ctrl+K (Windows/Linux), и Cmd+K (macOS)\n  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {\n    e.preventDefault(); // Отменяем стандартный фокус браузера в адресную строку\n    openCommandPalette();\n  }\n\n  // Одиночная клавиша \"/\" для фокуса в поиск (только если курсор уже не стоит в input!)\n  const isTyping = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)\n                || document.activeElement?.isContentEditable;\n\n  if (!isTyping && e.key === '/') {\n    e.preventDefault();\n    searchInput.focus();\n  }\n});","example":"if (e.key === 'Escape') closeModal();","points":["Всегда используй современное свойство e.key (\"Escape\", \"Enter\", \"ArrowDown\", \"k\") вместо давно устаревшего числового e.keyCode!","Для комбинаций вроде Ctrl+K обязательно проверяй (e.ctrlKey || e.metaKey), чтобы шорткат одинаково работал и на ПК, и на Mac.","Для одиночных горячих клавиш (\"/\", \"t\", \"?\") обязательно проверяй, что фокус сейчас НЕ находится внутри \u003cinput> или \u003ctextarea>, иначе пользователь не сможет напечатать эту букву в форме!"],"tags":["JavaScript","keydown","key","ctrlKey","metaKey","Escape","Enter","горячие клавиши","шорткаты"],"when":"Для командной палитры (Ctrl+K), быстрого поиска (/), закрытия окон (Esc) и навигации стрелками.","alternatives":"Для нативного \u003cdialog> закрытие по клавише Escape уже встроено в браузер по умолчанию.","url":"https://developer.mozilla.org/ru/docs/Web/API/KeyboardEvent/key"},{"lang":"javascript","id":"js-matchmedia-network-visibility","title":"JS: системные события браузера (matchMedia, visibilitychange, online/offline)","summary":"Реакция скрипта на смену размера экрана, сворачивание вкладки пользователем и потерю интернет-соединения.","code":"// 1. Слушатель медиазапроса в JS (срабатывает только при переходе через брейкпоинт 768px!)\nconst mq = window.matchMedia('(max-width: 768px)');\nmq.addEventListener('change', (e) => {\n  if (!e.matches) closeMobileDrawer();\n});\n\n// 2. Пауза видео или опроса сервера, когда пользователь переключился на другую вкладку\ndocument.addEventListener('visibilitychange', () => {\n  if (document.hidden) pausePolling();\n  else resumePolling();\n});\n\n// 3. Индикатор потери и восстановления сети\nwindow.addEventListener('offline', () => showBanner('Нет подключения к сети'));\nwindow.addEventListener('online',  () => hideBanner());","example":"const isMobile = window.matchMedia('(max-width: 768px)').matches;","points":["window.matchMedia(\"(max-width: 768px)\") намного эффективнее события window.onresize: он вызывает колбэк ровно в тот момент, когда экран перешагнул порог 768px, а не на каждый пиксель движения мыши!","Событие visibilitychange позволяет экономить батарею ноутбука и смартфона, ставя на паузу тяжёлые анимации и таймеры на фоновых вкладках.","События online и offline незаменимы в PWA и редакторах документов для уведомления о работе из кэша."],"tags":["JavaScript","matchMedia","visibilitychange","online","offline","navigator","сеть","вкладка"],"when":"При закрытии мобильного меню на ресайзе, фоновом опросе API и индикации офлайн-режима.","alternatives":"Отправка аналитики при закрытии вкладки делается через navigator.sendBeacon(\"/api/stats\", data) внутри visibilitychange.","url":"https://developer.mozilla.org/ru/docs/Web/API/Window/matchMedia"},{"lang":"php","id":"php-pdo-select-in-pagination","title":"PHP 8 & PDO: выборка по списку ID (WHERE IN), LIKE-поиск и пагинация (LIMIT / OFFSET)","summary":"Безопасная генерация плейсхолдеров для оператора IN (...), поиск по подстроке и постраничная навигация.","code":"\u003c?php\ndeclare(strict_types=1);\n\n// 1. Безопасный поиск по подстроке LIKE (проценты % добавляются к значению в PHP, а не в SQL!)\n$stmt = $pdo->prepare('SELECT id, title FROM articles WHERE title LIKE :query LIMIT :limit OFFSET :offset');\n$stmt->bindValue(':query', '%' . $search . '%', PDO::PARAM_STR);\n$stmt->bindValue(':limit', 20, PDO::PARAM_INT);\n$stmt->bindValue(':offset', ($page - 1) * 20, PDO::PARAM_INT);\n$stmt->execute();\n$articles = $stmt->fetchAll();\n\n// 2. Безопасная выборка по массиву ID: WHERE id IN (?, ?, ?)\n$ids = [10, 25, 42];\n$placeholders = implode(',', array_fill(0, count($ids), '?'));\n$stmtIn = $pdo->prepare(\"SELECT * FROM products WHERE id IN ($placeholders)\");\n$stmtIn->execute($ids);","example":"$totalCount = (int) $pdo->query('SELECT COUNT(*) FROM articles')->fetchColumn();","points":["В подготовленных запросах PDO нельзя привязать целый массив к одному плейсхолдеру IN (:ids). Правильный паттерн — сгенерировать строку знаков вопроса через implode(\",\", array_fill(0, count($ids), \"?\"))!","При поиске через LIKE знаки процентов \"%\" склеиваются с переменной внутри PHP (\"%\" . $q . \"%\") и передаются в плейсхолдер.","Метод $stmt->fetchColumn() удобно возвращает одно скалярное значение первого столбца (например, результат SELECT COUNT(*))."],"tags":["PHP","PDO","WHERE IN","LIKE","LIMIT","OFFSET","fetchColumn","пагинация","поиск в бд"],"when":"В каталогах товаров с пагинацией, поиске по базе и выборке товаров корзины по массиву ID.","alternatives":"Перед выполнением запроса с WHERE IN обязательно проверь, что массив $ids не пустой (if (!$ids) return [];), иначе SQL выдаст ошибку на пустых скобках IN ().","url":"https://www.php.net/manual/ru/pdostatement.bindvalue.php"},{"lang":"php","id":"php-headers-redirects-cors","title":"PHP 8: HTTP-заголовки (header), редиректы 301/302, CORS и скачивание файлов","summary":"Правильное выполнение перенаправлений с обязательным exit, настройка междоменных запросов CORS и отдача PDF/CSV.","code":"\u003c?php\ndeclare(strict_types=1);\n\n// 1. Безопасный редирект после успешной отправки формы (паттерн Post/Redirect/Get)\nheader('Location: /profile?saved=1', true, 303);\nexit; // ОБЯЗАТЕЛЬНО вызывай exit после header('Location: ...')!\n\n// 2. Разрешение CORS-запросов для фронтенда с другого домена/порта\nheader('Access-Control-Allow-Origin: https://app.example.com');\nheader('Access-Control-Allow-Methods: GET, POST, OPTIONS');\nheader('Access-Control-Allow-Headers: Content-Type, Authorization');\nif ($_SERVER['REQUEST_METHOD'] === 'OPTIONS') {\n    http_response_code(204);\n    exit;\n}","example":"header('Content-Disposition: attachment; filename=\"report.csv\"');","points":["Самая опасная ошибка в PHP — забыть написать exit; сразу после header(\"Location: /login\")! Без exit скрипт продолжит выполняться дальше и отдаст закрытый контент.","Функция header() должна вызываться ДО любого вывода текста, пробелов или HTML в браузер (иначе возникнет ошибка Headers already sent).","Паттерн Post/Redirect/Get (редирект после обработки POST-формы) защищает от повторной отправки формы при нажатии клавиши F5."],"tags":["PHP","header","Location","redirect","CORS","http_response_code","редирект","заголовки"],"when":"При проверке авторизации, редиректах после сохранения форм и настройке REST API.","alternatives":"Для постоянных SEO-редиректов старых страниц передавай код 301: header(\"Location: /new-url\", true, 301); exit;.","url":"https://www.php.net/manual/ru/function.header.php"},{"lang":"php","id":"php-env-config-errors","title":"PHP 8: переменные окружения (getenv / $_ENV), логирование и скрытие ошибок в продакшене","summary":"Безопасное хранение паролей БД вне Git-репозитория и перехват фатальных ошибок через Throwable.","code":"\u003c?php\ndeclare(strict_types=1);\n\n// На продакшене НИКОГДА не показываем стектрейс ошибок пользователю на экран!\nini_set('display_errors', '0');\nini_set('log_errors', '1');\nerror_reporting(E_ALL);\n\n// Чтение секретов из переменных окружения со значением по умолчанию\n$dbHost = $_ENV['DB_HOST'] ?? getenv('DB_HOST') ?: '127.0.0.1';\n\n// Глобальный перехватчик любых исключений и ошибок типизации (TypeError, Error)\nset_exception_handler(function (Throwable $e): void {\n    error_log(sprintf('[%s] %s in %s:%d', get_class($e), $e->getMessage(), $e->getFile(), $e->getLine()));\n    http_response_code(500);\n    echo 'Произошла ошибка сервера. Попробуйте позже.';\n});","example":"/* Обязательно добавь файл .env в .gitignore, чтобы пароли от БД не попали на GitHub! */","points":["В PHP 7/8 базовый интерфейс Throwable ловит сразу всё: и обычные исключения (Exception), и фатальные ошибки движка (Error, TypeError, ParseError)!","На боевом сервере всегда выключай вывод ошибок на экран (display_errors = 0), чтобы не раскрыть посетителям пути к файлам и структуру SQL-таблиц.","Пароли от базы данных и ключи API храни в файле .env (добавленном в .gitignore) или переменных окружения сервера."],"tags":["PHP","Throwable","try","catch","error_log","getenv","env","display_errors","логирование","ошибки"],"when":"Во входном файле index.php или bootstrap.php каждого проекта.","alternatives":"На этапе локальной разработки включай display_errors = 1 для быстрой отладки.","url":"https://www.php.net/manual/ru/language.errors.php7.php"},{"lang":"php","id":"php-preg-match-validation","title":"PHP 8: регулярные выражения (preg_match, preg_replace) с поддержкой кириллицы (/u)","summary":"Проверка формата телефона, слага и очистка строк по шаблону с обязательным модификатором Юникода /u.","code":"\u003c?php\ndeclare(strict_types=1);\n\n// Модификатор /u в конце регулярки ОБЯЗАТЕЛЕН для корректной работы с русскими буквами UTF-8!\n$isValidName = (bool) preg_match('/^[а-яёa-zs-]{2,40}$/iu', $inputName);\n\n// Очистка номера телефона от скобок, пробелов и дефисов (оставляем только цифры)\n$cleanPhone = preg_replace('/D+/', '', '+7 (999) 123-45-67'); // \"79991234567\"\n\n// Извлечение именованных групп (?\u003cyear>d{4})\nif (preg_match('/^(?\u003cyear>d{4})-(?\u003cmonth>d{2})$/', '2026-09', $matches)) {\n    echo $matches['year']; // \"2026\"\n}","example":"$slug = trim(preg_replace('/[^a-z0-9]+/', '-', strtolower($str)), '-');","points":["При работе с кириллицей в регулярных выражениях PHP всегда ставь модификатор u после закрывающего слэша (/.../iu), иначе классы символов и регистр сломаются на UTF-8!","Не забывай добавлять букву «ё» отдельно в диапазон [а-яё], так как в таблице символов UTF-8 буква «ё» стоит отдельно от диапазона «а–я»!","Именованные карманы (?\u003cname>...) делают массив совпадений $matches самодокументируемым."],"tags":["PHP","preg_match","preg_replace","regex","регулярные выражения","кириллица","телефон","валидация"],"when":"При нормализации номеров телефонов, проверке промокодов, парсинге параметров и генерации ЧПУ (slug).","alternatives":"Для простой замены фиксированной подстроки всегда используй быстрый str_replace() вместо preg_replace().","url":"https://www.php.net/manual/ru/function.preg-match.php"},{"lang":"html","id":"html-header-footer","title":"HTML: шапка \u003cheader> и подвал \u003cfooter> страницы и карточки","summary":"Вводная и завершающая области как для всей веб-страницы, так и внутри отдельных карточек \u003carticle>.","code":"\u003cheader class=\"site-header\">\n  \u003ca href=\"/\" class=\"logo\">DevShelf\u003c/a>\n  \u003cnav aria-label=\"Главное меню\">...\u003c/nav>\n\u003c/header>\n\n\u003carticle class=\"post-card\">\n  \u003cheader>\n    \u003ch2>Заголовок публикации\u003c/h2>\n    \u003ctime datetime=\"2026-09-15\">15.09.2026\u003c/time>\n  \u003c/header>\n  \u003cp>Текст заметки...\u003c/p>\n  \u003cfooter>\n    \u003cspan>Автор: Павел\u003c/span> · \u003ca href=\"#comments\">12 комментариев\u003c/a>\n  \u003c/footer>\n\u003c/article>","example":"\u003cfooter class=\"site-footer\">&copy; 2026 Все права защищены\u003c/footer>","points":["Теги \u003cheader> и \u003cfooter> можно использовать многократно на одной странице: один раз для шапки/подвала всего сайта и внутри каждого \u003carticle> или \u003csection>!","Нельзя вкладывать \u003cheader> внутрь другого \u003cheader> или внутрь \u003cfooter>.","\u003cheader> верхнего уровня (прямой ребёнок \u003cbody>) автоматически получает ориентир role=\"banner\" для скринридеров, а \u003cfooter> — role=\"contentinfo\"."],"tags":["HTML","header","footer","шапка","подвал","футер","хедер","семантика"],"when":"Для главной шапки и подвала сайта, а также верхней и нижней плашек карточек и модальных окон.","alternatives":"Не используй \u003cdiv class=\"header\"> там, где подходит нативный \u003cheader>.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/header"},{"lang":"html","id":"html-span-div","title":"HTML: универсальные контейнеры \u003cdiv> (блочный) и \u003cspan> (строчный)","summary":"Нейтральные обёртки без собственной семантики для группировки элементов под CSS-сетки и точечной стилизации слов.","code":"\u003cdiv class=\"grid-row\">\n  \u003cdiv class=\"col\">Левая колонка сетки\u003c/div>\n  \u003cdiv class=\"col\">Правая колонка сетки\u003c/div>\n\u003c/div>\n\n\u003cp>\n  Статус сервера: \u003cspan class=\"status-online\">● Работает штатно\u003c/span>\n\u003c/p>","example":"\u003cspan class=\"accent-text\">выделенное цветом слово\u003c/span>","points":["\u003cdiv> — блочный контейнер (занимает всю доступную ширину и начинается с новой строки). Используется для построения сеток, обёрток и декоративных карточек.","\u003cspan> — строчный контейнер (живёт внутри строки текста, не разрывая абзац). Используется для раскраски отдельных слов, бейджей и иконок.","Используй \u003cdiv> и \u003cspan> только тогда, когда ни один смысловой тег (\u003cmain>, \u003cnav>, \u003carticle>, \u003cbutton>, \u003cstrong>, \u003cmark>) не подходит по смыслу."],"tags":["HTML","div","span","контейнер","обёртка","блочный","строчный"],"when":"Для технических обёрток Flexbox/Grid и цветовых акцентов внутри текста.","alternatives":"Никогда не вешай клики на \u003cdiv> или \u003cspan> вместо \u003cbutton> и \u003ca>.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/div"},{"lang":"html","id":"html-br-wbr","title":"HTML: перенос строки \u003cbr> и мягкая точка разрыва длинных слов \u003cwbr>","summary":"Принудительный перевод строки в стихах/адресах и подсказка браузеру, где безопасно перенести длинный URL.","code":"\u003cp class=\"address\">\n  г. Москва,\u003cbr>\n  ул. Тверская, д. 12, оф. 304\n\u003c/p>\n\n\u003c!-- Длинный URL аккуратно перенесётся по слэшам на узком экране смартфона -->\n\u003cp>\n  Документация: https://developer.mozilla.org/\u003cwbr>ru/\u003cwbr>docs/\u003cwbr>Web/\u003cwbr>CSS\n\u003c/p>","example":"overflow-wrap: break-word; /* CSS-альтернатива для переноса слишком длинных слов */","points":["Используй \u003cbr> только там, где разрыв строки является частью самого текста (поэзия, почтовые адреса, подписи).","Никогда не ставь несколько \u003cbr>\u003cbr> подряд для создания отступов между блоками — для этого существует CSS-свойство margin-bottom или gap!","Тег \u003cwbr> (Word Break Opportunity) невидим, пока строка помещается в экран, но указывает браузеру идеальное место для разрыва длинного слова или ссылки."],"tags":["HTML","br","wbr","перенос строки","длинное слово","разрыв"],"when":"В блоках адресов (\u003cbr>) и при выводе длинных технических путей, ссылок или хешей (\u003cwbr>).","alternatives":"Для автоматического переноса любых длинных строк без \u003cwbr> задай в CSS свойство overflow-wrap: anywhere;.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/wbr"},{"lang":"html","id":"html-iframe-youtube-map","title":"HTML: адаптивное встраивание карт и видео в \u003ciframe> с aspect-ratio","summary":"Безопасная вставка интерактивных карт и видеороликов с сохранением пропорций 16:9 на любых экранах.","code":"\u003cdiv class=\"embed-container\">\n  \u003ciframe\n    src=\"https://www.openstreetmap.org/export/embed.html\"\n    title=\"Карта проезда к офису\"\n    loading=\"lazy\"\n    referrerpolicy=\"no-referrer-when-downgrade\"\n    allowfullscreen\n  >\u003c/iframe>\n\u003c/div>","example":".embed-container iframe {\n  width: 100%;\n  aspect-ratio: 16 / 9;\n  border: 0;\n  border-radius: 8px;\n}","points":["Вместо устаревших HTML-атрибутов frameborder=\"0\" задавай в CSS border: 0; width: 100%; aspect-ratio: 16 / 9;.","Атрибут loading=\"lazy\" на \u003ciframe> экономит до 500 КБ трафика и ускоряет загрузку страницы, откладывая инициализацию карты до прокрутки.","Всегда указывай осмысленный атрибут title=\"...\" для прохождения проверок Lighthouse и доступности."],"tags":["HTML","iframe","map","video","embed","карта","видео","встраивание"],"when":"На странице «Контакты» для схемы проезда и в статьях с обучающими видео.","alternatives":"Для статичной схемы проезда можно показать лёгкую картинку карты со ссылкой на открытие навигатора.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/iframe"},{"lang":"html","id":"html-dialog-form-method","title":"HTML: закрытие модального окна через \u003cform method=\"dialog\"> без JS","summary":"Встроенный в HTML механизм автоматического закрытия нативного \u003cdialog> при нажатии на кнопку формы внутри него.","code":"\u003cdialog id=\"confirm-dialog\" open>\n  \u003ch3>Удалить черновик?\u003c/h3>\n  \u003cp>Это действие нельзя будет отменить.\u003c/p>\n\n  \u003c!-- Форма с method=\"dialog\" автоматически закрывает окно и передаёт value нажатой кнопки! -->\n  \u003cform method=\"dialog\" class=\"dialog-actions\">\n    \u003cbutton value=\"cancel\">Отмена\u003c/button>\n    \u003cbutton value=\"delete\" class=\"btn-danger\">Удалить\u003c/button>\n  \u003c/form>\n\u003c/dialog>","example":"dialog.addEventListener('close', () => console.log(dialog.returnValue)); // \"delete\" или \"cancel\"","points":["Когда внутри \u003cdialog> находится \u003cform method=\"dialog\">, нажатие на любую кнопку submit закрывает модальное окно без перезагрузки страницы и без единой строчки JS!","Значение атрибута value нажатой кнопки автоматически записывается в свойство dialog.returnValue.","Можно также добавить атрибут formmethod=\"dialog\" и formnovalidate отдельной кнопке «Отмена» внутри обычной POST-формы."],"tags":["HTML","dialog","method=\"dialog\"","returnValue","модальное окно","подтверждение"],"when":"В окнах подтверждения действий («Вы уверены?»), алертах и диалогах выбора.","alternatives":"Для отправки данных на сервер через fetch() перед закрытием используй обычный обработчик submit.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/dialog"},{"lang":"html","id":"html-details-animated","title":"HTML & CSS: плавная анимация раскрытия \u003cdetails> и ::details-content","summary":"Современная стилизация раскрывающегося блока \u003cdetails>/\u003csummary> с поворотом иконки и отступами.","code":"\u003cdetails class=\"custom-spoiler\" open>\n  \u003csummary>\n    \u003cspan>Технические требования к серверу\u003c/span>\n    \u003cspan class=\"spoiler-icon\" aria-hidden=\"true\">▾\u003c/span>\n  \u003c/summary>\n  \u003cdiv class=\"spoiler-body\">\n    \u003cp>PHP 8.2+, расширение PDO, поддержка HTTPS и 512 МБ оперативной памяти.\u003c/p>\n  \u003c/div>\n\u003c/details>","example":"details[open] .spoiler-icon {\n  transform: rotate(180deg);\n}","points":["Псевдокласс details[open] позволяет легко повернуть иконку стрелочки на 180 градусов и подсветить рамку при открытом спойлере.","Чтобы убрать стандартный системный треугольник браузера, задай summary { list-style: none; } и summary::-webkit-details-marker { display: none; }.","В новых браузерах псевдоэлемент details::details-content позволяет плавно анимировать высоту раскрытия на чистом CSS!"],"tags":["HTML","details","summary","spoiler","open","спойлер","раскрытие","гармошка"],"when":"Для скрытия длинных логов, дополнительных параметров фильтра и ответов в FAQ.","alternatives":"Кастомный спойлер на JS оправдан только если требуется сложная синхронизация с внешним стейтом.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/summary"},{"lang":"css","id":"css-line-height-letter-spacing","title":"CSS: ритм текста (line-height, letter-spacing, max-width: 65ch)","summary":"Профессиональные пропорции межстрочного интервала и межбуквенного расстояния для заголовков и основного текста.","code":"body {\n  font-size: 16px;\n  line-height: 1.6;        /* Безразмерный множитель (1.5–1.65) для комфортного чтения абзацев */\n  letter-spacing: -0.01em;\n}\n\nh1, h2, h3 {\n  line-height: 1.18;       /* У крупных заголовков межстрочный интервал всегда плотнее! */\n  letter-spacing: -0.025em;/* Лёгкая отрицательная разрядка собирает крупный заголовок */\n}\n\n.uppercase-badge {\n  text-transform: uppercase;\n  letter-spacing: 0.06em;  /* У КАПСА разрядку наоборот всегда увеличивают! */\n}","example":"/* Всегда задавай line-height без единиц измерения (1.5, а не 24px), чтобы он масштабировался от шрифта */","points":["Золотое правило типографики: чем крупнее шрифт (заголовки h1), тем меньше line-height (1.1–1.25) и плотнее letter-spacing (-0.02em ... -0.03em).","И наоборот: у мелкого текста, набранного ЗАГЛАВНЫМИ БУКВАМИ (uppercase), обязательно раздвигай буквы в плюс (letter-spacing: 0.05em–0.08em), иначе они слипнутся!","Задавай line-height безразмерным числом (1.6), а не в px или %, чтобы дочерние элементы корректно наследовали пропорцию."],"tags":["CSS","line-height","letter-spacing","uppercase","типографика","межстрочный интервал","кернинг"],"when":"В базовой таблице стилей любого сайта для настройки заголовков, статей и бейджей.","alternatives":"Стандартный браузерный line-height: normal (~1.2) слишком тесен для чтения длинных статей.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/line-height"},{"lang":"css","id":"css-white-space-word-break","title":"CSS: управление переносами строк (white-space, overflow-wrap, hyphens)","summary":"Запрет разрыва цен и кнопок на две строки (nowrap) и защита карточек от распирания длинными ссылками.","code":"/* Кнопки, бейджи и цены с символом рубля никогда не разрываются на две строки */\n.btn, .price-tag {\n  white-space: nowrap;\n}\n\n/* Длинные токены, URL и слова без пробелов аккуратно переносятся внутри карточки */\n.comment-text {\n  overflow-wrap: break-word;\n  word-break: break-word;\n}\n\n/* Блок кода сохраняет все отступы и переносы строк из исходника */\npre code {\n  white-space: pre;\n}","example":"white-space: pre-wrap; /* Сохраняет переносы строк \n из textarea, но переносит длинные строки по ширине блока! */","points":["white-space: nowrap запрещает перенос текста на новую строку — обязательно используй его на кнопках, табах и ценах («1 490 ₽»).","white-space: pre-wrap незаменим при выводе текста комментария или описания из \u003ctextarea>: он сохраняет абзацы пользователя (\n), не создавая горизонтального скролла!","overflow-wrap: anywhere гарантирует, что длинная ссылка в узкой колонке грида перенесётся, а не раздует всю сетку."],"tags":["CSS","white-space","nowrap","pre-wrap","overflow-wrap","word-break","перенос текста"],"when":"Для кнопок и цен (nowrap), вывода пользовательских сообщений (pre-wrap) и защиты узких карточек (overflow-wrap).","alternatives":"Для неразрывного пробела между числом и знаком валюты в HTML также можно использовать символ &nbsp;.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/white-space"},{"lang":"css","id":"css-grid-auto-flow-dense","title":"CSS: плотная упаковка сетки (grid-auto-flow: dense) и span ячеек","summary":"Построение бенто-сеток (Bento Grid) с карточками разного размера (2×1, 2×2) и автоматическим заполнением пустот.","code":".bento-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n  grid-auto-rows: 180px;\n  grid-auto-flow: dense; /* Автоматически подтягивает маленькие карточки в пустые дырки сетки! */\n  gap: 16px;\n}\n\n.card-wide {\n  grid-column: span 2;   /* Занимает 2 колонки по ширине */\n}\n\n.card-tall {\n  grid-row: span 2;      /* Занимает 2 ряда по высоте */\n}","example":"@media (max-width: 600px) {\n  .card-wide { grid-column: span 1; }\n}","points":["Ключевое слово span 2 в grid-column или grid-row растягивает карточку на две соседние ячейки без жёсткой привязки к номерам линий.","Свойство grid-auto-flow: dense разрешает браузеру переставить следующую маленькую карточку (1×1) наверх, если перед широкой карточкой (2×1) осталась свободная ячейка!","На мобильных экранах (где всего 1 колонка) не забудь сбросить .card-wide { grid-column: span 1; }, чтобы сетка не создала вторую скрытую колонку."],"tags":["CSS","grid-auto-flow","dense","bento grid","grid-column","grid-row","span","бенто сетка"],"when":"При верстке современных продуктовых витрин в стиле Bento Grid, дашбордов и фотогалерей.","alternatives":"Без dense перед крупной карточкой может остаться пустая дырка в конце строки.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/grid-auto-flow"},{"lang":"css","id":"css-cursor-caret-scroll","title":"CSS: стилизация курсора ввода (caret-color), выделения и скролла","summary":"Детали полировки интерфейса: фирменный цвет мигающего курсора в инпутах и плавная прокрутка.","code":"input, textarea, [contenteditable] {\n  caret-color: #38bdf8; /* Цвет мигающей вертикальной палочки курсора при наборе текста */\n}\n\nbutton:disabled,\ninput:disabled {\n  cursor: not-allowed;\n  opacity: 0.55;\n}\n\n.draggable-handle {\n  cursor: grab;\n}\n.draggable-handle:active {\n  cursor: grabbing;\n}","example":"cursor: pointer;","points":["Свойство caret-color перекрашивает мигающий текстовый курсор внутри инпутов и редакторов кода под акцентный цвет бренда.","Для перетаскиваемых карточек используй пару курсоров cursor: grab в покое и cursor: grabbing при зажатой кнопке мыши (:active).","На заблокированных кнопках (:disabled) ставь cursor: not-allowed для понятной обратной связи."],"tags":["CSS","caret-color","cursor","grab","not-allowed","курсор","инпут"],"when":"При тонкой настройке полей ввода, редакторов кода и drag-and-drop списков.","alternatives":"Не ставь cursor: pointer на некликабельные карточки — это вводит пользователя в заблуждение.","url":"https://developer.mozilla.org/ru/docs/Web/CSS/caret-color"},{"lang":"javascript","id":"js-json-parse-stringify","title":"JS: безопасная сериализация JSON (JSON.stringify, JSON.parse и форматирование)","summary":"Преобразование объектов в строку с отступами для красивого вывода и безопасный парсинг без падения скрипта.","code":"const settings = { theme: 'dark', fontSize: 14, tags: ['html', 'css'] };\n\n// Красивый вывод JSON с отступами в 2 пробела (третий аргумент = 2)\nconst prettyJson = JSON.stringify(settings, null, 2);\n\n// Безопасная функция парсинга с фолбэком при битой строке\nfunction safeJsonParse(str, fallback = null) {\n  try {\n    return JSON.parse(str);\n  } catch {\n    return fallback;\n  }\n}","example":"const data = safeJsonParse(localStorage.getItem('cart'), []);","points":["Вызов JSON.parse() на пустой или повреждённой строке выбрасывает синхронную ошибку SyntaxError и роняет весь скрипт — ВСЕГДА оборачивай чтение из localStorage в try/catch!","Третий параметр в JSON.stringify(data, null, 2) форматирует JSON с переносами строк и отступами в 2 пробела (идеально для вывода в \u003cpre> или скачивания файла).","Помни, что JSON не сохраняет функции, undefined, Map/Set, а объекты Date превращает в строки ISO."],"tags":["JavaScript","JSON","JSON.parse","JSON.stringify","try","catch","сериализация"],"when":"При сохранении данных в localStorage, отправке тела fetch-запросов и экспорте настроек в файл.","alternatives":"Для глубокого клонирования объекта в памяти используй быстрый structuredClone(obj) вместо JSON.parse(JSON.stringify(obj)).","url":"https://developer.mozilla.org/ru/docs/Web/JavaScript/Reference/Global_Objects/JSON/stringify"},{"lang":"javascript","id":"js-timers-raf","title":"JS: таймеры (setTimeout, setInterval, clearInterval) и requestAnimationFrame","summary":"Отложенный запуск действий, периодическое обновление секундомера и плавная анимация с частотой монитора.","code":"// 1. Однократный запуск через 2 секунды с возможностью отмены\nconst timeoutId = setTimeout(() => {\n  hideNotification();\n}, 2000);\n// clearTimeout(timeoutId); // если нужно отменить до срабатывания\n\n// 2. Плавный цикл отрисовки строго под герцовку экрана (60/120/144 Гц)\nfunction animateProgress(startTime) {\n  const elapsed = performance.now() - startTime;\n  const progress = Math.min(elapsed / 1000, 1); // от 0 до 1 за 1 секунду\n  progressBar.style.transform = `scaleX(${progress})`;\n\n  if (progress \u003c 1) {\n    requestAnimationFrame(() => animateProgress(startTime));\n  }\n}\nrequestAnimationFrame(() => animateProgress(performance.now()));","example":"const intervalId = setInterval(tick, 1000);\nclearInterval(intervalId);","points":["Всегда сохраняй ID, возвращаемый setInterval() и setTimeout(), чтобы очищать таймер через clearInterval(id) при закрытии окна или уходе со страницы (защита от утечек памяти)!","Для любых визуальных анимаций и перетаскивания используй requestAnimationFrame() вместо setInterval(..., 16) — он синхронизируется с обновлением экрана и автоматически встаёт на паузу в фоновой вкладке.","Для точного замера времени выполнения используй performance.now() вместо Date.now()."],"tags":["JavaScript","setTimeout","setInterval","clearTimeout","requestAnimationFrame","performance","таймер"],"when":"Для автоскрытия тостов (setTimeout), обратного отсчёта (setInterval) и плавной графики (requestAnimationFrame).","alternatives":"Для периодического опроса сервера лучше использовать рекурсивный setTimeout после завершения await fetch(), чтобы запросы не накладывались друг на друга при медленной сети!","url":"https://developer.mozilla.org/ru/docs/Web/API/Window/requestAnimationFrame"},{"lang":"javascript","id":"js-download-blob-file","title":"JS: генерация и скачивание файла прямо в браузере (Blob + URL.createObjectURL)","summary":"Экспорт сгенерированного кода, JSON-бэкапа или CSV-таблицы на диск пользователя в один клик без участия сервера.","code":"function downloadFile(filename, content, mimeType = 'text/plain;charset=utf-8') {\n  const blob = new Blob([content], { type: mimeType });\n  const url = URL.createObjectURL(blob);\n\n  const link = document.createElement('a');\n  link.href = url;\n  link.download = filename;\n  document.body.appendChild(link);\n  link.click();\n\n  // Очищаем временную ссылку и освобождаем память!\n  link.remove();\n  URL.revokeObjectURL(url);\n}\n\n// Пример: скачать готовый HTML-шаблон\ndownloadFile('index.html', '\u003c!doctype html>\u003ch1>Привет!\u003c/h1>', 'text/html;charset=utf-8');","example":"downloadFile('backup.json', JSON.stringify(data, null, 2), 'application/json');","points":["Конструктор new Blob([content], { type }) создаёт виртуальный файл в оперативной памяти браузера из любой строки или массива байт.","После вызова link.click() обязательно вызывай URL.revokeObjectURL(url), чтобы освободить выделенную под Blob память браузера!","Для корректного открытия русских CSV-таблиц в Microsoft Excel добавь в начало строки UTF-8 BOM-маркер: new Blob([\"\\uFEFF\" + csvText], { type: \"text/csv;charset=utf-8\" })."],"tags":["JavaScript","Blob","createObjectURL","revokeObjectURL","download","скачать файл","экспорт","csv"],"when":"В генераторах кода, песочницах, экспорте настроек в JSON и выгрузке отчётов в CSV.","alternatives":"Не требует отправки данных на сервер и работает даже полностью офлайн.","url":"https://developer.mozilla.org/ru/docs/Web/API/Blob"},{"lang":"javascript","id":"js-drag-and-drop-files","title":"JS: зона перетаскивания файлов мышью (Drag & Drop: dragover, drop)","summary":"Обработка перетаскивания файлов из проводника в окно браузера с подсветкой рамки и чтением e.dataTransfer.files.","code":"const dropZone = document.getElementById('drop-zone');\n\n// Обязательно вызываем e.preventDefault() в dragover, иначе браузер просто откроет картинку во вкладке!\ndropZone.addEventListener('dragover', (e) => {\n  e.preventDefault();\n  dropZone.classList.add('is-dragover');\n});\n\ndropZone.addEventListener('dragleave', () => {\n  dropZone.classList.remove('is-dragover');\n});\n\ndropZone.addEventListener('drop', (e) => {\n  e.preventDefault();\n  dropZone.classList.remove('is-dragover');\n\n  const files = Array.from(e.dataTransfer.files);\n  console.log('Перетащили файлов:', files.length);\n});","example":".drop-zone.is-dragover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.08); }","points":["Главный секрет Drag & Drop API: чтобы событие drop вообще сработало и браузер не открыл перетащенную картинку вместо сайта, ОБЯЗАТЕЛЬНО вызывай e.preventDefault() и в dragover, и в drop!","Список перетащенных файлов находится в объекте e.dataTransfer.files (имеет точно такой же формат FileList, как и у обычного \u003cinput type=\"file\">).","Для доступности всегда помещай внутрь зоны перетаскивания обычный \u003cinput type=\"file\">, чтобы файл можно было выбрать и стандартным кликом."],"tags":["JavaScript","drag and drop","dragover","drop","dataTransfer","files","перетаскивание","загрузка"],"when":"В загрузчиках изображений, документов, импорте JSON-бэкапов и облачных хранилищах.","alternatives":"Обычный \u003clabel> вокруг \u003cinput type=\"file\"> также поддерживает нативное перетаскивание файла прямо на инпут в ряде браузеров.","url":"https://developer.mozilla.org/ru/docs/Web/API/HTML_Drag_and_Drop_API/File_drag_and_drop"},{"lang":"javascript","id":"js-intersection-lazy-toc","title":"JS: чтение и запись CSS-переменных (setProperty / getComputedStyle)","summary":"Динамическая передача координат курсора, скролла или цветовой палитры из JavaScript напрямую в CSS-переменные.","code":"const root = document.documentElement;\n\n// 1. Запись нового значения в CSS-переменную --accent\nroot.style.setProperty('--accent', '#10b981');\n\n// 2. Эффект подсветки карточки за курсором мыши (Spotlight Card)\ncard.addEventListener('pointermove', (e) => {\n  const rect = card.getBoundingClientRect();\n  card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);\n  card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);\n});\n\n// 3. Чтение актуального значения переменной из CSS\nconst currentBg = getComputedStyle(root).getPropertyValue('--bg').trim();","example":".card { background: radial-gradient(300px circle at var(--mouse-x) var(--mouse-y), rgba(56,189,248,0.12), transparent); }","points":["Вместо того чтобы менять десятки инлайновых стилей из JS, измени одну CSS-переменную через element.style.setProperty(\"--val\", x) — и все зависящие от неё правила перестроятся сами!","Паттерн передачи --mouse-x и --mouse-y позволяет делать эффектные радиальные блики на карточках в 5 строчек кода.","Метод style.removeProperty(\"--accent\") сбрасывает переменную обратно к значению из таблицы стилей."],"tags":["JavaScript","setProperty","getComputedStyle","getPropertyValue","CSS variables","переменные","spotlight"],"when":"В визуальных генераторах, редакторах тем оформления, параллаксах и интерактивных карточках.","alternatives":"Для простого переключения фиксированных состояний лучше использовать classList.toggle() вместо инлайновых переменных.","url":"https://developer.mozilla.org/ru/docs/Web/API/CSSStyleDeclaration/setProperty"},{"lang":"php","id":"php-date-intl-formatting","title":"PHP 8: форматирование дат, таймзоны и склонение слов (numfmt / plural)","summary":"Работа с московским временем, форматами дат и правильное русское склонение числительных («1 товар, 2 товара, 5 товаров»).","code":"\u003c?php\ndeclare(strict_types=1);\n\n// Универсальная функция склонения существительных после числа на русском языке\nfunction pluralRu(int $number, array $forms): string {\n    // $forms = ['товар', 'товара', 'товаров']\n    $n = abs($number) % 100;\n    $n1 = $n % 10;\n    if ($n > 10 && $n \u003c 20) return \"$number {$forms[2]}\";\n    if ($n1 > 1 && $n1 \u003c 5) return \"$number {$forms[1]}\";\n    if ($n1 === 1)          return \"$number {$forms[0]}\";\n    return \"$number {$forms[2]}\";\n}\n\necho pluralRu(1, ['статья', 'статьи', 'статей']);  // \"1 статья\"\necho pluralRu(4, ['статья', 'статьи', 'статей']);  // \"4 статьи\"\necho pluralRu(12, ['статья', 'статьи', 'статей']); // \"12 статей\"","example":"date_default_timezone_set('Europe/Moscow');","points":["В русском языке три формы множественного числа: для 1 (статья), для 2–4 (статьи) и для 5–20 (статей). Функция pluralRu() решает эту задачу в 8 строк.","В базе данных время лучше хранить в UTC (или TIMESTAMP), а переводить в часовой пояс пользователя при выводе через DateTimeImmutable::setTimezone().","Для форматирования цен с пробелами-разделителями тысяч в PHP используй number_format($price, 0, \",\", \" \") . \" ₽\" (например: \"14 990 ₽\")."],"tags":["PHP","plural","number_format","date","timezone","склонение","валюта","числа"],"when":"При выводе количества товаров в корзине, просмотров статьи, комментариев и цен в рублях.","alternatives":"Если на хостинге установлено расширение PHP intl, можно также использовать класс MessageFormatter.","url":"https://www.php.net/manual/ru/function.number-format.php"},{"lang":"php","id":"php-superglobals-server-url","title":"PHP 8: суперглобальный массив $_SERVER, определение HTTPS, IP и роутинг","summary":"Чтение текущего пути URI без GET-параметров, метода запроса (GET/POST), заголовка Authorization и HTTPS.","code":"\u003c?php\ndeclare(strict_types=1);\n\n$method = $_SERVER['REQUEST_METHOD'] ?? 'GET';\n// Чистый путь без GET-параметров (например, \"/catalog/items\" из \"/catalog/items?page=2\")\n$path = parse_url($_SERVER['REQUEST_URI'] ?? '/', PHP_URL_PATH) ?: '/';\n\n// Надёжная проверка HTTPS (включая работу за обратным прокси Nginx / Cloudflare)\n$isHttps = (!empty($_SERVER['HTTPS']) && $_SERVER['HTTPS'] !== 'off')\n        || (($_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https');\n\n// Простой роутер на выражении match из PHP 8\nmatch ([$method, $path]) {\n    ['GET',  '/']          => renderHome(),\n    ['GET',  '/api/items'] => sendJsonItems(),\n    ['POST', '/api/items'] => createItem(),\n    default                => sendNotFound(),\n};","example":"$bearerToken = $_SERVER['HTTP_AUTHORIZATION'] ?? '';","points":["Функция parse_url($_SERVER[\"REQUEST_URI\"], PHP_URL_PATH) отрезает строку ?page=2&sort=asc, оставляя чистый маршрут для роутера.","На хостингах с связкой Nginx + Apache (и за Cloudflare) HTTPS часто передаётся в заголовке $_SERVER[\"HTTP_X_FORWARDED_PROTO\"] === \"https\".","Все клиентские HTTP-заголовки в PHP попадают в $_SERVER с префиксом HTTP_ в верхнем регистре (например, X-Api-Key становится $_SERVER[\"HTTP_X_API_KEY\"])."],"tags":["PHP","SERVER","REQUEST_URI","REQUEST_METHOD","parse_url","router","https","роутер"],"when":"Во входном файле index.php при написании микрофреймворков, REST API и обработчиков вебхуков.","alternatives":"Никогда не используй $_SERVER[\"PHP_SELF\"] без экранирования в атрибуте action формы из-за риска XSS.","url":"https://www.php.net/manual/ru/reserved.variables.server.php"},{"lang":"recipes","id":"recipe-sticky-header-scroll","title":"Рецепт: Шапка сайта с эффектом стекла и тенью при начале прокрутки","summary":"Добавление компактности и нижней границы фиксированной шапке в момент, когда пользователь начал скроллить страницу.","code":"\u003cheader class=\"site-header\" id=\"header\">\n  \u003cdiv class=\"header-inner\">DevShelf\u003c/div>\n\u003c/header>\n\n\u003cscript>\nconst header = document.getElementById('header');\n\n// Пассивный слушатель scroll не блокирует плавность прокрутки на смартфонах!\nwindow.addEventListener('scroll', () => {\n  header.classList.toggle('is-scrolled', window.scrollY > 12);\n}, { passive: true });\n\u003c/script>","example":".site-header.is-scrolled {\n  background: rgba(9, 13, 20, 0.88);\n  backdrop-filter: blur(12px);\n  border-bottom-color: rgba(255, 255, 255, 0.12);\n}","points":["Опция { passive: true } в addEventListener(\"scroll\", ...) сообщает браузеру, что внутри обработчика не будет вызываться preventDefault(), поэтому браузер может крутить страницу в отдельном потоке с идеальными 120 FPS!","Метод classList.toggle(\"is-scrolled\", window.scrollY > 12) лаконично включает класс при прокрутке ниже 12px и снимает при возврате наверх.","В состоянии покоя наверху шапка может быть полностью прозрачной, а при скролле обретать матовый фон backdrop-filter: blur(12px)."],"tags":["рецепт","sticky header","scroll","passive","шапка","скролл","навбар"],"when":"На лендингах, корпоративных сайтах и в документации с фиксированной верхней панелью.","alternatives":"Можно также использовать IntersectionObserver с пустым 1px-элементом на самом верху страницы.","url":"https://developer.mozilla.org/ru/docs/Web/API/EventTarget/addEventListener"},{"lang":"recipes","id":"recipe-skeleton-loader","title":"Рецепт: Анимированный скелетон загрузки карточек (Skeleton Shimmer)","summary":"Плавный блик загрузки на месте будущих карточек и текста, избавляющий от дёргающихся спиннеров и скачков верстки.","code":"\u003cdiv class=\"skeleton-card\" aria-busy=\"true\" aria-label=\"Загрузка карточки\">\n  \u003cdiv class=\"skeleton skeleton-thumb\">\u003c/div>\n  \u003cdiv class=\"skeleton skeleton-title\">\u003c/div>\n  \u003cdiv class=\"skeleton skeleton-text\">\u003c/div>\n\u003c/div>\n\n\u003cstyle>\n.skeleton {\n  background: linear-gradient(90deg, #121827 25%, #1e293b 50%, #121827 75%);\n  background-size: 200% 100%;\n  animation: shimmer 1.5s infinite linear;\n  border-radius: 6px;\n}\n.skeleton-thumb { height: 140px; margin-bottom: 12px; }\n.skeleton-title { height: 20px; width: 70%; margin-bottom: 8px; }\n.skeleton-text  { height: 14px; width: 90%; }\n\n@keyframes shimmer {\n  from { background-position: 200% 0; }\n  to   { background-position: -200% 0; }\n}\n\u003c/style>","example":"/* Атрибут aria-busy=\"true\" сообщает скринридеру, что блок находится в процессе подгрузки */","points":["Скелетон повторяет точную высоту будущей карточки, поэтому после прихода ответа от fetch() контент встаёт на место без единого скачка страницы.","Увеличение background-size: 200% 100% и сдвиг background-position от 200% к -200% создают иллюзию бегущего светового блика.","Атрибут aria-busy=\"true\" на контейнере временно скрывает пустые блоки-заглушки от чтения скринридером до загрузки реальных данных."],"tags":["рецепт","skeleton","shimmer","loader","загрузка","скелетон","анимация"],"when":"При асинхронной подгрузке каталога товаров, профиля пользователя, ленты новостей и аналитики.","alternatives":"Для быстрых операций быстрее 150 мс скелетон лучше не мигать, чтобы не создавать лишнего мелькания.","url":"https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Attributes/aria-busy"},{"lang":"recipes","id":"recipe-password-toggle","title":"Рецепт: Поле пароля с кнопкой «Показать / скрыть пароль» (глазок)","summary":"Удобное переключение типа поля между password и text с сохранением фокуса и правильными ARIA-атрибутами.","code":"\u003cdiv class=\"password-field\">\n  \u003cinput type=\"password\" id=\"pass-input\" placeholder=\"Введите пароль\" autocomplete=\"current-password\">\n  \u003cbutton type=\"button\" id=\"pass-toggle\" aria-label=\"Показать пароль\" aria-pressed=\"false\">\n    Показать\n  \u003c/button>\n\u003c/div>\n\n\u003cscript>\nconst input = document.getElementById('pass-input');\nconst toggle = document.getElementById('pass-toggle');\n\ntoggle.addEventListener('click', () => {\n  const isHidden = input.type === 'password';\n  input.type = isHidden ? 'text' : 'password';\n  toggle.textContent = isHidden ? 'Скрыть' : 'Показать';\n  toggle.setAttribute('aria-pressed', String(isHidden));\n  input.focus();\n});\n\u003c/script>","example":".password-field { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; }","points":["Переключение свойства input.type = \"text\" / \"password\" мгновенно раскрывает или маскирует введённые символы точками.","Обязательно ставь кнопке переключения type=\"button\", иначе клик по «глазку» внутри формы отправит саму форму!","Вызов input.focus() после клика возвращает курсор обратно в поле, чтобы пользователь мог сразу продолжить печатать."],"tags":["рецепт","password","пароль","показать пароль","глазок","форма","авторизация"],"when":"Во всех формах входа, регистрации и смены пароля для снижения числа опечаток со смартфона.","alternatives":"В браузерах Edge есть встроенный системный значок глаза, который можно скрыть через input::-ms-reveal { display: none; }, чтобы он не дублировал твою кнопку.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Element/input/password"},{"lang":"recipes","id":"recipe-scroll-progress-bar","title":"Рецепт: Индикатор прогресса чтения статьи в самом верху экрана","summary":"Тонкая акцентная полоска над шапкой сайта, плавно заполняющаяся от 0% до 100% по мере прокрутки длинной статьи.","code":"\u003cdiv id=\"reading-progress\" class=\"reading-progress\" aria-hidden=\"true\">\u003c/div>\n\n\u003cstyle>\n.reading-progress {\n  position: fixed;\n  top: 0;\n  left: 0;\n  width: 100%;\n  height: 3px;\n  background: linear-gradient(90deg, #38bdf8, #818cf8);\n  transform-origin: left;\n  transform: scaleX(0);\n  z-index: 200;\n}\n\u003c/style>\n\n\u003cscript>\nconst bar = document.getElementById('reading-progress');\nwindow.addEventListener('scroll', () => {\n  const scrollable = document.documentElement.scrollHeight - window.innerHeight;\n  const ratio = scrollable > 0 ? window.scrollY / scrollable : 0;\n  bar.style.transform = `scaleX(${Math.min(Math.max(ratio, 0), 1)})`;\n}, { passive: true });\n\u003c/script>","example":"/* Используем transform: scaleX(...) вместо изменения width для идеальной плавности на GPU! */","points":["Полная доступная высота прокрутки страницы вычисляется как documentElement.scrollHeight минус высота видимого окна window.innerHeight.","Анимация ширины через transform: scaleX(ratio) с transform-origin: left работает на видеокарте без пересчёта геометрии (в отличие от изменения width: 54%).","В новейших браузерах такой прогресс-бар можно сделать даже без JS через CSS animation-timeline: scroll()!"],"tags":["рецепт","прогресс чтения","scroll progress","скролл","статья","индикатор"],"when":"В блогах, длинных руководствах документации и лонгридах.","alternatives":"CSS Scroll-Driven Animations (animation-timeline: scroll(root)) поддерживаются в современных Chromium-браузерах.","url":"https://developer.mozilla.org/en-US/docs/Web/CSS/animation-timeline"},{"lang":"html","id":"html-meta-charset-viewport","title":"HTML: \u003cmeta name=\"viewport\"> и управление масштабом на смартфонах","summary":"Точная настройка ширины области просмотра, запрет нежелательного сдвига клавиатуры и доступный зум.","code":"\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, interactive-widget=resizes-content\">","example":"/* Не используй user-scalable=no или maximum-scale=1 — это блокирует зум слабовидящим и снижает балл Lighthouse! */","points":["width=device-width сообщает мобильному браузеру использовать реальную CSS-ширину экрана (например, 390px), а не эмулировать десктопный монитор 980px.","Новый параметр interactive-widget=resizes-content корректно сжимает высоту 100dvh при появлении экранной клавиатуры на Android/iOS!","Никогда не ставь user-scalable=no: чтобы iOS Safari сам не зумил страницу при клике в инпут, просто задай всем \u003cinput> размер шрифта не меньше 16px (font-size: 16px)!"],"tags":["HTML","viewport","meta","mobile","scale","zoom","клавиатура","мобильная верстка"],"when":"В секции \u003chead> абсолютно каждой адаптивной страницы.","alternatives":"Для предотвращения автозума инпутов на iPhone используй font-size: max(16px, 1rem) на полях форм.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Viewport_meta_tag"},{"lang":"html","id":"html-table-colgroup-tfoot","title":"HTML: итоги таблицы \u003ctfoot> и стилизация колонок \u003ccolgroup>, \u003ccol>","summary":"Семантический подвал таблицы с итоговой суммой и задание ширины или фона целым столбцам через \u003ccolgroup>.","code":"\u003ctable>\n  \u003ccolgroup>\n    \u003ccol style=\"width: 60%\">\n    \u003ccol style=\"width: 20%\">\n    \u003ccol class=\"highlight-col\" style=\"width: 20%\">\n  \u003c/colgroup>\n  \u003cthead>\n    \u003ctr>\u003cth>Услуга\u003c/th>\u003cth>Часы\u003c/th>\u003cth>Сумма\u003c/th>\u003c/tr>\n  \u003c/thead>\n  \u003ctbody>\n    \u003ctr>\u003ctd>Разработка фронтенда\u003c/td>\u003ctd>40\u003c/td>\u003ctd>80 000 ₽\u003c/td>\u003c/tr>\n  \u003c/tbody>\n  \u003ctfoot>\n    \u003ctr>\u003cth colspan=\"2\">Итого к оплате:\u003c/th>\u003ctd>\u003cstrong>80 000 ₽\u003c/strong>\u003c/td>\u003c/tr>\n  \u003c/tfoot>\n\u003c/table>","example":"table { table-layout: fixed; width: 100%; } /* Быстрая отрисовка таблицы по ширине первой строки */","points":["Тег \u003ccolgroup> с вложенными \u003ccol> позволяет задать width или background сразу всему столбцу таблицы без дублирования класса на каждой ячейке \u003ctd>.","\u003ctfoot> размечает строку с итоговыми суммами и при печати многостраничной таблицы автоматически дублируется внизу каждого листа.","CSS-свойство table-layout: fixed ускоряет расчёт широких таблиц: браузер берёт ширину колонок из \u003ccolgroup> или первой строки, не пересчитывая все 1000 строк."],"tags":["HTML","tfoot","colgroup","col","table-layout","таблица","итого","столбцы"],"when":"В счетах на оплату, корзинах товаров, сметах и сравнительных таблицах тарифов.","alternatives":"Если итоговая строка не нужна, секцию \u003ctfoot> можно не указывать.","url":"https://developer.mozilla.org/ru/docs/Web/HTML/Reference/Elements/colgroup"},{"lang":"html","id":"html-input-range-number-step","title":"HTML: ползунок \u003cinput type=\"range\"> с делениями \u003cdatalist> и шагом step","summary":"Настройка ползунков громкости, цены или калькулятора кредита с магнитными засечками и выводом значения.","code":"\u003clabel for=\"loan-term\">Срок: \u003coutput id=\"term-val\">12\u003c/output> мес.\u003c/label>\n\u003cinput\n  type=\"range\"\n  id=\"loan-term\"\n  min=\"3\"\n  max=\"36\"\n  step=\"3\"\n  value=\"12\"\n  list=\"term-ticks\"\n  oninput=\"document.getElementById('term-val').value = this.value\"\n>\n\u003cdatalist id=\"term-ticks\">\n  \u003coption value=\"3\" label=\"3м\">\u003c/option>\n  \u003coption value=\"12\" label=\"1г\">\u003c/option>\n  \u003coption value=\"24\" label=\"2г\">\u003c/option>\n  \u003coption value=\"36\" label=\"3г\">\u003c/option>\n\u003c/datalist>","example":"\u003cinput type=\"number\" min=\"0\" max=\"100\" step=\"0.01\"> /* Разрешает ввод дробных копеек! */","points":["По умолчанию у \u003cinput type=\"number\"> и \u003cinput type=\"range\"> шаг step равен 1 (разрешены только целые числа). Чтобы разрешить ввод копеек или дробных чисел, укажи step=\"0.01\" или step=\"any\"!","Привязка \u003cdatalist> через атрибут list к ползунку type=\"range\" рисует нативные риски-деления вдоль дорожки ползунка.","Событие input срабатывает непрерывно в момент пер
